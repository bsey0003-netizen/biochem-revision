t":false,"why":"The sequences differ, which is what makes the comparison informative."},{"id":"c","text":"Cytochrome c sequences are determined by diet, so related species that eat similar food share them","correct":false,"why":"Sequences are encoded genetically."},{"id":"d","text":"Sequences reveal only an organism's body size, which tends to be similar in closely related species","correct":false,"why":"Sequence similarity reflects ancestry, not body size."}]}],"flashcards":[{"id":"u7-f001","type":"flashcard","unit":7,"part":1,"outcome":"The peptide bond","source":"slides","front":"Properties of the peptide bond?","back":"Short, rigid, planar, trans; partial double-bond character. Rotation only about φ (N–Cα) and ψ (Cα–C)."},{"id":"u7-f002","type":"flashcard","unit":7,"part":1,"outcome":"The peptide bond","source":"slides","front":"Direction in which peptides are written and numbered?","back":"From the N-terminus (free α-NH3⁺) to the C-terminus (free α-COO⁻)."},{"id":"u7-f003","type":"flashcard","unit":7,"part":1,"outcome":"Primary structure and peptide ionisation","source":"slides","front":"Primary structure?","back":"The amino acid sequence, encoded by DNA. It determines the 3D fold and function."},{"id":"u7-f004","type":"flashcard","unit":7,"part":1,"outcome":"Primary structure and peptide ionisation","source":"slides","front":"Which groups contribute charge in a peptide?","back":"The N-terminal α-NH3⁺, the C-terminal α-COO⁻ and ionisable side chains. Internal α-groups are in peptide bonds."},{"id":"u7-f005","type":"flashcard","unit":7,"part":1,"outcome":"Primary structure and peptide ionisation","source":"slides","front":"Conjugated protein classes with examples?","back":"Lipoprotein (β1-lipoprotein), glycoprotein (IgG), phosphoprotein (casein), haemoprotein (haemoglobin), flavoprotein (succinate dehydrogenase), metalloprotein (ferritin – Fe; alcohol dehydrogenase – Zn)."},{"id":"u7-f006","type":"flashcard","unit":7,"part":1,"outcome":"Protein sequencing","source":"slides","front":"Edman degradation vs mass spectrometry?","back":"Edman: removes the N-terminal residue one cycle at a time. MS (MALDI, ESI): precise masses, detects post-translational modifications."},{"id":"u7-f007","type":"flashcard","unit":7,"part":1,"outcome":"Protein purification and analysis","source":"slides","front":"Ion exchange, size exclusion and affinity chromatography separate by…?","back":"Charge; size (large proteins elute first); specific ligand binding."},{"id":"u7-f008","type":"flashcard","unit":7,"part":1,"outcome":"Protein purification and analysis","source":"slides","front":"What binds a cation exchanger?","back":"Net positive proteins, i.e. at a pH below their pI. The beads are negatively charged."},{"id":"u7-f009","type":"flashcard","unit":7,"part":1,"outcome":"Protein purification and analysis","source":"slides","front":"SDS-PAGE vs isoelectric focusing?","back":"SDS-PAGE: by mass (SDS denatures, uniform negative charge; small proteins fastest). IEF: by pI. 2D gel = IEF then SDS-PAGE."},{"id":"u7-f010","type":"flashcard","unit":7,"part":1,"outcome":"Protein purification and analysis","source":"slides","front":"Specific activity?","back":"Activity ÷ total protein (units/mg). It rises as purity increases; total activity (yield) usually falls."}]},{"unit":8,"title":"3D structure of proteins","outcomes":["Secondary structure","Tertiary structure, domains and motifs","Forces stabilising protein structure","Quaternary structure","Folding, denaturation and chaperones"],"summary":{"overview":"A polypeptide folds into regular local shapes (secondary structure), packs these into a compact 3D form (tertiary structure) and may assemble with other chains (quaternary structure). Weak interactions plus disulfide bonds hold the native fold; chaperones help proteins fold, and misfolding causes disease.","sections":[{"heading":"Secondary structure","points":["α-Helix: a right-handed coil with side chains pointing outwards, stabilised by backbone H-bonds between the C=O of residue n and the N–H of residue n + 4. It is the main structure in keratins.","Proline breaks helices, because of its rigid ring and its lack of an N–H.","β-Sheet: almost fully extended strands joined by backbone H-bonds between strands. Strands can be parallel (same N→C direction) or antiparallel; one chain can fold back on itself.","β-Turns: about four residues that reverse the chain's direction. Pro and Gly are common here."]},{"heading":"Tertiary structure, domains and motifs","points":["Tertiary structure is the full 3D fold of one chain; the primary structure determines it.","Globular proteins bury hydrophobic side chains inside and expose hydrophilic ones on the surface.","Motif (supersecondary structure): a recurring arrangement of helices and strands, found in many proteins.","Domain: an independently stable part of a chain, often with its own function (e.g. SH2 and SH3 domains for binding other proteins). A domain can contain several motifs."]},{"heading":"Stabilising forces","points":["Disulfide bonds (covalent, Cys–Cys) increase resistance to denaturation, especially in extracellular proteins.","The hydrophobic effect, from burying non-polar side chains, is the major driving force for folding.","Hydrogen bonds involve the backbone and polar side chains such as Ser, Thr, Asn and Gln.","Ionic interactions (salt bridges) form between Asp/Glu (–COO⁻) and Lys/Arg (–NH3⁺)."]},{"heading":"Quaternary structure","points":["Quaternary structure is the arrangement of two or more polypeptide subunits, which may be identical or different.","Subunits are held by non-covalent forces (H-bonds, ionic bonds, hydrophobic interactions), e.g. haemoglobin α2β2."]},{"heading":"Folding, denaturation and chaperones","points":["Denaturation is loss of the native 3D shape; the sequence is unchanged. It can be reversible, but not always.","Causes: heat or radiation (break H-bonds, e.g. cooked egg white), strong acids or alkalis and high salt (break ionic bonds), heavy metals (bind carboxylates and precipitate proteins), and organic solvents and detergents (disrupt hydrophobic interactions; alcohol disinfects this way).","Chaperones help folding: Hsp70 binds nascent chains as they leave the ribosome; the Hsp60/Hsp10 chaperonin folds proteins inside its cavity using ATP.","Misfolded proteins are normally degraded. Some form insoluble amyloid fibres, as in Alzheimer's, Huntington's and Parkinson's diseases and in prion diseases such as scrapie and BSE."]}],"keyTerms":[{"term":"α-Helix","definition":"Coiled backbone stabilised by C=O(n)···H–N(n+4) hydrogen bonds."},{"term":"β-Sheet","definition":"Extended strands linked side by side by backbone hydrogen bonds; parallel or antiparallel."},{"term":"β-Turn","definition":"Four-residue structure that reverses chain direction; often contains Pro or Gly."},{"term":"Motif","definition":"Recurring supersecondary arrangement of helices and/or strands."},{"term":"Domain","definition":"Independently stable folded unit of a polypeptide, often with a distinct function."},{"term":"Quaternary structure","definition":"Arrangement of multiple polypeptide subunits."},{"term":"Denaturation","definition":"Loss of native 3D structure without breaking peptide bonds."},{"term":"Chaperone","definition":"Protein that assists the folding of other proteins (e.g. Hsp70, Hsp60)."},{"term":"Amyloid","definition":"Insoluble fibrous aggregate of a misfolded protein."}],"examTips":["α-Helix H-bonds run between backbone C=O and N–H, four residues apart; side chains point OUT.","Denaturation leaves the primary structure intact; peptide bonds break only under harsh, prolonged conditions.","The hydrophobic effect is the main driving force for folding; disulfides are the main COVALENT stabilisers.","Domain = independently stable unit; motif = recurring pattern of secondary elements."]},"questions":[{"id":"u8-q001","type":"mcq","unit":8,"part":1,"outcome":"Secondary structure","bloom":"understand","difficulty":1,"source":"slides","stem":"What stabilises an α-helix?","options":[{"id":"a","text":"Hydrogen bonds between backbone C=O groups and N–H groups four residues further along","correct":true,"why":"Every backbone C=O(n) bonds to N–H(n+4), with the side chains pointing outwards."},{"id":"b","text":"Disulfide bonds between neighbouring residues, which link each turn of the helix to the next","correct":false,"why":"Disulfides are side-chain cross-links, not the basis of helices."},{"id":"c","text":"Ionic bonds between the side chains on adjacent strands, which hold the coil tightly together","correct":false,"why":"Strands belong to β-sheets, and helix stability comes from backbone H-bonds."},{"id":"d","text":"Hydrogen bonds between the side chains and the surrounding water molecules only","correct":false,"why":"Helix H-bonds are internal to the backbone."}]},{"id":"u8-q002","type":"mcq","unit":8,"part":1,"outcome":"Secondary structure","bloom":"understand","difficulty":2,"source":"slides","stem":"How does a β-sheet differ from an α-helix?","options":[{"id":"a","text":"Its strands are almost fully extended and H-bond to neighbouring strands, parallel or antiparallel","correct":true,"why":"In a sheet, the H-bonds run between strands rather than within a coil."},{"id":"b","text":"It has no hydrogen bonds at all and is held together by disulfide bonds between strands","correct":false,"why":"All the backbone C=O and N–H groups take part in inter-strand H-bonds."},{"id":"c","text":"It can only form between two separate polypeptide chains, not within a single folded chain","correct":false,"why":"A single chain can fold back on itself to form a sheet."},{"id":"d","text":"It is the main structure in α-keratin, where its extended strands give hair its great strength","correct":false,"why":"α-Keratin is mostly α-helix; silk fibroin is rich in β-sheet."}]},{"id":"u8-q003","type":"mcq","unit":8,"part":1,"outcome":"Secondary structure","bloom":"remember","difficulty":1,"source":"slides","stem":"Which two amino acids are especially common in β-turns?","options":[{"id":"a","text":"Proline and glycine","correct":true,"why":"Proline's kink and glycine's flexibility both suit tight turns that reverse chain direction."},{"id":"b","text":"Leucine and isoleucine","correct":false,"why":"These bulky hydrophobic residues prefer helices and buried positions."},{"id":"c","text":"Lysine and arginine","correct":false,"why":"These are not characteristic of turns."},{"id":"d","text":"Cysteine and methionine","correct":false,"why":"Sulphur-containing residues are not typical turn residues."}]},{"id":"u8-q004","type":"mcq","unit":8,"part":1,"outcome":"Tertiary structure, domains and motifs","bloom":"understand","difficulty":2,"source":"slides","stem":"What is the difference between a protein domain and a motif?","options":[{"id":"a","text":"A domain is an independently stable folded unit; a motif is a recurring arrangement of secondary structure","correct":true,"why":"A domain can contain several motifs and can move as a unit."},{"id":"b","text":"They are the same thing: both terms describe a region of a protein that binds a particular ligand","correct":false,"why":"They describe different levels of organisation."},{"id":"c","text":"A motif is a whole folded protein, whereas a domain is a single amino acid within the active site","correct":false,"why":"Motifs are a few secondary elements; domains are larger folded units."},{"id":"d","text":"Domains occur only in fibrous proteins, while motifs occur only in globular proteins such as enzymes","correct":false,"why":"Domains are typical of globular proteins."}]},{"id":"u8-q005","type":"mcq","unit":8,"part":1,"outcome":"Tertiary structure, domains and motifs","bloom":"understand","difficulty":1,"source":"slides","stem":"In a water-soluble globular protein, where are the polar and non-polar side chains usually found?","options":[{"id":"a","text":"Non-polar side chains are buried inside; polar and charged side chains are on the surface","correct":true,"why":"This arrangement maximises the hydrophobic effect and keeps the surface soluble."},{"id":"b","text":"Non-polar side chains are on the surface, and polar ones are buried inside to H-bond together","correct":false,"why":"This would make the protein insoluble and unstable in water."},{"id":"c","text":"They are randomly distributed, because folding depends only on backbone hydrogen bonds","correct":false,"why":"Folding sorts residues by polarity."},{"id":"d","text":"The side chains point into a central water channel that runs through the folded protein","correct":false,"why":"Globular proteins are compact, with a dry hydrophobic core."}]},{"id":"u8-q006","type":"mcq","unit":8,"part":1,"outcome":"Forces stabilising protein structure","bloom":"understand","difficulty":2,"source":"slides","stem":"Which interaction is considered the main driving force for the folding of globular proteins?","options":[{"id":"a","text":"The hydrophobic effect","correct":true,"why":"Burying non-polar side chains releases ordered water, a large entropy gain."},{"id":"b","text":"Disulfide bonds","correct":false,"why":"Disulfides stabilise the fold but form after it; many proteins have none."},{"id":"c","text":"Peptide bonds","correct":false,"why":"Peptide bonds make the chain (primary structure), not the fold."},{"id":"d","text":"Covalent bonds to water","correct":false,"why":"Water does not bond covalently to proteins during folding."}]},{"id":"u8-q007","type":"mcq","unit":8,"part":1,"outcome":"Forces stabilising protein structure","bloom":"apply","difficulty":2,"source":"slides","stem":"Many extracellular proteins, such as antibodies and digestive enzymes, contain several disulfide bonds. Why is this useful?","options":[{"id":"a","text":"Covalent cross-links make the fold more resistant to denaturation outside the cell","correct":true,"why":"Disulfides 'staple' parts of the chain together."},{"id":"b","text":"Disulfides make proteins positively charged, which keeps them soluble in the blood plasma","correct":false,"why":"Disulfide bonds are uncharged."},{"id":"c","text":"Disulfides are the main force holding a protein together, so most proteins need them","correct":false,"why":"Non-covalent forces dominate; disulfides add extra stability."},{"id":"d","text":"Disulfides form peptide bonds between subunits, joining them into a single polypeptide chain","correct":false,"why":"Disulfides link Cys side chains; they are not peptide bonds."}]},{"id":"u8-q008","type":"mcq","unit":8,"part":1,"outcome":"Forces stabilising protein structure","bloom":"remember","difficulty":1,"source":"slides","stem":"A salt bridge in a protein is an interaction between which side chains?","options":[{"id":"a","text":"A negatively charged Asp or Glu and a positively charged Lys or Arg","correct":true,"why":"Opposite charges attract (ionic interaction)."},{"id":"b","text":"Two cysteines, whose –SH groups are oxidised to form a bridge","correct":false,"why":"Two cysteines form a covalent disulfide."},{"id":"c","text":"Two leucines, whose non-polar side chains pack against each other","correct":false,"why":"Leucines interact hydrophobically."},{"id":"d","text":"Serine and water, sharing a hydrogen bond at the protein surface","correct":false,"why":"This is an H-bond, not an ionic interaction."}]},{"id":"u8-q009","type":"mcq","unit":8,"part":1,"outcome":"Quaternary structure","bloom":"understand","difficulty":1,"source":"slides","stem":"Which statement about quaternary structure is correct?","options":[{"id":"a","text":"It describes how two or more polypeptide subunits are arranged, held mainly by non-covalent forces","correct":true,"why":"Example: haemoglobin's α2β2 tetramer."},{"id":"b","text":"Every protein has quaternary structure, even those that are made of only a single polypeptide chain","correct":false,"why":"Monomeric proteins, such as myoglobin, have none."},{"id":"c","text":"Its subunits are joined end to end by peptide bonds, forming one long continuous chain","correct":false,"why":"Subunits are separate chains, usually joined non-covalently."},{"id":"d","text":"It is another name for the amino acid sequence, read from the N-terminus to the C-terminus","correct":false,"why":"That is primary structure."}]},{"id":"u8-q010","type":"mcq","unit":8,"part":1,"outcome":"Folding, denaturation and chaperones","bloom":"understand","difficulty":1,"source":"slides","stem":"When egg white is cooked, its proteins coagulate. What has happened at the molecular level?","options":[{"id":"a","text":"Heat has disrupted weak bonds, so the proteins unfolded (denatured) and aggregated; the sequence is unchanged","correct":true,"why":"Denaturation destroys 3D shape, not primary structure."},{"id":"b","text":"Heat has hydrolysed the peptide bonds into free amino acids, which then stick together as a solid","correct":false,"why":"Normal cooking does not break peptide bonds."},{"id":"c","text":"New peptide bonds have formed between neighbouring proteins, joining them into one huge polymer","correct":false,"why":"Aggregation is non-covalent, not peptide-bond formation."},{"id":"d","text":"The proteins have been converted into fats by the heat, which is why cooked egg white turns opaque","correct":false,"why":"No chemical conversion to lipid occurs."}]},{"id":"u8-q011","type":"mcq","unit":8,"part":1,"outcome":"Folding, denaturation and chaperones","bloom":"apply","difficulty":2,"source":"slides","stem":"Why does 70% ethanol work as a skin disinfectant before an injection?","options":[{"id":"a","text":"It disrupts hydrophobic interactions and H-bonding in bacterial proteins, denaturing them","correct":true,"why":"Organic solvents unfold proteins, inactivating essential bacterial enzymes and structures."},{"id":"b","text":"It breaks bacterial DNA into free nucleotides, so the bacteria can no longer make proteins","correct":false,"why":"Ethanol mainly acts on proteins and membranes."},{"id":"c","text":"It forms new disulfide bonds that lock bacterial proteins in place so that they cannot move","correct":false,"why":"Ethanol is not an oxidant that creates disulfides."},{"id":"d","text":"It provides a nutrient that bacteria cannot digest, so they starve on the surface of the skin","correct":false,"why":"Ethanol kills bacteria by denaturation, not starvation."}]},{"id":"u8-q012","type":"mcq","unit":8,"part":1,"outcome":"Folding, denaturation and chaperones","bloom":"understand","difficulty":2,"source":"slides","stem":"What is the role of the Hsp60/Hsp10 chaperonin system in mitochondria?","options":[{"id":"a","text":"It encloses unfolded proteins in a cavity and helps them fold through repeated ATP-dependent cycles","correct":true,"why":"Many mitochondrial proteins are imported unfolded and fold with chaperonin help."},{"id":"b","text":"It degrades newly made proteins so that only the correctly folded copies leave the ribosome","correct":false,"why":"Chaperones aid folding; degradation is done by proteases and the proteasome."},{"id":"c","text":"It adds new peptide bonds to growing polypeptide chains as they enter the mitochondrial matrix","correct":false,"why":"Peptide bonds are made by the ribosome."},{"id":"d","text":"It works without any energy input, using only the hydrophobic effect to pull the chains into shape","correct":false,"why":"Chaperonin cycles require ATP."}]},{"id":"u8-q013","type":"mcq","unit":8,"part":1,"outcome":"Folding, denaturation and chaperones","bloom":"analyse","difficulty":3,"source":"general","stem":"Scrapie in sheep and BSE in cattle are caused by a normal cellular protein adopting an abnormal conformation. What does this illustrate?","options":[{"id":"a","text":"A protein with an unchanged sequence can misfold into insoluble β-rich amyloid that damages tissue","correct":true,"why":"Prion diseases, like Alzheimer's, are protein-misfolding disorders; the misfolded form converts normal copies."},{"id":"b","text":"These diseases are caused by a change in the protein's primary structure, as in sickle-cell disease","correct":false,"why":"In infectious prion disease the sequence is the same; the conformation differs."},{"id":"c","text":"Misfolded proteins are degraded harmlessly, so the damage comes from a separate virus","correct":false,"why":"Amyloid aggregates resist degradation and accumulate."},{"id":"d","text":"The proteins are denatured into random coils by the heat of the brain, so they lose their function","correct":false,"why":"The abnormal form is a different, highly ordered aggregate."}]},{"id":"u8-q014","type":"mcq","unit":8,"part":1,"outcome":"Folding, denaturation and chaperones","bloom":"understand","difficulty":2,"source":"slides","stem":"Heavy-metal ions such as Pb²⁺ and Hg²⁺ are toxic partly because of their effect on proteins. What do they do?","options":[{"id":"a","text":"They bind carboxylate and thiol side chains, disrupting ionic interactions so that proteins precipitate","correct":true,"why":"Denaturation and precipitation inactivate enzymes."},{"id":"b","text":"They hydrolyse the peptide bonds in the protein, breaking it down into its free amino acids","correct":false,"why":"They act on side-chain interactions, not the backbone."},{"id":"c","text":"They act as chaperones that refold proteins into abnormal shapes that the cell cannot use","correct":false,"why":"They disrupt, rather than assist, folding."},{"id":"d","text":"They increase protein solubility so much that proteins leak out of cells and are lost in urine","correct":false,"why":"They reduce net charge and solubility."}]},{"id":"u8-q015","type":"mcq","unit":8,"part":1,"outcome":"Tertiary structure, domains and motifs","bloom":"analyse","difficulty":3,"source":"general","stem":"A purified enzyme is fully unfolded with urea and its disulfides reduced. After slowly removing the urea and re-oxidising, full activity returns. What does this show?","options":[{"id":"a","text":"All the information needed for the native 3D fold is contained in the amino acid sequence","correct":true,"why":"This classic experiment (Anfinsen, ribonuclease) showed that primary structure determines tertiary structure."},{"id":"b","text":"Urea creates new peptide bonds as it is removed, rebuilding the enzyme's active site","correct":false,"why":"Urea disrupts non-covalent interactions; it makes no peptide bonds."},{"id":"c","text":"Chaperones are always essential for folding, so some must have been present in the sample","correct":false,"why":"This protein refolded without chaperones (though many proteins in cells need help)."},{"id":"d","text":"Denaturation always permanently destroys proteins, so the enzyme must have been re-made","correct":false,"why":"Here denaturation was reversible."}]}],"flashcards":[{"id":"u8-f001","type":"flashcard","unit":8,"part":1,"outcome":"Secondary structure","source":"slides","front":"α-Helix: H-bond pattern and side-chain direction?","back":"Backbone H-bonds: C=O of residue n to N–H of residue n + 4. Side chains point outwards; Pro breaks helices."},{"id":"u8-f002","type":"flashcard","unit":8,"part":1,"outcome":"Secondary structure","source":"slides","front":"Parallel vs antiparallel β-sheet?","back":"Parallel: all strands run N→C in the same direction. Antiparallel: neighbouring strands alternate. Both are H-bonded between strands."},{"id":"u8-f003","type":"flashcard","unit":8,"part":1,"outcome":"Secondary structure","source":"slides","front":"β-Turn?","back":"About four residues that reverse chain direction; often contains Pro and Gly."},{"id":"u8-f004","type":"flashcard","unit":8,"part":1,"outcome":"Tertiary structure, domains and motifs","source":"slides","front":"Domain vs motif?","back":"Domain: independently stable unit, often with its own function. Motif: recurring arrangement of helices and strands (supersecondary structure)."},{"id":"u8-f005","type":"flashcard","unit":8,"part":1,"outcome":"Forces stabilising protein structure","source":"slides","front":"Four forces stabilising tertiary structure?","back":"Disulfide bonds (covalent), hydrophobic interactions, hydrogen bonds, ionic interactions (salt bridges)."},{"id":"u8-f006","type":"flashcard","unit":8,"part":1,"outcome":"Quaternary structure","source":"slides","front":"Quaternary structure?","back":"Arrangement of two or more subunits, held by non-covalent forces, e.g. haemoglobin α2β2."},{"id":"u8-f007","type":"flashcard","unit":8,"part":1,"outcome":"Folding, denaturation and chaperones","source":"slides","front":"Denaturation?","back":"Loss of native 3D shape with the sequence unchanged. Sometimes reversible (renaturation)."},{"id":"u8-f008","type":"flashcard","unit":8,"part":1,"outcome":"Folding, denaturation and chaperones","source":"slides","front":"Denaturing agents and what they disrupt?","back":"Heat or radiation: H-bonds. Strong acid or alkali and high salt: ionic bonds. Heavy metals: bind carboxylates and thiols. Organic solvents and detergents: hydrophobic interactions."},{"id":"u8-f009","type":"flashcard","unit":8,"part":1,"outcome":"Folding, denaturation and chaperones","source":"slides","front":"Hsp70 vs Hsp60/10?","back":"Hsp70: binds nascent chains leaving the ribosome to prevent premature folding. Hsp60/10: chaperonin cavity that folds proteins using ATP (e.g. in mitochondria)."},{"id":"u8-f010","type":"flashcard","unit":8,"part":1,"outcome":"Folding, denaturation and chaperones","source":"slides","front":"Examples of protein-misfolding diseases?","back":"Alzheimer's, Huntington's and Parkinson's diseases (amyloid fibres); prion diseases such as scrapie and BSE."}]},{"unit":9,"title":"Fibrous proteins","outcomes":["Features of fibrous proteins","α-Keratin","Collagen","Silk fibroin"],"summary":{"overview":"Fibrous proteins are long, insoluble structural proteins built from one repeating type of secondary structure. α-Keratin (coiled α-helices, many disulfides) gives hair and horn their strength; collagen (a Gly–X–Y triple helix) gives tendons their tensile strength; silk fibroin (stacked β-sheets) is strong and flexible but does not stretch.","sections":[{"heading":"General features","points":["Long strands or sheets made of simple repeating secondary-structure elements, which give strength and/or flexibility.","Insoluble in water: hydrophobic residues inside AND on the surface are buried when many chains pack into supramolecular complexes."]},{"heading":"α-Keratin","points":["Found in mammals: hair, wool, nails, horn, hooves and the outer skin; part of the intermediate-filament family.","Two right-handed α-helices wind around each other into a left-handed coiled coil, like a rope.","The helix–helix contact surface is hydrophobic (Ala, Val, Leu, Ile, Met, Phe).","Disulfide cross-links add strength. The hardest keratin, rhinoceros horn, has about 18% Cys.","Permanent waving: reduce the disulfides, set the hair in curls, then re-oxidise to form new disulfides in the new positions."]},{"heading":"Collagen","points":["Gives strength to tendons, cartilage, bone matrix and cornea; tensile strength is greater than steel wire of the same cross-section.","Each chain is a left-handed helix with about 3 residues per turn (not an α-helix). Three chains supertwist into a right-handed triple helix.","The repeating sequence is Gly–X–Y, where X is often Pro and Y often 4-hydroxyproline (4-Hyp). The chain is about 35% Gly, 11% Ala and 21% Pro + Hyp.","Gly must sit at every third position because only its tiny side chain fits in the crowded centre of the triple helix.","Prolyl and lysyl hydroxylases need vitamin C. Without it, under-hydroxylated collagen is unstable, causing scurvy in humans, guinea pigs, other primates and fruit bats.","Covalent cross-links between Lys, hydroxylysine and His residues increase with age, making connective tissue stiffer and more brittle.","Gelatin is denatured collagen; it is poor in essential amino acids, so it has little nutritional value."]},{"heading":"Silk fibroin","points":["Made by insects and spiders. It consists of antiparallel β-sheets rich in Ala and Gly, whose small side chains let the sheets pack closely and interlock.","Stabilised by H-bonds and van der Waals contacts, with no covalent cross-links, which makes it flexible.","It does not stretch, because the β-strands are already almost fully extended."]}],"keyTerms":[{"term":"Fibrous protein","definition":"Elongated, insoluble structural protein built from a repeating secondary structure."},{"term":"Coiled coil","definition":"Two α-helices twisted around each other, as in α-keratin."},{"term":"Triple helix","definition":"Three left-handed collagen chains supertwisted in a right-handed sense."},{"term":"Gly–X–Y repeat","definition":"Collagen's sequence motif: Gly every third residue, X often Pro, Y often 4-Hyp."},{"term":"4-Hydroxyproline","definition":"Post-translationally hydroxylated Pro that stabilises collagen (needs vitamin C)."},{"term":"Scurvy","definition":"Vitamin C deficiency causing defective collagen, fragile capillaries and bleeding."},{"term":"Silk fibroin","definition":"β-Sheet protein rich in Ala and Gly; strong, flexible and non-stretchy."}],"examTips":["Keratin = α-helix coiled coil + disulfides; collagen = triple helix with Gly every 3rd residue; silk = β-sheet.","Collagen chains are LEFT-handed helices with a RIGHT-handed supertwist; keratin is the opposite (right-handed helices, left-handed supertwist).","Vitamin C is needed to hydroxylate Pro and Lys in collagen, not to make the chains.","Wool stretches (helices extend); silk doesn't (sheets are already extended)."]},"questions":[{"id":"u9-q001","type":"mcq","unit":9,"part":1,"outcome":"Features of fibrous proteins","bloom":"understand","difficulty":1,"source":"slides","stem":"Why are fibrous proteins such as keratin and collagen insoluble in water?","options":[{"id":"a","text":"They are rich in hydrophobic residues, inside and on the surface, buried by packing many chains together","correct":true,"why":"Close packing hides the hydrophobic surfaces from water, producing insoluble fibres."},{"id":"b","text":"They contain no amino acids, only long lipid chains, which repel water like the tails of a membrane","correct":false,"why":"They are proteins made of amino acids."},{"id":"c","text":"They are made mostly of charged residues, which bind each other so tightly that water can't get in","correct":false,"why":"Highly charged proteins tend to be soluble."},{"id":"d","text":"They are permanently denatured, so their unfolded chains clump together as soon as they are made","correct":false,"why":"They are functional, folded proteins."}]},{"id":"u9-q002","type":"mcq","unit":9,"part":1,"outcome":"α-Keratin","bloom":"understand","difficulty":2,"source":"slides","stem":"Which description of α-keratin structure is correct?","options":[{"id":"a","text":"Two right-handed α-helices wound into a left-handed coiled coil, joined by a hydrophobic surface","correct":true,"why":"Ala, Val, Leu, Ile, Met and Phe line the interface, and disulfides cross-link neighbouring chains."},{"id":"b","text":"Three left-handed helices wound into a right-handed triple helix, with Gly at every third residue","correct":false,"why":"That describes collagen."},{"id":"c","text":"Stacked antiparallel β-sheets rich in Ala and Gly, whose small side chains interlock tightly","correct":false,"why":"That describes silk fibroin."},{"id":"d","text":"A single compact globular domain with a hydrophobic core and a polar surface","correct":false,"why":"Keratin is fibrous."}]},{"id":"u9-q003","type":"mcq","unit":9,"part":1,"outcome":"α-Keratin","bloom":"apply","difficulty":2,"source":"slides","stem":"Rhinoceros horn is one of the hardest α-keratins, with about 18% of its residues being cysteine. Why does this make it so hard?","options":[{"id":"a","text":"Many cysteines form covalent disulfide cross-links between keratin chains","correct":true,"why":"More disulfide 'staples' make the fibre stiffer and harder."},{"id":"b","text":"Cysteine makes the keratin helices left-handed, which packs them more tightly","correct":false,"why":"Handedness comes from L-amino acid geometry, not Cys content."},{"id":"c","text":"Cysteine is the most hydrophobic amino acid, so it excludes water from the horn","correct":false,"why":"Cys's key role here is covalent disulfide formation."},{"id":"d","text":"Cysteine forms extra peptide bonds between chains, joining them into one polymer","correct":false,"why":"Cross-links between chains are disulfide, not peptide, bonds."}]},{"id":"u9-q004","type":"mcq","unit":9,"part":1,"outcome":"α-Keratin","bloom":"apply","difficulty":2,"source":"slides","stem":"How does a 'permanent wave' treatment curl hair?","options":[{"id":"a","text":"A reducing agent breaks disulfides, the hair is set in curlers, then an oxidant forms new disulfides","correct":true,"why":"Moving the covalent cross-links fixes the new shape."},{"id":"b","text":"Heat breaks the peptide bonds in keratin and then re-forms them in new positions around the curler","correct":false,"why":"Peptide bonds are not broken."},{"id":"c","text":"Water dissolves the keratin, which then re-crystallises in a curled shape as the hair slowly dries","correct":false,"why":"Keratin is insoluble in water."},{"id":"d","text":"Collagen is added to the hair shaft, where it forms a triple helix that holds the curl in place","correct":false,"why":"Hair is keratin; collagen plays no role."}]},{"id":"u9-q005","type":"mcq","unit":9,"part":1,"outcome":"Collagen","bloom":"understand","difficulty":2,"source":"slides","stem":"Why must glycine occupy every third position in the collagen sequence (Gly–X–Y)?","options":[{"id":"a","text":"Its tiny side chain (H) is the only one that fits in the crowded centre of the triple helix","correct":true,"why":"Any larger residue at these positions distorts the triple helix."},{"id":"b","text":"Glycine forms disulfide bonds between the three chains, which holds the triple helix together","correct":false,"why":"Glycine has no –SH group."},{"id":"c","text":"Glycine is hydroxylated by a vitamin C-dependent enzyme, which lets it H-bond to the other chains","correct":false,"why":"Pro and Lys are hydroxylated, not Gly."},{"id":"d","text":"Glycine is the only chiral amino acid, so it alone gives the collagen chain its left-handed twist","correct":false,"why":"Glycine is the only achiral standard amino acid."}]},{"id":"u9-q006","type":"mcq","unit":9,"part":1,"outcome":"Collagen","bloom":"remember","difficulty":1,"source":"slides","stem":"How are collagen chains arranged in the triple helix?","options":[{"id":"a","text":"Each chain is a left-handed helix (about 3 residues per turn); the three supertwist right-handedly","correct":true,"why":"The opposite twisting of chain and supertwist gives great tensile strength."},{"id":"b","text":"Each chain is a right-handed α-helix, and two of the chains wind into a left-handed coiled coil","correct":false,"why":"That describes α-keratin."},{"id":"c","text":"The three chains lie side by side as flat parallel β-sheets, held together by backbone H-bonds","correct":false,"why":"That is closer to silk fibroin."},{"id":"d","text":"A single chain folds back on itself into a compact globular domain with a hydrophobic core","correct":false,"why":"Collagen is a three-chain fibrous protein."}]},{"id":"u9-q007","type":"mcq","unit":9,"part":1,"outcome":"Collagen","bloom":"apply","difficulty":2,"source":"slides","stem":"A guinea pig fed only cereal pellets with no added vitamin C develops bleeding gums, a rough coat and painful joints. What is the biochemical defect?","options":[{"id":"a","text":"Prolyl and lysyl hydroxylases lack their vitamin C cofactor, so collagen's triple helix is unstable","correct":true,"why":"Guinea pigs, like humans, cannot make ascorbate; without 4-Hyp collagen is weak, so capillaries are fragile (scurvy)."},{"id":"b","text":"The collagen genes are deleted in guinea pigs, so no collagen is made unless vitamin C switches them on","correct":false,"why":"The collagen genes are normal; the problem is post-translational modification."},{"id":"c","text":"Glycine cannot be synthesised without vitamin C, so every third residue of collagen is missing","correct":false,"why":"Glycine is non-essential and is not the issue."},{"id":"d","text":"Disulfide bonds in keratin are reduced without vitamin C, so the skin and coat lose their strength","correct":false,"why":"The connective-tissue defect lies in collagen."}]},{"id":"u9-q008","type":"mcq","unit":9,"part":1,"outcome":"Collagen","bloom":"analyse","difficulty":3,"source":"slides","stem":"A mutation replaces a single glycine in a Gly–X–Y repeat of type I collagen with a bulky residue, causing fragile bones. Why does one substitution have such a large effect?","options":[{"id":"a","text":"The bulky side chain can't fit in the helix centre, so it disrupts packing of all three chains","correct":true,"why":"This is the molecular basis of osteogenesis imperfecta-type defects."},{"id":"b","text":"Glycine is needed for hydroxylation by vitamin C, so the whole chain is left under-hydroxylated","correct":false,"why":"Hydroxylation targets Pro and Lys."},{"id":"c","text":"The mutation changes collagen into a keratin-like protein, which cannot form bone matrix fibres","correct":false,"why":"A point mutation does not change protein identity."},{"id":"d","text":"Collagen does not need a regular sequence, so the mutation must have deleted the whole chain","correct":false,"why":"The strict Gly–X–Y repeat is essential."}]},{"id":"u9-q009","type":"mcq","unit":9,"part":1,"outcome":"Collagen","bloom":"understand","difficulty":2,"source":"slides","stem":"Why do tendons and skin become stiffer and more brittle in older animals?","options":[{"id":"a","text":"Covalent cross-links between Lys, hydroxylysine and His in collagen accumulate with age","correct":true,"why":"More cross-links reduce flexibility."},{"id":"b","text":"Collagen is gradually replaced by silk fibroin, which is stiffer and much less elastic","correct":false,"why":"Mammals don't make fibroin."},{"id":"c","text":"Glycine is slowly removed from collagen, so the chains can no longer slide","correct":false,"why":"The sequence doesn't change with age."},{"id":"d","text":"Vitamin C levels rise with age, so collagen becomes over-hydroxylated and rigid","correct":false,"why":"The change is in cross-linking."}]},{"id":"u9-q010","type":"mcq","unit":9,"part":1,"outcome":"Collagen","bloom":"analyse","difficulty":3,"source":"general","stem":"β-Aminopropionitrile, found in some Lathyrus (sweet pea) seeds, inhibits lysyl oxidase, the enzyme that starts collagen cross-linking. What would you expect in animals eating these seeds?","options":[{"id":"a","text":"Weak connective tissue (bone deformities, weak blood vessels), as collagen can't be cross-linked","correct":true,"why":"Triple helices still form, but without cross-links the fibres lack tensile strength (lathyrism)."},{"id":"b","text":"Excessively rigid tendons and joints, because collagen fibres become over-cross-linked","correct":false,"why":"Blocking cross-linking makes tissue weaker, not stiffer."},{"id":"c","text":"Harder hooves and horns, because more keratin disulfides form when lysyl oxidase is blocked","correct":false,"why":"Lysyl oxidase acts on collagen and elastin, not keratin disulfides."},{"id":"d","text":"No visible effect, because collagen fibres are strong enough without any covalent cross-links","correct":false,"why":"Cross-links are essential for collagen strength."}]},{"id":"u9-q011","type":"mcq","unit":9,"part":1,"outcome":"Collagen","bloom":"understand","difficulty":1,"source":"slides","stem":"Gelatin, made from collagen, is a poor protein source in an animal's diet. Why?","options":[{"id":"a","text":"Its composition is dominated by Gly, Pro and Hyp and is low in several essential amino acids","correct":true,"why":"Protein quality depends on supplying every essential amino acid."},{"id":"b","text":"It cannot be digested by any protease in the gut, so it passes through the intestine unchanged","correct":false,"why":"Gelatin is denatured collagen and is easily digested."},{"id":"c","text":"It contains mainly D-amino acids, which animals cannot use to build their own proteins","correct":false,"why":"Its amino acids are L-isomers."},{"id":"d","text":"It is a carbohydrate, not a protein, so it supplies energy but no amino acids","correct":false,"why":"Gelatin is a protein."}]},{"id":"u9-q012","type":"mcq","unit":9,"part":1,"outcome":"Silk fibroin","bloom":"understand","difficulty":2,"source":"slides","stem":"What allows the β-sheets of silk fibroin to pack so closely?","options":[{"id":"a","text":"Fibroin is rich in Ala and Gly, whose small side chains interlock between stacked sheets","correct":true,"why":"Small R groups allow tight packing, stabilised by H-bonds and van der Waals contacts."},{"id":"b","text":"It contains many disulfide cross-links, which pull the sheets tightly against each other","correct":false,"why":"Fibroin has essentially no covalent cross-links, which is why it is flexible."},{"id":"c","text":"It is rich in bulky Trp and Tyr residues, whose rings stack flat between neighbouring sheets","correct":false,"why":"Bulky residues would prevent close packing."},{"id":"d","text":"It forms α-helical coiled coils, which pack more closely than any other secondary structure","correct":false,"why":"That is keratin; fibroin is β-sheet."}]},{"id":"u9-q013","type":"mcq","unit":9,"part":1,"outcome":"Silk fibroin","bloom":"analyse","difficulty":3,"source":"slides","stem":"Wool can be stretched to nearly twice its length when steamed, but silk barely stretches. What is the structural explanation?","options":[{"id":"a","text":"Wool's α-helices can be pulled into extended chains; silk's β-strands are already almost fully extended","correct":true,"why":"Secondary structure determines mechanical behaviour."},{"id":"b","text":"Silk contains more disulfide bonds than wool, and these covalent cross-links stop its chains from sliding","correct":false,"why":"Wool keratin is the disulfide-rich one."},{"id":"c","text":"Wool is made of collagen, whose triple helix unwinds in steam and lets the fibre stretch to twice its length","correct":false,"why":"Wool is α-keratin."},{"id":"d","text":"Silk is a globular protein whose compact folded domains cannot be pulled apart without breaking the fibre","correct":false,"why":"Silk fibroin is fibrous."}]},{"id":"u9-q014","type":"mcq","unit":9,"part":1,"outcome":"Silk fibroin","bloom":"understand","difficulty":2,"source":"slides","stem":"Silk is strong yet very flexible. Which feature explains its flexibility?","options":[{"id":"a","text":"Its sheets are held only by weak non-covalent interactions, with no covalent cross-links","correct":true,"why":"Sheets can slide slightly relative to each other without breaking."},{"id":"b","text":"It is a coiled coil of α-helices that can stretch and spring back like a telephone cord","correct":false,"why":"That is keratin."},{"id":"c","text":"It contains 18% cysteine, whose disulfide bonds can break and re-form as the fibre bends","correct":false,"why":"That is rhinoceros-horn keratin."},{"id":"d","text":"It is a triple helix whose three chains can slide past each other when the fibre is bent","correct":false,"why":"That is collagen."}]}],"flashcards":[{"id":"u9-f001","type":"flashcard","unit":9,"part":1,"outcome":"Features of fibrous proteins","source":"slides","front":"Features of fibrous proteins?","back":"Long strands or sheets of one repeating secondary structure; strength or flexibility; insoluble (hydrophobic surfaces buried by packing)."},{"id":"u9-f002","type":"flashcard","unit":9,"part":1,"outcome":"α-Keratin","source":"slides","front":"α-Keratin structure?","back":"Two right-handed α-helices in a left-handed coiled coil; hydrophobic interface; disulfide cross-links. Hair, wool, nails, horn."},{"id":"u9-f003","type":"flashcard","unit":9,"part":1,"outcome":"α-Keratin","source":"slides","front":"How does a permanent wave work?","back":"Reduce the disulfides → set the curl → re-oxidise to form new disulfides."},{"id":"u9-f004","type":"flashcard","unit":9,"part":1,"outcome":"Collagen","source":"slides","front":"Collagen repeat and composition?","back":"Gly–X–Y (X often Pro, Y often 4-Hyp). About 35% Gly, 11% Ala, 21% Pro + Hyp."},{"id":"u9-f005","type":"flashcard","unit":9,"part":1,"outcome":"Collagen","source":"slides","front":"Collagen helix handedness?","back":"Each chain is a left-handed helix (~3 residues per turn); three chains form a right-handed supertwist (triple helix)."},{"id":"u9-f006","type":"flashcard","unit":9,"part":1,"outcome":"Collagen","source":"slides","front":"Why Gly at every 3rd position?","back":"Only Gly is small enough to fit in the crowded centre of the triple helix."},{"id":"u9-f007","type":"flashcard","unit":9,"part":1,"outcome":"Collagen","source":"slides","front":"Vitamin C and collagen?","back":"Vitamin C is the cofactor for prolyl and lysyl hydroxylases. Deficiency → unstable collagen → scurvy (humans, primates, guinea pigs, fruit bats)."},{"id":"u9-f008","type":"flashcard","unit":9,"part":1,"outcome":"Collagen","source":"slides","front":"Why does connective tissue stiffen with age?","back":"Covalent Lys, hydroxylysine and His cross-links accumulate in collagen."},{"id":"u9-f009","type":"flashcard","unit":9,"part":1,"outcome":"Silk fibroin","source":"slides","front":"Silk fibroin structure?","back":"Antiparallel β-sheets rich in Ala and Gly, packed closely; H-bonds and van der Waals; no covalent cross-links."},{"id":"u9-f010","type":"flashcard","unit":9,"part":1,"outcome":"Silk fibroin","source":"slides","front":"Why is silk flexible but not stretchy?","back":"Flexible: only weak interactions between sheets. Not stretchy: the β-strands are already fully extended."}]},{"unit":10,"title":"Oxygen-binding proteins","outcomes":["Structure of myoglobin and haemoglobin","The oxygen-binding centre","Cooperativity","Allosteric effectors","Abnormal haemoglobins"],"summary":{"overview":"Myoglobin stores O2 in muscle; haemoglobin carries it in the blood. Both bind O2 at a haem Fe(II), but only haemoglobin, a cooperative tetramer regulated by allosteric effectors, can load O2 in the lungs and unload it in the tissues.","sections":[{"heading":"Haem and the O2-binding site","points":["Haem is a protoporphyrin (four pyrrole rings) with an iron atom at the centre, bonded to the four pyrrole nitrogens.","Only Fe(II) binds O2. Fe(III), the met-form, cannot.","5th coordination bond: the proximal histidine. 6th position: O2 (empty in the deoxy form).","The distal histidine H-bonds bound O2, limits superoxide release and hinders CO binding.","When O2 binds, Fe moves into the plane of the porphyrin, pulling the proximal His and its α-helix with it."]},{"heading":"Myoglobin vs haemoglobin","points":["Myoglobin: one chain, in muscle. Hyperbolic curve, P50 ≈ 2 torr, so it acts as an O2 store.","Haemoglobin: an α2β2 tetramer (two αβ dimers) in red cells. Sigmoidal curve, P50 ≈ 26 torr, so it acts as a transporter.","Lungs (100 torr): Hb is ≈ 98% saturated. Active tissue (20 torr): ≈ 32%. So Hb delivers ≈ 66% of its O2, while myoglobin would deliver only ≈ 7%."]},{"heading":"Cooperativity","points":["T state (deoxy) = tense and low affinity. R state (oxy) = relaxed and high affinity.","Oxygenation rotates the α1β1 and α2β2 dimers by about 15° relative to each other.","Concerted model: the whole tetramer is either all-T or all-R. Sequential model: each binding raises its neighbours' affinity step by step."]},{"heading":"Allosteric effectors","points":["2,3-BPG binds the central cavity of the T state only. It stabilises T and shifts the curve right (lower affinity). Its level rises at high altitude.","Bohr effect: H⁺ and CO2 lower O2 affinity. Protonated His and N-termini, and carbamates, stabilise T, so more O2 is released in active tissue.","Fetal Hb (α2γ2) has Ser in place of His143, so it binds 2,3-BPG weakly and has a higher affinity. This lets O2 pass from mother to fetus.","CO binds about 200× more tightly than O2 and pushes the remaining sites into R, so the O2 still bound is released poorly."]},{"heading":"Abnormal haemoglobins","points":["HbS (β6 Glu → Val): a sticky patch binds a pocket exposed only in deoxy (T) Hb, forming fibres and sickled cells.","α-thalassaemia: β4 tetramers (HbH) have high affinity and no cooperativity, so they deliver O2 poorly.","β-thalassaemia: unpaired α chains precipitate in red-cell precursors, causing anaemia.","Methaemoglobin (Fe³⁺) cannot carry O2, e.g. in nitrite poisoning of cattle (chocolate-brown blood)."]}],"keyTerms":[{"term":"Haem","definition":"Protoporphyrin ring with a central Fe(II) that binds O2."},{"term":"Proximal histidine","definition":"His forming the 5th coordination bond to the haem iron."},{"term":"Distal histidine","definition":"His that H-bonds bound O2 and hinders CO binding."},{"term":"P50","definition":"pO2 at which half the binding sites are occupied. Lower P50 = higher affinity."},{"term":"Cooperativity","definition":"Binding at one site increases the affinity of the other sites, giving a sigmoidal curve."},{"term":"T and R states","definition":"Tense (low-affinity, deoxy) and relaxed (high-affinity, oxy) quaternary states."},{"term":"2,3-BPG","definition":"Red-cell allosteric effector that stabilises the T state and lowers O2 affinity."},{"term":"Bohr effect","definition":"Lower pH and higher CO2 reduce haemoglobin's O2 affinity."},{"term":"Methaemoglobin","definition":"Haemoglobin with Fe³⁺, which cannot bind O2."}],"examTips":["Right shift = lower affinity = more O2 released (↑ 2,3-BPG, ↑ H⁺, ↑ CO2).","Myoglobin is a monomer: no cooperativity and no Bohr effect.","2,3-BPG binds the central cavity of the T state, not the haem.","CO does double damage: it occupies sites AND left-shifts the remaining ones.","HbS polymerises when DEoxygenated, because its binding pocket is exposed only in the T state."]},"questions":[{"id":"u10-q001","type":"mcq","unit":10,"part":1,"outcome":"The oxygen-binding centre","bloom":"understand","difficulty":1,"source":"slides","stem":"Which bond does the proximal histidine of myoglobin form with the haem group?","options":[{"id":"a","text":"The 5th coordination bond to the Fe(II) ion","correct":true,"why":"The proximal His (F8) imidazole nitrogen occupies the 5th coordination position, below the porphyrin plane."},{"id":"b","text":"The 6th coordination bond to the Fe(II) ion","correct":false,"why":"The 6th position is where O2 binds; it is empty in deoxymyoglobin."},{"id":"c","text":"A hydrogen bond to bound O2","correct":false,"why":"That is the role of the distal histidine (E7), on the opposite side of the haem."},{"id":"d","text":"A covalent bond to one pyrrole nitrogen of the porphyrin","correct":false,"why":"The four pyrrole nitrogens coordinate the iron; the histidine does not bond to the porphyrin ring itself."}]},{"id":"u10-q002","type":"mcq","unit":10,"part":1,"outcome":"The oxygen-binding centre","bloom":"understand","difficulty":2,"source":"slides","stem":"Free haem in solution binds CO far more tightly than O2, yet inside myoglobin the preference for CO is much smaller. What accounts for this?","options":[{"id":"a","text":"The distal histidine hinders the linear Fe–C–O geometry that CO prefers, and H-bonds bound O2","correct":true,"why":"The distal His crowds the 6th site, forcing CO to bind at an unfavourable angle, while its H-bond stabilises bound O2."},{"id":"b","text":"The proximal histidine oxidises CO to CO2 before it can reach and bind the iron in the haem pocket","correct":false,"why":"The proximal His is a ligand of the iron, not a redox catalyst; CO is not oxidised in the pocket."},{"id":"c","text":"The iron in myoglobin is in the Fe(III) state, which does not bind CO","correct":false,"why":"Functional myoglobin contains Fe(II); Fe(III) (metmyoglobin) cannot bind O2 either."},{"id":"d","text":"2,3-BPG occupies the CO binding site in myoglobin","correct":false,"why":"2,3-BPG binds only to the central cavity of the haemoglobin tetramer, not to myoglobin."}]},{"id":"u10-q003","type":"mcq","unit":10,"part":1,"outcome":"The oxygen-binding centre","bloom":"apply","difficulty":2,"source":"general","stem":"Cattle grazing nitrate-rich forage can develop nitrite poisoning, in which a large fraction of haemoglobin becomes methaemoglobin and the blood turns chocolate-brown. Why can methaemoglobin not carry oxygen?","options":[{"id":"a","text":"The haem iron has been oxidised from Fe(II) to Fe(III), which does not bind O2","correct":true,"why":"Only ferrous iron binds O2 reversibly. Nitrite oxidises it to ferric iron, giving methaemoglobin."},{"id":"b","text":"Nitrite displaces the proximal histidine, so the iron falls out of the porphyrin","correct":false,"why":"The iron stays in the haem; the defect is its oxidation state, not its loss."},{"id":"c","text":"Nitrite binds the 2,3-BPG pocket and locks the tetramer in the R state","correct":false,"why":"Locking in R would raise O2 affinity, not abolish binding, and this is not the mechanism of methaemoglobinaemia."},{"id":"d","text":"Nitrite hydrolyses the globin chains, releasing free haem","correct":false,"why":"The globin remains intact; the change is at the iron atom."}]},{"id":"u10-q004","type":"mcq","unit":10,"part":1,"outcome":"Cooperativity","bloom":"understand","difficulty":2,"source":"slides","stem":"The haem groups in haemoglobin are 24–40 Å apart, so they cannot interact directly. What is the first structural event that links O2 binding at one haem to the affinity of the other subunits?","options":[{"id":"a","text":"The Fe moves into the porphyrin plane, pulling the proximal His and its helix, which shifts the αβ interface","correct":true,"why":"Iron movement drags the F-helix; the helix's C-terminal end lies at the α1β1/α2β2 interface and favours the T→R transition."},{"id":"b","text":"Bound O2 diffuses through the protein to the neighbouring haem groups and binds them in turn","correct":false,"why":"O2 stays bound at its site; communication is through protein conformation, not ligand transfer."},{"id":"c","text":"Electrons flow between the haem groups through the porphyrin rings, changing each iron's charge","correct":false,"why":"There is no electron transfer pathway between haems; the effect is conformational."},{"id":"d","text":"O2 binding releases a proton that travels to the other haems and directly protonates their iron","correct":false,"why":"Bohr protons are released from His and N-termini, not haems, and that is a consequence, not the trigger."}]},{"id":"u10-q005","type":"mcq","unit":10,"part":1,"outcome":"Cooperativity","bloom":"analyse","difficulty":3,"source":"slides","stem":"Myoglobin has P50 ≈ 2 torr and a hyperbolic binding curve, Y = pO2 / (pO2 + P50). If blood carried myoglobin instead of haemoglobin, roughly what fraction of its O2 would be released between the lungs (100 torr) and active tissue (20 torr)?","options":[{"id":"a","text":"About 7%","correct":true,"why":"Y(100) = 100/102 ≈ 0.98 and Y(20) = 20/22 ≈ 0.91, so only ≈ 7% is unloaded — far less than the ≈ 66% unloaded by haemoglobin."},{"id":"b","text":"About 66%","correct":false,"why":"That is the value for cooperative haemoglobin (98% → 32%), not myoglobin."},{"id":"c","text":"About 50%","correct":false,"why":"50% saturation occurs at P50 = 2 torr, far below both pressures given."},{"id":"d","text":"About 90%","correct":false,"why":"90% is close to myoglobin's saturation at 20 torr, not the amount released."}]},{"id":"u10-q006","type":"mcq","unit":10,"part":1,"outcome":"Cooperativity","bloom":"understand","difficulty":2,"source":"slides","stem":"Which statement best describes the concerted (MWC) model of cooperative O2 binding?","options":[{"id":"a","text":"All subunits are in the T state or all in the R state; ligand binding shifts the equilibrium between them","correct":true,"why":"In the concerted model, the tetramer switches as a unit; each bound O2 makes the all-R form more probable."},{"id":"b","text":"Each bound O2 changes only its own subunit, which raises the affinity of neighbouring subunits step by step","correct":false,"why":"That is the sequential (KNF) model, in which mixed T/R tetramers exist."},{"id":"c","text":"O2 binding converts R-state subunits into T-state subunits","correct":false,"why":"The direction is reversed: O2 favours R (high affinity); deoxyhaemoglobin is T."},{"id":"d","text":"Subunits bind O2 independently, and cooperativity arises from 2,3-BPG binding","correct":false,"why":"Independent sites give a hyperbolic curve; 2,3-BPG modulates affinity but is not the source of cooperativity."}]},{"id":"u10-q007","type":"mcq","unit":10,"part":1,"outcome":"Structure of myoglobin and haemoglobin","bloom":"remember","difficulty":1,"source":"slides","stem":"How is the quaternary structure of adult haemoglobin A best described?","options":[{"id":"a","text":"A pair of identical αβ dimers (α1β1 and α2β2)","correct":true,"why":"HbA is α2β2, organised as two αβ protomers; their interface changes most on oxygenation."},{"id":"b","text":"Four identical α chains","correct":false,"why":"HbA has two α and two β chains; β4 tetramers (HbH) occur in α-thalassaemia."},{"id":"c","text":"A single chain with four haem-binding domains","correct":false,"why":"Haemoglobin is a tetramer of four separate polypeptides, each with one haem."},{"id":"d","text":"Two α chains and two γ chains","correct":false,"why":"α2γ2 is fetal haemoglobin (HbF), not the adult form."}]},{"id":"u10-q008","type":"mcq","unit":10,"part":1,"outcome":"Structure of myoglobin and haemoglobin","bloom":"understand","difficulty":2,"source":"slides","stem":"On oxygenation, how does the quaternary structure of haemoglobin change?","options":[{"id":"a","text":"The α1β1 and α2β2 dimers rotate about 15° relative to each other","correct":true,"why":"The T→R transition is a rotation of one αβ dimer relative to the other, altering the dimer–dimer interface."},{"id":"b","text":"The tetramer dissociates into four free monomers, each like myoglobin","correct":false,"why":"Haemoglobin remains a tetramer; dissociation would abolish cooperativity."},{"id":"c","text":"The α-helices of each subunit unfold and refold into β-sheets","correct":false,"why":"Secondary structure is preserved; the change is a rigid-body quaternary rearrangement."},{"id":"d","text":"The α1 and β1 subunits separate while α2 and β2 stay bound","correct":false,"why":"The αβ dimers stay intact; it is the interface between the two dimers that shifts."}]},{"id":"u10-q009","type":"mcq","unit":10,"part":1,"outcome":"Allosteric effectors","bloom":"apply","difficulty":2,"source":"slides","stem":"After several days at high altitude, red-cell 2,3-BPG rises. What is the effect on haemoglobin's O2-binding curve?","options":[{"id":"a","text":"It shifts to the right (P50 increases), favouring O2 release in tissues","correct":true,"why":"2,3-BPG binds the central cavity of the T state only, stabilising T and lowering O2 affinity."},{"id":"b","text":"It shifts to the left (P50 decreases), favouring O2 loading in the lungs","correct":false,"why":"A left shift would result from removing 2,3-BPG, not adding it."},{"id":"c","text":"It becomes hyperbolic because cooperativity is lost","correct":false,"why":"2,3-BPG shifts the curve but haemoglobin remains cooperative."},{"id":"d","text":"It does not change because 2,3-BPG binds at the haem iron","correct":false,"why":"2,3-BPG binds a site distinct from the haem — the definition of an allosteric effector."}]},{"id":"u10-q010","type":"mcq","unit":10,"part":1,"outcome":"Allosteric effectors","bloom":"analyse","difficulty":3,"source":"slides","stem":"Fetal haemoglobin (α2γ2) has a higher O2 affinity than maternal HbA in the same red-cell environment. What is the molecular basis?","options":[{"id":"a","text":"Ser replaces His143 in the γ chain, removing positive charges from the 2,3-BPG site","correct":true,"why":"Fewer positive charges lining the central cavity weaken 2,3-BPG binding, so the T state is less stabilised and affinity rises."},{"id":"b","text":"The γ chain lacks a distal histidine, so O2 can bind more tightly to the haem iron","correct":false,"why":"The distal His is conserved; the difference lies in the 2,3-BPG binding pocket."},{"id":"c","text":"Fetal red cells contain no 2,3-BPG at all, because the placenta removes it from blood","correct":false,"why":"2,3-BPG is present; it is the haemoglobin's affinity for it that is lower."},{"id":"d","text":"HbF is a monomer like myoglobin and therefore non-cooperative","correct":false,"why":"HbF is a cooperative tetramer."}]},{"id":"u10-q011","type":"mcq","unit":10,"part":1,"outcome":"Allosteric effectors","bloom":"apply","difficulty":2,"source":"slides","stem":"In hard-working skeletal muscle, pH falls and pCO2 rises. How does this affect O2 delivery?","options":[{"id":"a","text":"O2 affinity falls, because protonated His and N-terminal groups, and carbamates, stabilise the T state","correct":true,"why":"This is the Bohr effect: H+ and CO2 both favour deoxyhaemoglobin, so more O2 is unloaded where it is needed."},{"id":"b","text":"O2 affinity rises, because H⁺ binds the haem iron and holds the O2 more tightly in the pocket","correct":false,"why":"H+ binds globin residues, not the iron, and lowers affinity."},{"id":"c","text":"CO2 competes with O2 for the haem iron, so less O2 can be carried from the lungs to the muscle","correct":false,"why":"CO2 binds N-terminal amino groups as carbamate, not the iron."},{"id":"d","text":"There is no effect, because pH changes only affect myoglobin","correct":false,"why":"The Bohr effect is a property of tetrameric haemoglobin, not myoglobin."}]},{"id":"u10-q012","type":"mcq","unit":10,"part":1,"outcome":"Allosteric effectors","bloom":"analyse","difficulty":3,"source":"slides","stem":"A dog is rescued from a kennel fire with 40% carboxyhaemoglobin. Why is tissue oxygenation worse than in a dog with a 40% reduction in haemoglobin (anaemia)?","options":[{"id":"a","text":"CO on one subunit shifts the others toward the R state, so their O2 is held tightly and released poorly","correct":true,"why":"Besides occupying sites, CO left-shifts the curve of the remaining haem groups, impairing unloading in tissues."},{"id":"b","text":"CO oxidises the haem irons to Fe(III), so the haemoglobin can no longer carry any oxygen at all","correct":false,"why":"CO binds Fe(II); oxidation to Fe(III) describes methaemoglobin."},{"id":"c","text":"CO binds 2,3-BPG and removes it from the red cells, so haemoglobin becomes locked in the T state","correct":false,"why":"CO binds the haem iron, not 2,3-BPG."},{"id":"d","text":"CO makes haemoglobin release O2 too easily in the lungs","correct":false,"why":"The problem is poor release in tissues, not in the lungs."}]},{"id":"u10-q013","type":"mcq","unit":10,"part":1,"outcome":"Abnormal haemoglobins","bloom":"understand","difficulty":2,"source":"slides","stem":"Why does haemoglobin S polymerise mainly when it is deoxygenated?","options":[{"id":"a","text":"The β6 Val sticky patch binds a hydrophobic pocket (Phe85, Leu88) exposed only in the T state","correct":true,"why":"In oxyHbS (R state) Phe85 and Leu88 are buried, so the Val patch has no partner and fibres do not form."},{"id":"b","text":"Deoxygenation exposes the mutant valine, which is buried inside the protein in the R state","correct":false,"why":"Val6 is on the surface in both states; it is the complementary pocket that is T-state specific."},{"id":"c","text":"The Glu→Val substitution adds a negative charge that repels O2, so HbS stays deoxygenated longer","correct":false,"why":"Glu is negative and Val is uncharged, so the mutation removes a negative charge."},{"id":"d","text":"Deoxygenated HbS forms disulfide bonds between β chains, which link the molecules into long fibres","correct":false,"why":"The aggregation is driven by hydrophobic contacts, not disulfide bonds."}]},{"id":"u10-q014","type":"mcq","unit":10,"part":1,"outcome":"Abnormal haemoglobins","bloom":"apply","difficulty":2,"source":"slides","stem":"In α-thalassaemia, excess β chains form β4 tetramers (HbH). Why does HbH deliver O2 poorly to tissues?","options":[{"id":"a","text":"It binds O2 with high affinity and no cooperativity, so little O2 is released at tissue pO2","correct":true,"why":"Without α–β interfaces there is no T→R switch; HbH behaves like myoglobin."},{"id":"b","text":"It cannot bind O2 at all, because unpaired β chains are made without their haem groups","correct":false,"why":"β chains contain haem and bind O2."},{"id":"c","text":"It precipitates in red-cell precursors in the marrow before the cells can reach the blood","correct":false,"why":"Precipitation of unpaired α chains is the problem in β-thalassaemia."},{"id":"d","text":"It is very sensitive to 2,3-BPG and stays locked in the T state, so it picks up little O2","correct":false,"why":"A T-locked tetramer would release O2 too readily, not too little."}]},{"id":"u10-q015","type":"mcq","unit":10,"part":1,"outcome":"Structure of myoglobin and haemoglobin","bloom":"apply","difficulty":2,"source":"general","stem":"Diving mammals such as seals have very high myoglobin concentrations in their skeletal muscle. What is the main advantage?","options":[{"id":"a","text":"Myoglobin stores O2 in the muscle and releases it only when intracellular pO2 falls very low","correct":true,"why":"With P50 ≈ 2 torr, myoglobin stays loaded until muscle pO2 becomes very low, then acts as a reserve."},{"id":"b","text":"Myoglobin carries O2 from the lungs to the muscles through the blood, like a second haemoglobin","correct":false,"why":"Myoglobin is intracellular; haemoglobin performs blood transport."},{"id":"c","text":"Myoglobin binds CO2 and buffers the lactic acid made during the dive through the Bohr effect","correct":false,"why":"Myoglobin, being monomeric, shows no significant Bohr effect."},{"id":"d","text":"Its cooperative binding lets it unload most of its O2 at the moderate pO2 of resting muscle","correct":false,"why":"Myoglobin is not cooperative; its curve is hyperbolic."}]},{"id":"u10-q016","type":"mcq","unit":10,"part":1,"outcome":"Allosteric effectors","bloom":"understand","difficulty":1,"source":"slides","stem":"Where does 2,3-bisphosphoglycerate bind on haemoglobin?","options":[{"id":"a","text":"In the central cavity between the β subunits, a pocket present only in the T state","correct":true,"why":"The positively charged cavity binds the highly anionic 2,3-BPG and collapses on transition to R."},{"id":"b","text":"At the sixth coordination site of each haem iron, in place of the bound O2","correct":false,"why":"That site binds O2 or CO, not 2,3-BPG."},{"id":"c","text":"At the distal histidine of each α subunit, inside the pocket where O2 binds","correct":false,"why":"The distal His lines the O2 pocket, which is unrelated to 2,3-BPG."},{"id":"d","text":"On the outer surface of the β chains, at the same site as the HbS valine","correct":false,"why":"2,3-BPG binds inside the central cavity, not on the surface."}]}],"flashcards":[{"id":"u10-f001","type":"flashcard","unit":10,"part":1,"outcome":"The oxygen-binding centre","source":"slides","front":"Which oxidation state of haem iron binds O2?","back":"Fe(II), ferrous. Fe(III) (met-form) does not bind O2."},{"id":"u10-f002","type":"flashcard","unit":10,"part":1,"outcome":"The oxygen-binding centre","source":"slides","front":"Proximal vs distal histidine?","back":"Proximal His: 5th coordination bond to Fe. Distal His: H-bonds bound O2, limits superoxide release and hinders CO binding."},{"id":"u10-f003","type":"flashcard","unit":10,"part":1,"outcome":"Cooperativity","source":"slides","front":"P50 of myoglobin vs haemoglobin?","back":"Myoglobin ≈ 2 torr (high affinity, hyperbolic). Haemoglobin ≈ 26 torr (sigmoidal, cooperative)."},{"id":"u10-f004","type":"flashcard","unit":10,"part":1,"outcome":"Cooperativity","source":"slides","front":"T state vs R state?","back":"T (tense) = deoxyHb, constrained, low affinity. R (relaxed) = oxyHb, high affinity."},{"id":"u10-f005","type":"flashcard","unit":10,"part":1,"outcome":"Cooperativity","source":"slides","front":"Concerted vs sequential model?","back":"Concerted: whole tetramer is all-T or all-R. Sequential: each binding raises neighbours' affinity without a full T→R switch."},{"id":"u10-f006","type":"flashcard","unit":10,"part":1,"outcome":"Cooperativity","source":"slides","front":"Hb saturation in lungs vs active tissue?","back":"≈ 98% at 100 torr, ≈ 32% at 20 torr, so ≈ 66% of the O2 is delivered."},{"id":"u10-f007","type":"flashcard","unit":10,"part":1,"outcome":"Allosteric effectors","source":"slides","front":"Effect of 2,3-BPG on Hb?","back":"Binds the T-state central cavity, stabilises T, lowers O2 affinity (right shift). Without it, Hb would release only ≈ 8% of its O2."},{"id":"u10-f008","type":"flashcard","unit":10,"part":1,"outcome":"Allosteric effectors","source":"slides","front":"Bohr effect: two ways CO2 lowers O2 affinity?","back":"1) Forms carbonic acid, so pH falls and His/N-termini are protonated. 2) Forms carbamates on N-terminal amino groups, stabilising T."},{"id":"u10-f009","type":"flashcard","unit":10,"part":1,"outcome":"Allosteric effectors","source":"slides","front":"Why does HbF have higher O2 affinity than HbA?","back":"γ-chain Ser replaces β His143, so 2,3-BPG binds weakly, T is less stabilised and affinity is higher."},{"id":"u10-f010","type":"flashcard","unit":10,"part":1,"outcome":"Abnormal haemoglobins","source":"slides","front":"Mutation in sickle-cell haemoglobin (HbS)?","back":"β6 Glu → Val. The hydrophobic patch binds Phe85/Leu88 of a neighbouring T-state Hb, forming fibres when deoxygenated."},{"id":"u10-f011","type":"flashcard","unit":10,"part":1,"outcome":"Abnormal haemoglobins","source":"slides","front":"α- vs β-thalassaemia?","back":"α: too little α chain, β4 (HbH) forms with high affinity and no cooperativity. β: too little β chain, α chains precipitate in RBC precursors, causing anaemia (Cooley's anaemia)."},{"id":"u10-f012","type":"flashcard","unit":10,"part":1,"outcome":"Allosteric effectors","source":"slides","front":"Two ways CO harms O2 transport?","back":"Binds Fe(II) ≈ 200× more tightly than O2, and shifts the remaining subunits to R so they release O2 poorly."}]},{"unit":11,"title":"Enzyme properties & catalysis","outcomes":["General properties","Classification","Substrates and cofactors","Isozymes","Enzymatic catalysis"],"summary":{"overview":"Enzymes are biological catalysts, almost all of them proteins. They speed up reactions under mild conditions, with high specificity, and their activity can be regulated. Many need a cofactor or coenzyme, and each enzyme is named and numbered by the reaction it catalyses.","sections":[{"heading":"General properties","points":["Almost all enzymes are proteins; a few catalytic RNAs (ribozymes) also exist.","Catalytic activity depends on the native protein conformation; denaturation destroys it.","Advantages over inorganic catalysts: greater specificity (no side products), mild conditions (pH ≈ 7, 37 °C), much higher rates, and the ability to be regulated.","The reaction takes place in the active site, a pocket that binds the substrate."]},{"heading":"Cofactors and coenzymes","points":["Cofactor: one or more inorganic ions, such as Fe²⁺, Mg²⁺, Mn²⁺ or Zn²⁺.","Coenzyme: a complex organic or metallo-organic molecule that carries functional groups temporarily. Most are derived from vitamins.","Prosthetic group: a coenzyme or cofactor bound very tightly, often covalently, so it is a permanent part of the enzyme.","Holoenzyme = apoenzyme (the protein part) + its cofactor or coenzyme."]},{"heading":"Classification","points":["Enzymes are grouped into six classes by reaction: oxidoreductases, transferases, hydrolases, lyases, isomerases and ligases.","Each enzyme has a four-part EC number. Hexokinase is 2.7.1.1: transferase → phosphotransferase → OH group as acceptor → D-glucose as acceptor.","Most names end in -ase; some keep old names such as pepsin and lysozyme."]},{"heading":"Specificity","points":["Specificity comes from the precise three-dimensional fit between substrate and active site.","Papain cleaves almost any peptide bond, which is why it is used to tenderise meat.","Trypsin cleaves only on the carboxyl side of Lys and Arg; thrombin cleaves only specific Arg–Gly bonds."]},{"heading":"Isozymes","points":["Isozymes catalyse the same reaction but differ in amino acid sequence, because they are encoded by different genes.","They differ in kinetics or regulation and can be separated by electrophoresis.","Lactate dehydrogenase is a tetramer of H and M chains. M4 works best in anaerobic skeletal muscle; H4 works best in aerobic heart muscle.","Tissue-specific isozymes in serum help diagnose organ damage."]},{"heading":"How catalysis works","points":["Enzymes lower the activation energy (ΔG‡). They do not change ΔG or K′eq.","Binding energy holds reactants close together and in the right orientation, paying the entropy cost during binding.","Active sites are complementary to the transition state, so they bind it more tightly than the substrate (Pauling)."]}],"keyTerms":[{"term":"Active site","definition":"Pocket on the enzyme where substrate binds and the reaction occurs."},{"term":"Cofactor","definition":"Inorganic ion required for activity, e.g. Zn²⁺ or Mg²⁺."},{"term":"Coenzyme","definition":"Organic molecule that carries groups temporarily; usually vitamin-derived."},{"term":"Prosthetic group","definition":"Cofactor or coenzyme bound very tightly or covalently to the enzyme."},{"term":"Holoenzyme","definition":"Complete, active enzyme with its cofactor or coenzyme bound."},{"term":"Apoenzyme","definition":"The protein part of an enzyme without its cofactor."},{"term":"EC number","definition":"Four-part code: class, subclass, sub-subclass and serial number."},{"term":"Isozyme","definition":"Different protein, from a different gene, that catalyses the same reaction."},{"term":"Ribozyme","definition":"RNA molecule with catalytic activity."}],"examTips":["Coenzymes are organic (often vitamin-derived); cofactors in the narrow sense are metal ions. Read the wording carefully.","The first EC digit gives the class: 1 oxidoreductase, 2 transferase, 3 hydrolase, 4 lyase, 5 isomerase, 6 ligase.","Isozymes catalyse the SAME reaction but are products of DIFFERENT genes.","An enzyme speeds up the forward and reverse reactions equally, so K′eq is unchanged."]},"questions":[{"id":"u11-q001","type":"mcq","unit":11,"part":1,"outcome":"General properties","bloom":"remember","difficulty":1,"source":"slides","stem":"Which statement about biological catalysts is correct?","options":[{"id":"a","text":"Almost all are proteins, but some catalytic RNAs (ribozymes) also exist","correct":true,"why":"Ribozymes show that RNA can catalyse reactions, which suggests RNA acted as a biocatalyst early in evolution."},{"id":"b","text":"Every enzyme is a protein, without exception, including the ribosome's catalytic site","correct":false,"why":"Catalytic RNAs such as the ribosome's peptidyl transferase are exceptions."},{"id":"c","text":"Enzymes are used up as the reaction proceeds, so cells must keep making new copies","correct":false,"why":"Like all catalysts, enzymes are regenerated unchanged at the end of each catalytic cycle."},{"id":"d","text":"Enzymes keep their full activity after their structure is denatured by heat","correct":false,"why":"Catalytic activity depends on the native conformation; denaturation destroys it."}]},{"id":"u11-q002","type":"mcq","unit":11,"part":1,"outcome":"General properties","bloom":"understand","difficulty":2,"source":"slides","stem":"Chorismate could break down by several chemical routes, yet in the cell chorismate mutase converts it almost entirely to prephenate. Which advantage of biological catalysts does this illustrate?","options":[{"id":"a","text":"Greater reaction specificity, which avoids side products","correct":true,"why":"The enzyme makes one pathway much faster than the others, so the desired product dominates."},{"id":"b","text":"Enzymes shift the equilibrium of the reaction towards prephenate","correct":false,"why":"Enzymes never change K′eq; they only change rates."},{"id":"c","text":"Enzymes work only at high temperature, where side reactions stop","correct":false,"why":"Enzymes work under mild cellular conditions, around 37 °C and pH 7."},{"id":"d","text":"Enzymes make the overall ΔG of the reaction more negative","correct":false,"why":"ΔG depends only on the initial and final states, not on the catalyst."}]},{"id":"u11-q003","type":"mcq","unit":11,"part":1,"outcome":"Classification","bloom":"apply","difficulty":2,"source":"slides","stem":"Hexokinase has the EC number 2.7.1.1. What does the first digit, 2, tell you?","options":[{"id":"a","text":"It is a transferase: it moves a group (here a phosphoryl) from one molecule to another","correct":true,"why":"Class 2 = transferases; the 7 then specifies phosphotransferases."},{"id":"b","text":"It is an oxidoreductase: it transfers electrons from glucose to an acceptor such as NAD⁺","correct":false,"why":"Oxidoreductases are class 1."},{"id":"c","text":"It is a hydrolase: it uses water to split the phosphoanhydride bond between ATP's phosphates","correct":false,"why":"Hydrolases are class 3."},{"id":"d","text":"Its substrate is glucose: the first digit identifies the sugar that the enzyme acts on","correct":false,"why":"The substrate (D-glucose as acceptor) is given by the last digit, not the first."}]},{"id":"u11-q004","type":"mcq","unit":11,"part":1,"outcome":"Classification","bloom":"apply","difficulty":1,"source":"slides","stem":"Trypsin breaks peptide bonds by adding water across them. To which enzyme class does it belong?","options":[{"id":"a","text":"Hydrolases (class 3)","correct":true,"why":"Hydrolases cleave bonds using water, e.g. peptidases, lipases and phosphatases."},{"id":"b","text":"Oxidoreductases (class 1)","correct":false,"why":"Oxidoreductases transfer electrons, e.g. dehydrogenases."},{"id":"c","text":"Transferases (class 2)","correct":false,"why":"Transferases move groups between molecules, e.g. kinases."},{"id":"d","text":"Lyases (class 4)","correct":false,"why":"Lyases break bonds without water or oxidation, often forming double bonds (e.g. aldolase)."},{"id":"e","text":"Ligases (class 6)","correct":false,"why":"Ligases join molecules using energy from ATP."}]},{"id":"u11-q005","type":"mcq","unit":11,"part":1,"outcome":"Classification","bloom":"apply","difficulty":2,"source":"general","stem":"Lactate dehydrogenase catalyses pyruvate + NADH + H⁺ ⇌ lactate + NAD⁺. To which class does it belong?","options":[{"id":"a","text":"Oxidoreductases","correct":true,"why":"Electrons (as a hydride) pass from NADH to pyruvate: a redox reaction, class 1."},{"id":"b","text":"Isomerases (class 5)","correct":false,"why":"Isomerases rearrange atoms within one molecule; here NADH is oxidised and pyruvate reduced."},{"id":"c","text":"Ligases (class 6)","correct":false,"why":"No new bond is formed using ATP."},{"id":"d","text":"Lyases (class 4)","correct":false,"why":"No group is removed to form a double bond."}]},{"id":"u11-q006","type":"mcq","unit":11,"part":1,"outcome":"Substrates and cofactors","bloom":"remember","difficulty":1,"source":"slides","stem":"What is the catalytically active complex of an apoenzyme with its cofactor or coenzyme called?","options":[{"id":"a","text":"Holoenzyme","correct":true,"why":"Holoenzyme = apoenzyme (protein) + cofactor or coenzyme: the complete, active enzyme."},{"id":"b","text":"Prosthetic group","correct":false,"why":"This is the tightly bound cofactor itself, not the whole complex."},{"id":"c","text":"Zymogen","correct":false,"why":"A zymogen is an inactive precursor activated by proteolysis."},{"id":"d","text":"Isozyme","correct":false,
