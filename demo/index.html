blood plasma, pKa ≈ 6.1), histidine side chains (proteins, pKa ≈ 6)."},{"id":"u3-f009","type":"flashcard","unit":3,"part":1,"outcome":"Biological buffer systems","source":"general","front":"Normal blood [HCO3⁻] : [CO2] ratio?","back":"≈ 20 : 1 (pH 7.4 = 6.1 + log 20)."},{"id":"u3-f010","type":"flashcard","unit":3,"part":1,"outcome":"Biological buffer systems","source":"slides","front":"Examples of laboratory (in vitro) buffers?","back":"HEPES, PIPES, CHES: sulphonic acids of cyclic amines with pKa values near physiological pH."}]},{"unit":4,"title":"Thermodynamics & ATP","outcomes":["Laws of thermodynamics in living systems","Free energy, enthalpy and entropy","Standard free energy and the equilibrium constant","Actual free energy in the cell","ATP, phosphoryl transfer and coupled reactions"],"summary":{"overview":"Cells obey the laws of thermodynamics. Whether a reaction can proceed is decided by its actual free-energy change, ΔG, which depends on ΔG′° and on real concentrations. Unfavourable reactions are made to happen by coupling them to the hydrolysis of energy-rich molecules such as ATP.","sections":[{"heading":"Laws of thermodynamics","points":["1st law: energy is conserved. It can be transformed from one form to another but not created or destroyed.","2nd law: the entropy of the universe always increases.","Cells are open systems that exchange matter and energy with their surroundings and are never at equilibrium with them (e.g. the Na⁺/K⁺ gradients).","Cells create internal order by releasing heat and increasing entropy in their surroundings, so the 2nd law is not violated."]},{"heading":"Free energy","points":["ΔG = ΔH − TΔS. G is the free energy available to do work, H is the heat content (enthalpy) and S is disorder (entropy).","Negative ΔG: exergonic and spontaneous. Positive ΔG: endergonic, so it needs an energy input.","Thermodynamically favourable is not the same as fast. Glucose + O2 (ΔG′° = −2840 kJ/mol) is stable until enzymes lower the activation barrier."]},{"heading":"ΔG′° and K′eq","points":["ΔG′° is measured at 25 °C, pH 7, with all reactants and products at 1 M.","ΔG′° = −RT ln K′eq: K′eq > 1 gives a negative ΔG′°, K′eq = 1 gives zero, and K′eq \u003c 1 gives a positive value.","At 25 °C, each 10-fold increase in K′eq makes ΔG′° about 5.7 kJ/mol more negative.","Example: phosphoglucomutase reaches 19 mM G6P and 1 mM G1P at equilibrium, so K′eq = 19 and ΔG′° ≈ −7.3 kJ/mol."]},{"heading":"Actual ΔG in the cell","points":["ΔG = ΔG′° + RT ln Q, where Q is the mass-action ratio of the actual concentrations.","It is ΔG, not ΔG′°, that decides direction: a reaction with a positive ΔG′° can proceed if products are kept low.","Cellular ATP is kept far above equilibrium, so the actual ΔG of ATP hydrolysis (about −50 to −65 kJ/mol) is much more negative than ΔG′° (−30.5 kJ/mol).","The true substrate is Mg²⁺–ATP."]},{"heading":"ATP and coupling","points":["ATP hydrolysis is favourable because it relieves charge repulsion, and the products are better solvated and resonance-stabilised.","ΔG′° values are additive. Glucose + Pi → G6P (+13.8) plus ATP → ADP + Pi (−30.5) gives an overall −16.7 kJ/mol.","Phosphoryl groups flow from compounds with a more negative ΔG′° of hydrolysis to those with a less negative one: PEP (−61.9) and 1,3-BPG (−49.3) can make ATP; glucose 6-phosphate (−13.8) cannot.","Phosphocreatine (−43.0) buffers ATP in muscle via creatine kinase. Thioesters such as acetyl-CoA are also high-energy acyl donors."]}],"keyTerms":[{"term":"Gibbs free energy (G)","definition":"Energy available to do work at constant temperature and pressure."},{"term":"Enthalpy (H)","definition":"Heat content of a system."},{"term":"Entropy (S)","definition":"Measure of randomness or disorder."},{"term":"ΔG′°","definition":"Standard free-energy change at pH 7, 25 °C and 1 M concentrations; equal to −RT ln K′eq."},{"term":"Mass-action ratio (Q)","definition":"[products]/[reactants] at the actual concentrations in the cell."},{"term":"Exergonic","definition":"Reaction with a negative ΔG that releases free energy."},{"term":"Energy coupling","definition":"Driving an endergonic reaction with an exergonic one through a shared intermediate."},{"term":"Phosphoryl group transfer potential","definition":"Tendency of a compound to donate a phosphoryl group (more negative ΔG′° of hydrolysis = higher potential)."}],"examTips":["ΔG decides direction in the cell, not ΔG′°.","K′eq > 1 ⇔ ΔG′° negative; each factor of 10 ≈ 5.7 kJ/mol at 25 °C.","Favourable does not mean fast: rate depends on the activation barrier (ΔG‡).","Coupled reactions: just add the ΔG′° values of the two steps."]},"questions":[{"id":"u4-q001","type":"mcq","unit":4,"part":1,"outcome":"Laws of thermodynamics in living systems","bloom":"understand","difficulty":2,"source":"slides","stem":"A growing calf builds highly ordered tissues. How is this consistent with the second law of thermodynamics?","options":[{"id":"a","text":"The calf releases heat and simpler, higher-entropy products, so the entropy of the universe still rises","correct":true,"why":"The 2nd law applies to system plus surroundings; local order is paid for by greater disorder elsewhere."},{"id":"b","text":"Living organisms are exempt from the second law, because their enzymes can reverse the flow of entropy","correct":false,"why":"The laws of thermodynamics apply to all living systems."},{"id":"c","text":"The calf creates new energy from its food, and this extra energy is used to build order in its tissues","correct":false,"why":"The 1st law forbids creating energy; it is only transformed."},{"id":"d","text":"The calf is a closed system at equilibrium with its environment, so its entropy does not need to change","correct":false,"why":"Organisms are open systems that are never at equilibrium with their surroundings."}]},{"id":"u4-q002","type":"mcq","unit":4,"part":1,"outcome":"Laws of thermodynamics in living systems","bloom":"remember","difficulty":1,"source":"slides","stem":"Why are living cells described as open thermodynamic systems?","options":[{"id":"a","text":"They exchange both matter and energy with their surroundings","correct":true,"why":"Cells take in nutrients and O2, release wastes and heat, and are never at equilibrium with their environment."},{"id":"b","text":"They exchange energy with their surroundings but not matter","correct":false,"why":"That describes a closed system."},{"id":"c","text":"They exchange neither matter nor energy with their surroundings","correct":false,"why":"That describes an isolated system."},{"id":"d","text":"They are kept at chemical equilibrium with their surroundings","correct":false,"why":"Being at equilibrium would mean death: no gradients and no net flux."}]},{"id":"u4-q003","type":"mcq","unit":4,"part":1,"outcome":"Free energy, enthalpy and entropy","bloom":"understand","difficulty":2,"source":"slides","stem":"Using ΔG = ΔH − TΔS, which combination always gives a spontaneous (exergonic) process at any temperature?","options":[{"id":"a","text":"ΔH negative and ΔS positive","correct":true,"why":"Both terms then make ΔG negative regardless of T."},{"id":"b","text":"ΔH positive and ΔS negative","correct":false,"why":"Both terms then make ΔG positive at every temperature."},{"id":"c","text":"ΔH positive and ΔS positive","correct":false,"why":"This is spontaneous only when TΔS exceeds ΔH, i.e. at high enough temperature."},{"id":"d","text":"ΔH negative and ΔS negative","correct":false,"why":"This is spontaneous only at low enough temperature."}]},{"id":"u4-q004","type":"mcq","unit":4,"part":1,"outcome":"Free energy, enthalpy and entropy","bloom":"analyse","difficulty":2,"source":"slides","stem":"The oxidation of glucose by O2 has ΔG′° = −2840 kJ/mol, yet sugar can sit in air for years without burning. Why?","options":[{"id":"a","text":"It has a high activation barrier (ΔG‡); being thermodynamically favourable does not make it fast","correct":true,"why":"ΔG decides whether a reaction can go; ΔG‡ decides how fast. Enzymes lower ΔG‡ so cells oxidise glucose step by step."},{"id":"b","text":"The reaction is actually endergonic in air, because the O2 concentration there is too low to drive it","correct":false,"why":"A ΔG′° of −2840 kJ/mol is strongly exergonic."},{"id":"c","text":"Air contains no free oxygen at room temperature; O2 forms only once the sugar has been heated","correct":false,"why":"Air is about 21% O2."},{"id":"d","text":"K′eq for glucose oxidation is less than 1, so at equilibrium most of the glucose remains intact","correct":false,"why":"A very negative ΔG′° means a very large K′eq."}]},{"id":"u4-q005","type":"mcq","unit":4,"part":1,"outcome":"Standard free energy and the equilibrium constant","bloom":"understand","difficulty":1,"source":"slides","stem":"A reaction has K′eq = 0.01. Starting with all components at 1 M, which way will it proceed?","options":[{"id":"a","text":"In reverse, because ΔG′° is positive","correct":true,"why":"K′eq \u003c 1 means ΔG′° = −RT ln K′eq > 0, so under standard conditions the reverse reaction is favoured."},{"id":"b","text":"Forward, because ΔG′° is negative","correct":false,"why":"A negative ΔG′° requires K′eq > 1."},{"id":"c","text":"It is already at equilibrium","correct":false,"why":"Only K′eq = 1 means standard conditions are already equilibrium."},{"id":"d","text":"It cannot proceed in either direction","correct":false,"why":"It moves in reverse until it reaches its equilibrium ratio."}]},{"id":"u4-q006","type":"mcq","unit":4,"part":1,"outcome":"Standard free energy and the equilibrium constant","bloom":"apply","difficulty":3,"source":"slides","stem":"Phosphoglucomutase is given 20 mM glucose 1-phosphate. At equilibrium there is 1 mM G1P and 19 mM G6P. What is ΔG′° (R = 8.315 J/mol·K, T = 298 K)?","options":[{"id":"a","text":"About −7.3 kJ/mol","correct":true,"why":"K′eq = 19/1 = 19; ΔG′° = −RT ln 19 = −(8.315 × 298 × 2.94) J/mol ≈ −7.3 kJ/mol."},{"id":"b","text":"About +7.3 kJ/mol","correct":false,"why":"Products are favoured (K′eq > 1), so the sign must be negative."},{"id":"c","text":"About −3.2 kJ/mol","correct":false,"why":"This uses log₁₀ instead of ln. With log₁₀ you must multiply by 2.303: ΔG′° = −2.303 RT log K′eq."},{"id":"d","text":"0 kJ/mol, because the system is at equilibrium","correct":false,"why":"ΔG = 0 at equilibrium, but ΔG′° is a constant calculated from K′eq."}]},{"id":"u4-q007","type":"mcq","unit":4,"part":1,"outcome":"Standard free energy and the equilibrium constant","bloom":"apply","difficulty":2,"source":"general","stem":"At 25 °C, a reaction has K′eq = 1000. What is its approximate ΔG′°?","options":[{"id":"a","text":"−17.1 kJ/mol","correct":true,"why":"ΔG′° = −2.303 RT log K′eq ≈ −5.7 kJ/mol × 3 = −17.1 kJ/mol."},{"id":"b","text":"+17.1 kJ/mol","correct":false,"why":"K′eq > 1 gives a negative ΔG′°."},{"id":"c","text":"−5.7 kJ/mol","correct":false,"why":"−5.7 kJ/mol corresponds to K′eq = 10."},{"id":"d","text":"−1000 kJ/mol","correct":false,"why":"ΔG′° depends on the logarithm of K′eq, not on K′eq itself."}]},{"id":"u4-q008","type":"mcq","unit":4,"part":1,"outcome":"Actual free energy in the cell","bloom":"understand","difficulty":2,"source":"slides","stem":"A step in a metabolic pathway has a positive ΔG′° but still runs forward in the cell. How is this possible?","options":[{"id":"a","text":"The next step removes its product quickly, keeping Q small, so ΔG = ΔG′° + RT ln Q is negative","correct":true,"why":"Direction is set by the actual ΔG, which depends on concentrations."},{"id":"b","text":"Enzymes change ΔG′° to a negative value by binding the substrate more tightly than the product","correct":false,"why":"Enzymes never change ΔG′°."},{"id":"c","text":"ΔG′° has no relationship with reaction direction in any case, so its sign can simply be ignored","correct":false,"why":"ΔG′° contributes to ΔG; it just isn't the whole story."},{"id":"d","text":"Cells run at a temperature close to 100 °C, which makes the TΔS term large enough to make it favourable","correct":false,"why":"Cells operate near 37 °C."}]},{"id":"u4-q009","type":"mcq","unit":4,"part":1,"outcome":"Actual free energy in the cell","bloom":"analyse","difficulty":3,"source":"slides","stem":"ΔG′° of ATP hydrolysis is −30.5 kJ/mol, but in a red blood cell the actual ΔG is about −52 kJ/mol. Why is it more negative?","options":[{"id":"a","text":"The cell keeps [ATP] far above, and [ADP][Pi] far below, equilibrium, so RT ln Q is strongly negative","correct":true,"why":"Holding the reactant far from equilibrium makes ATP a more powerful energy source in vivo."},{"id":"b","text":"Red cells are about 100 °C hotter than 25 °C, so the TΔS term makes the hydrolysis more favourable","correct":false,"why":"Body temperature (37 °C) changes RT only slightly."},{"id":"c","text":"Mg²⁺ is absent in red cells, so ATP is not stabilised as Mg-ATP and its hydrolysis releases more energy","correct":false,"why":"Mg²⁺ is present; the true substrate is Mg–ATP."},{"id":"d","text":"The red cell's enzymes make ATP hydrolysis more favourable by lowering the activation energy","correct":false,"why":"Enzymes affect rate, not ΔG."}]},{"id":"u4-q010","type":"mcq","unit":4,"part":1,"outcome":"ATP, phosphoryl transfer and coupled reactions","bloom":"apply","difficulty":2,"source":"slides","stem":"Glucose + Pi → glucose 6-phosphate + H2O has ΔG′° = +13.8 kJ/mol, and ATP + H2O → ADP + Pi has ΔG′° = −30.5 kJ/mol. What is ΔG′° for the hexokinase reaction (ATP + glucose → ADP + glucose 6-phosphate)?","options":[{"id":"a","text":"−16.7 kJ/mol","correct":true,"why":"Standard free-energy changes are additive: 13.8 + (−30.5) = −16.7 kJ/mol."},{"id":"b","text":"+44.3 kJ/mol","correct":false,"why":"This subtracts the wrong way; the values are simply added."},{"id":"c","text":"−44.3 kJ/mol","correct":false,"why":"This treats +13.8 as −13.8."},{"id":"d","text":"+16.7 kJ/mol","correct":false,"why":"The sign is wrong: ATP hydrolysis dominates."}]},{"id":"u4-q011","type":"mcq","unit":4,"part":1,"outcome":"ATP, phosphoryl transfer and coupled reactions","bloom":"understand","difficulty":2,"source":"slides","stem":"Why is the hydrolysis of ATP to ADP + Pi so strongly exergonic?","options":[{"id":"a","text":"Its products are more stable: charge repulsion is relieved and ADP and Pi are better solvated and stabilised","correct":true,"why":"The free energy comes from the difference in stability between reactants and products."},{"id":"b","text":"Breaking the phosphoanhydride bond releases the energy stored inside the bond itself, as in a spring","correct":false,"why":"A common misconception: breaking any bond requires energy. The 'high-energy bond' label describes the large ΔG of the whole reaction."},{"id":"c","text":"ATP hydrolysis has a very low activation energy, so the reaction releases its energy very quickly","correct":false,"why":"ATP is kinetically stable in water; ΔG‡ affects rate, not how exergonic the reaction is."},{"id":"d","text":"Mg²⁺ is released as a gas when ATP is hydrolysed, carrying energy away from the reaction","correct":false,"why":"Mg²⁺ stays in solution, bound to the phosphates."}]},{"id":"u4-q012","type":"mcq","unit":4,"part":1,"outcome":"ATP, phosphoryl transfer and coupled reactions","bloom":"apply","difficulty":2,"source":"slides","stem":"Standard free energies of hydrolysis: PEP −61.9, 1,3-bisphosphoglycerate −49.3, phosphocreatine −43.0, ATP → ADP −30.5, glucose 6-phosphate −13.8 kJ/mol. Which compound CANNOT phosphorylate ADP to make ATP under standard conditions?","options":[{"id":"a","text":"Glucose 6-phosphate","correct":true,"why":"Its hydrolysis is less exergonic than ATP's, so transferring its phosphate to ADP would have a positive ΔG′°."},{"id":"b","text":"Phosphoenolpyruvate","correct":false,"why":"PEP + ADP → pyruvate + ATP has ΔG′° ≈ −31.4 kJ/mol (pyruvate kinase)."},{"id":"c","text":"1,3-Bisphosphoglycerate","correct":false,"why":"It makes ATP via phosphoglycerate kinase (ΔG′° ≈ −18.8 kJ/mol)."},{"id":"d","text":"Phosphocreatine","correct":false,"why":"Creatine kinase regenerates ATP from phosphocreatine in muscle."}]},{"id":"u4-q013","type":"mcq","unit":4,"part":1,"outcome":"ATP, phosphoryl transfer and coupled reactions","bloom":"apply","difficulty":2,"source":"slides","stem":"Muscle cells contain high levels of phosphocreatine (about 28 mM in rat muscle). What is its role during a sudden sprint?","options":[{"id":"a","text":"It rapidly regenerates ATP from ADP via creatine kinase, buffering ATP levels","correct":true,"why":"With ΔG′° of hydrolysis −43 kJ/mol, phosphocreatine can transfer its phosphoryl group to ADP."},{"id":"b","text":"It is oxidised directly in the mitochondria to provide NADH for the respiratory chain","correct":false,"why":"Phosphocreatine is a phosphoryl donor, not a fuel for oxidation."},{"id":"c","text":"It stores glucose units for glycolysis and releases them when the sprint begins","correct":false,"why":"Glucose is stored as glycogen."},{"id":"d","text":"It inhibits ATP hydrolysis by myosin, so that the muscle's ATP lasts much longer","correct":false,"why":"It replenishes ATP rather than blocking its use."}]},{"id":"u4-q014","type":"mcq","unit":4,"part":1,"outcome":"Free energy, enthalpy and entropy","bloom":"understand","difficulty":2,"source":"slides","stem":"Glucose can be oxidised to CO2 and water by burning, or step by step through glycolysis and the citric acid cycle. How do the overall ΔG values compare?","options":[{"id":"a","text":"They are identical: ΔG depends only on the initial and final states, not on the pathway","correct":true,"why":"Free energy is a state function; the cell simply captures some of it as ATP instead of releasing it all as heat."},{"id":"b","text":"The cellular route releases more free energy, because each enzyme adds energy to its step","correct":false,"why":"Enzymes add no energy to a reaction."},{"id":"c","text":"Burning releases more free energy because it is faster and runs at a higher temperature","correct":false,"why":"Rate does not change ΔG."},{"id":"d","text":"The cellular route has a positive overall ΔG, because cells must invest ATP at the start","correct":false,"why":"Complete oxidation is strongly exergonic by any route."}]},{"id":"u4-q015","type":"mcq","unit":4,"part":1,"outcome":"ATP, phosphoryl transfer and coupled reactions","bloom":"remember","difficulty":1,"source":"slides","stem":"What is the true substrate for most ATP-dependent enzymes in the cell?","options":[{"id":"a","text":"The Mg²⁺–ATP complex","correct":true,"why":"Mg²⁺ shields the phosphate charges, and the ΔG of hydrolysis depends on [Mg²⁺]."},{"id":"b","text":"Free ATP⁴⁻ with no bound metal","correct":false,"why":"Most cellular ATP is complexed with Mg²⁺."},{"id":"c","text":"AMP","correct":false,"why":"AMP has a single phosphate and is a product or regulator, not the energy donor."},{"id":"d","text":"Ca²⁺–ADP","correct":false,"why":"Mg²⁺ (not Ca²⁺) is the relevant metal, and ADP is a product."}]}],"flashcards":[{"id":"u4-f001","type":"flashcard","unit":4,"part":1,"outcome":"Laws of thermodynamics in living systems","source":"slides","front":"1st and 2nd laws of thermodynamics?","back":"1st: energy is conserved (transformed, not created or destroyed). 2nd: the entropy of the universe always increases."},{"id":"u4-f002","type":"flashcard","unit":4,"part":1,"outcome":"Free energy, enthalpy and entropy","source":"slides","front":"Relationship between G, H and S?","back":"ΔG = ΔH − TΔS. A negative ΔG means exergonic and spontaneous."},{"id":"u4-f003","type":"flashcard","unit":4,"part":1,"outcome":"Standard free energy and the equilibrium constant","source":"slides","front":"ΔG′° vs K′eq?","back":"ΔG′° = −RT ln K′eq. K′eq > 1 → negative; = 1 → zero; \u003c 1 → positive."},{"id":"u4-f004","type":"flashcard","unit":4,"part":1,"outcome":"Standard free energy and the equilibrium constant","source":"slides","front":"Standard conditions for ΔG′°?","back":"25 °C (298 K), pH 7, all reactants and products at 1 M (gases at 1 atm)."},{"id":"u4-f005","type":"flashcard","unit":4,"part":1,"outcome":"Actual free energy in the cell","source":"slides","front":"Actual ΔG?","back":"ΔG = ΔG′° + RT ln([products]/[reactants]). ΔG, not ΔG′°, decides direction."},{"id":"u4-f006","type":"flashcard","unit":4,"part":1,"outcome":"ATP, phosphoryl transfer and coupled reactions","source":"slides","front":"ΔG′° of ATP → ADP + Pi?","back":"−30.5 kJ/mol (−7.3 kcal/mol). Actual ΔG in cells is about −50 to −65 kJ/mol."},{"id":"u4-f007","type":"flashcard","unit":4,"part":1,"outcome":"ATP, phosphoryl transfer and coupled reactions","source":"slides","front":"Why is ATP hydrolysis so favourable?","back":"Relief of charge repulsion, better solvation of the products, and resonance stabilisation of Pi."},{"id":"u4-f008","type":"flashcard","unit":4,"part":1,"outcome":"ATP, phosphoryl transfer and coupled reactions","source":"slides","front":"How are unfavourable reactions driven?","back":"By coupling to an exergonic reaction through a common intermediate. ΔG′° values add up (e.g. hexokinase: +13.8 − 30.5 = −16.7 kJ/mol)."},{"id":"u4-f009","type":"flashcard","unit":4,"part":1,"outcome":"ATP, phosphoryl transfer and coupled reactions","source":"slides","front":"Compounds with a higher phosphoryl-transfer potential than ATP?","back":"PEP (−61.9), 1,3-bisphosphoglycerate (−49.3), phosphocreatine (−43.0 kJ/mol). These can make ATP from ADP."},{"id":"u4-f010","type":"flashcard","unit":4,"part":1,"outcome":"Free energy, enthalpy and entropy","source":"slides","front":"Favourable vs fast?","back":"A negative ΔG means a reaction CAN go; its rate depends on ΔG‡. Glucose + O2 is very favourable but slow without enzymes."}]},{"unit":5,"title":"Redox reactions","outcomes":["Redox pairs and biological oxidation","Reduction potentials and the direction of electron flow","Nernst equation and free energy from ΔE","Redox cofactors: NAD, NADP and flavins"],"summary":{"overview":"Cells get most of their energy by stripping electrons from reduced fuels and passing them, step by step, to O2. Each redox pair has a reduction potential; electrons flow from lower to higher E, and the difference (ΔE) sets the free energy available.","sections":[{"heading":"Redox basics","points":["Oxidation = loss of electrons; reduction = gain. They always occur together (a conjugate redox pair, e.g. NAD⁺/NADH).","Many biological oxidations are dehydrogenations: 2 electrons leave as a hydride ion (:H⁻) plus a proton.","Reduced organic compounds (fuels) are the electron donors; O2 is the final acceptor in aerobic organisms."]},{"heading":"Reduction potential and electron flow","points":["The standard reduction potential E′° measures a pair's affinity for electrons: the higher (more positive) the E′°, the greater the affinity.","Electrons flow spontaneously from the pair with lower E′° to the pair with higher E′°.","Reference values: NAD⁺/NADH −0.320 V; FAD/FADH2 −0.219 V; pyruvate/lactate −0.185 V; cytochrome c +0.254 V; ½O2/H2O +0.816 V."]},{"heading":"Nernst equation and ΔG","points":["Nernst: E = E′° + (RT/nF) ln([electron acceptor]/[electron donor]). At 25 °C, E = E′° + (0.059/n) log([ox]/[red]).","When [ox] = [red], E = E′°.","ΔE′° = E′°(acceptor) − E′°(donor), and ΔG′° = −nFΔE′° (F = 96.5 kJ/V·mol).","A positive ΔE gives a negative ΔG. NADH → O2: ΔE′° = 1.136 V, so ΔG′° ≈ −219 kJ/mol, enough to make several ATP."]},{"heading":"Redox cofactors","points":["NAD⁺ and NADP⁺ (pyridine nucleotides) accept a hydride; they bind loosely and move between enzymes.","NADH mostly carries electrons from catabolism to the respiratory chain; NADPH supplies reducing power for biosynthesis.","NADH absorbs light at 340 nm (NAD⁺ does not), so dehydrogenase reactions are followed spectrophotometrically, e.g. in clinical enzyme assays.","FAD and FMN (flavins) are bound tightly and can transfer one or two electrons, which lets flavin oxidases use O2."]}],"keyTerms":[{"term":"Redox pair","definition":"Electron donor and its oxidised form, e.g. NADH/NAD⁺."},{"term":"Reduction potential (E′°)","definition":"Affinity of a redox pair for electrons under standard conditions at pH 7."},{"term":"Nernst equation","definition":"E = E′° + (RT/nF) ln([ox]/[red]), the potential at actual concentrations."},{"term":"Faraday constant (F)","definition":"96.5 kJ/V·mol, the charge of one mole of electrons."},{"term":"Hydride ion","definition":":H⁻, a proton with two electrons, transferred to NAD(P)⁺."},{"term":"Dehydrogenase","definition":"Enzyme that oxidises a substrate by removing hydrogen (H⁺ + hydride)."},{"term":"Flavoprotein","definition":"Enzyme with tightly bound FAD or FMN."}],"examTips":["Electrons flow towards the MORE POSITIVE E′°.","ΔE′° = E(acceptor) − E(donor); then ΔG′° = −nFΔE′° (watch the sign and n).","NADH is for energy (catabolism); NADPH is for biosynthesis.","The A340 of NADH is the basis of many laboratory enzyme assays."]},"questions":[{"id":"u5-q001","type":"mcq","unit":5,"part":1,"outcome":"Redox pairs and biological oxidation","bloom":"remember","difficulty":1,"source":"slides","stem":"In the reaction ethanol + NAD⁺ → acetaldehyde + NADH + H⁺, which species is oxidised?","options":[{"id":"a","text":"Ethanol, which loses two electrons (a hydride plus a proton)","correct":true,"why":"Oxidation is loss of electrons; ethanol is the electron donor (reducing agent)."},{"id":"b","text":"NAD⁺, which gives up electrons to ethanol as it becomes NADH","correct":false,"why":"NAD⁺ gains electrons, so it is reduced to NADH."},{"id":"c","text":"Acetaldehyde, which is formed by removing hydrogen from NADH","correct":false,"why":"Acetaldehyde is the product of the oxidation, not the species being oxidised."},{"id":"d","text":"No species, because it is a hydrolysis in which water is added","correct":false,"why":"Electrons are transferred, so it is a redox reaction."}]},{"id":"u5-q002","type":"mcq","unit":5,"part":1,"outcome":"Redox pairs and biological oxidation","bloom":"understand","difficulty":2,"source":"slides","stem":"When a dehydrogenase oxidises a secondary alcohol to a ketone using NAD⁺, how are the two electrons removed?","options":[{"id":"a","text":"As a hydride ion (:H⁻) transferred to NAD⁺, with a proton released to the solvent","correct":true,"why":"NAD⁺ accepts the hydride (2 e⁻ + 1 H⁺); the second H⁺ goes into solution."},{"id":"b","text":"As two separate free electrons released into the water, where NAD⁺ later picks them up","correct":false,"why":"Free electrons do not exist in solution; they move with H atoms or between cofactors."},{"id":"c","text":"As molecular hydrogen gas (H2), which diffuses away from the enzyme's active site","correct":false,"why":"Dehydrogenases don't release H2 gas."},{"id":"d","text":"As an oxygen atom added to the alcohol carbon, which turns the C–OH group into C=O","correct":false,"why":"That would be an oxygenase reaction, not a dehydrogenation."}]},{"id":"u5-q003","type":"mcq","unit":5,"part":1,"outcome":"Reduction potentials and the direction of electron flow","bloom":"understand","difficulty":1,"source":"slides","stem":"What does a highly positive standard reduction potential (E′°) tell you about a redox pair?","options":[{"id":"a","text":"Its oxidised form has a high affinity for electrons, so it tends to be reduced","correct":true,"why":"Higher E′° means a stronger electron acceptor, e.g. O2/H2O at +0.816 V."},{"id":"b","text":"Its reduced form readily donates electrons, so it is a strong reducing agent in cells","correct":false,"why":"Good donors have very negative E′°, e.g. NADH at −0.320 V."},{"id":"c","text":"It cannot take part in biological reactions, because it holds its electrons too tightly","correct":false,"why":"O2, the most positive biological pair, is the final acceptor of respiration."},{"id":"d","text":"It reacts quickly, because a large potential means a low activation energy","correct":false,"why":"E′° is thermodynamic; it says nothing about rate."}]},{"id":"u5-q004","type":"mcq","unit":5,"part":1,"outcome":"Reduction potentials and the direction of electron flow","bloom":"apply","difficulty":2,"source":"slides","stem":"E′° values: NAD⁺/NADH −0.320 V; fumarate/succinate +0.031 V. Under standard conditions, which way do electrons flow?","options":[{"id":"a","text":"From NADH to fumarate, producing NAD⁺ and succinate","correct":true,"why":"Electrons move from the lower (more negative) E′° to the higher one."},{"id":"b","text":"From succinate to NAD⁺, producing fumarate and NADH","correct":false,"why":"That is uphill (ΔE′° negative), so it is not spontaneous under standard conditions."},{"id":"c","text":"There is no flow, because both values are close to zero","correct":false,"why":"The difference of 0.351 V is substantial."},{"id":"d","text":"From fumarate to NADH","correct":false,"why":"Fumarate is the oxidised form; it accepts rather than donates electrons."}]},{"id":"u5-q005","type":"mcq","unit":5,"part":1,"outcome":"Nernst equation and free energy from ΔE","bloom":"apply","difficulty":3,"source":"slides","stem":"E′° (½O2/H2O) = +0.816 V and E′° (NAD⁺/NADH) = −0.320 V. What is ΔG′° for the oxidation of NADH by O2 (n = 2, F = 96.5 kJ/V·mol)?","options":[{"id":"a","text":"About −219 kJ/mol","correct":true,"why":"ΔE′° = 0.816 − (−0.320) = 1.136 V; ΔG′° = −nFΔE′° = −2 × 96.5 × 1.136 ≈ −219 kJ/mol."},{"id":"b","text":"About +219 kJ/mol","correct":false,"why":"A positive ΔE′° gives a negative ΔG′°."},{"id":"c","text":"About −95 kJ/mol","correct":false,"why":"This subtracts the potentials the wrong way (0.816 − 0.320 = 0.496 V)."},{"id":"d","text":"About −110 kJ/mol","correct":false,"why":"This forgets that n = 2 electrons are transferred."}]},{"id":"u5-q006","type":"mcq","unit":5,"part":1,"outcome":"Nernst equation and free energy from ΔE","bloom":"apply","difficulty":2,"source":"general","stem":"Lactate dehydrogenase uses NADH (E′° −0.320 V) to reduce pyruvate (pyruvate/lactate E′° −0.185 V). What is ΔG′° for pyruvate + NADH + H⁺ → lactate + NAD⁺?","options":[{"id":"a","text":"About −26 kJ/mol, so the reaction is favourable","correct":true,"why":"ΔE′° = −0.185 − (−0.320) = +0.135 V; ΔG′° = −2 × 96.5 × 0.135 ≈ −26 kJ/mol."},{"id":"b","text":"About +26 kJ/mol, so the reaction is unfavourable","correct":false,"why":"The acceptor (pyruvate) has the higher E′°, so ΔE′° is positive and ΔG′° negative."},{"id":"c","text":"About −97 kJ/mol","correct":false,"why":"This adds the magnitudes (0.505 V) instead of subtracting."},{"id":"d","text":"0 kJ/mol","correct":false,"why":"The two E′° values differ, so ΔG′° is not zero."}]},{"id":"u5-q007","type":"mcq","unit":5,"part":1,"outcome":"Nernst equation and free energy from ΔE","bloom":"apply","difficulty":3,"source":"slides","stem":"In a cell compartment, [NAD⁺]/[NADH] = 10. Using E = E′° + (0.059/n) log([ox]/[red]) with E′° = −0.320 V and n = 2, what is the actual E?","options":[{"id":"a","text":"About −0.290 V","correct":true,"why":"E = −0.320 + (0.059/2) × log 10 = −0.320 + 0.0295 ≈ −0.290 V."},{"id":"b","text":"About −0.350 V","correct":false,"why":"Excess oxidised form makes E more positive, not more negative."},{"id":"c","text":"About −0.261 V","correct":false,"why":"This forgets to divide by n = 2."},{"id":"d","text":"Exactly −0.320 V","correct":false,"why":"E = E′° only when [ox] = [red]."}]},{"id":"u5-q008","type":"mcq","unit":5,"part":1,"outcome":"Nernst equation and free energy from ΔE","bloom":"remember","difficulty":1,"source":"slides","stem":"In the Nernst equation, when does the actual reduction potential E equal the standard value E′°?","options":[{"id":"a","text":"When the concentrations of the oxidised and reduced forms are equal","correct":true,"why":"The log term is log 1 = 0, so E = E′°."},{"id":"b","text":"When only the reduced form is present in the solution","correct":false,"why":"Then [ox]/[red] → 0 and E becomes very negative."},{"id":"c","text":"At any concentration, because E is a constant for a pair","correct":false,"why":"E varies with concentration; E′° is the constant."},{"id":"d","text":"Only at 0 °C, when the RT/nF term is equal to zero","correct":false,"why":"Temperature affects the RT/nF factor, but the condition is [ox] = [red]."}]},{"id":"u5-q009","type":"mcq","unit":5,"part":1,"outcome":"Reduction potentials and the direction of electron flow","bloom":"analyse","difficulty":3,"source":"slides","stem":"In the respiratory chain, electrons pass from NADH (−0.320 V) through ubiquinone (+0.045 V) and cytochrome c (+0.254 V) to O2 (+0.816 V). Why are they passed in small steps rather than directly to O2?","options":[{"id":"a","text":"Each step releases a manageable share of free energy, which is captured by pumping protons, not lost as heat","correct":true,"why":"The total ΔG is the same, but stepwise transfer along increasing E lets the cell harvest it efficiently."},{"id":"b","text":"The direct reaction of NADH with O2 would be endergonic, so it needs intermediate carriers to go forward","correct":false,"why":"NADH → O2 is strongly exergonic (≈ −219 kJ/mol)."},{"id":"c","text":"Stepwise transfer makes more total free energy available than the single direct transfer to oxygen would","correct":false,"why":"Total ΔG depends only on the start and end pairs."},{"id":"d","text":"Electrons flow from a higher to a lower E′°, so they need carriers in descending order","correct":false,"why":"Electrons flow from lower to higher E."}]},{"id":"u5-q010","type":"mcq","unit":5,"part":1,"outcome":"Redox cofactors: NAD, NADP and flavins","bloom":"apply","difficulty":2,"source":"general","stem":"Serum ALT and AST activities are measured in many veterinary laboratories by following the change in absorbance at 340 nm. What is actually being measured?","options":[{"id":"a","text":"Conversion of NADH to NAD⁺ in a linked dehydrogenase reaction, as only NADH absorbs at 340 nm","correct":true,"why":"The transaminase product is coupled to an NADH-dependent dehydrogenase, and the fall in A340 tracks the reaction rate."},{"id":"b","text":"The absorbance of the transaminase protein itself, which rises as more enzyme becomes active","correct":false,"why":"Proteins absorb mainly at 280 nm, and their amount does not change during the assay."},{"id":"c","text":"The absorbance of NAD⁺, which is strongest at 340 nm and increases as the reaction proceeds","correct":false,"why":"NAD⁺ does not absorb at 340 nm; that is why the assay works."},{"id":"d","text":"Haemoglobin released from red cells damaged by the enzyme, which absorbs strongly at 340 nm","correct":false,"why":"Haemolysis can interfere with assays but is not what is measured."}]},{"id":"u5-q011","type":"mcq","unit":5,"part":1,"outcome":"Redox cofactors: NAD, NADP and flavins","bloom":"understand","difficulty":2,"source":"general","stem":"Cells keep NAD⁺/NADH and NADP⁺/NADPH as separate pools. What is the main role of each?","options":[{"id":"a","text":"NAD⁺ mainly accepts electrons in catabolism; NADPH mainly donates them for reductive biosynthesis","correct":true,"why":"A high NAD⁺/NADH ratio favours oxidation; a high NADPH/NADP⁺ ratio favours biosynthesis (e.g. fatty acids)."},{"id":"b","text":"They are interchangeable in most enzymes, and are kept separate only so they can be stored in different organelles","correct":false,"why":"Most dehydrogenases are specific for one or the other."},{"id":"c","text":"NADPH is used only to make ATP in the mitochondria, while NAD⁺ accepts electrons in biosynthesis","correct":false,"why":"NADPH supplies reducing power for biosynthesis and antioxidant defence."},{"id":"d","text":"NADH is used only in DNA synthesis, while NADP⁺ accepts electrons from glycolysis and the TCA cycle","correct":false,"why":"NADH feeds electrons into the respiratory chain."}]},{"id":"u5-q012","type":"mcq","unit":5,"part":1,"outcome":"Redox cofactors: NAD, NADP and flavins","bloom":"understand","difficulty":2,"source":"slides","stem":"How do flavin cofactors (FAD, FMN) differ from NAD⁺?","options":[{"id":"a","text":"Flavins are tightly bound to their proteins and can move one or two electrons, so oxidases can use O2","correct":true,"why":"The stable semiquinone form allows single-electron steps; NAD⁺ transfers only a hydride (two electrons)."},{"id":"b","text":"Flavins diffuse freely between many dehydrogenases, just like NAD⁺, carrying a hydride ion each time","correct":false,"why":"Flavins are usually tightly or covalently bound (flavoproteins)."},{"id":"c","text":"Flavins cannot accept electrons themselves; they only position the substrate for NAD⁺ to oxidise","correct":false,"why":"FAD is reduced to FADH2."},{"id":"d","text":"Flavins are inorganic metal ions, such as Fe²⁺ and Cu⁺, that sit in the active site of the enzyme","correct":false,"why":"They are organic cofactors derived from riboflavin (vitamin B2)."}]},{"id":"u5-q013","type":"mcq","unit":5,"part":1,"outcome":"Nernst equation and free energy from ΔE","bloom":"understand","difficulty":2,"source":"slides","stem":"For an electron transfer from donor to acceptor to be spontaneous, what must be true?","options":[{"id":"a","text":"E(acceptor) > E(donor), so ΔE is positive and ΔG = −nFΔE is negative","correct":true,"why":"A positive potential difference drives electrons 'downhill' to the acceptor."},{"id":"b","text":"E(acceptor) \u003c E(donor), so electrons fall from the higher to the lower E","correct":false,"why":"That gives a negative ΔE and a positive ΔG."},{"id":"c","text":"ΔE must equal zero, so that no energy is lost during the transfer","correct":false,"why":"ΔE = 0 means equilibrium, with no net flow."},{"id":"d","text":"n must be larger than 2, so that enough electrons move to make ΔG negative","correct":false,"why":"The number of electrons scales ΔG but does not set its sign."}]},{"id":"u5-q014","type":"mcq","unit":5,"part":1,"outcome":"Redox pairs and biological oxidation","bloom":"understand","difficulty":1,"source":"slides","stem":"Why are reduced organic compounds such as fatty acids and glucose described as metabolic fuels?","options":[{"id":"a","text":"Their electrons are removed in oxidation and passed to O2, releasing free energy the cell captures","correct":true,"why":"Electrons flow from fuels (low E) to O2 (high E), releasing energy along the way."},{"id":"b","text":"They are already fully oxidised, so their carbon atoms can be stored safely without reacting","correct":false,"why":"Fully oxidised carbon (CO2) has no energy left to release."},{"id":"c","text":"They accept electrons from O2 when they are broken down, which releases free energy as heat","correct":false,"why":"O2 is the electron acceptor; fuels are donors."},{"id":"d","text":"They contain stored ATP molecules, which are released when the fuel is broken down in cells","correct":false,"why":"ATP is made from the energy of their oxidation."}]}],"flashcards":[{"id":"u5-f001","type":"flashcard","unit":5,"part":1,"outcome":"Redox pairs and biological oxidation","source":"slides","front":"Oxidation vs reduction?","back":"Oxidation = loss of electrons; reduction = gain. The donor is oxidised, the acceptor is reduced."},{"id":"u5-f002","type":"flashcard","unit":5,"part":1,"outcome":"Reduction potentials and the direction of electron flow","source":"slides","front":"Which way do electrons flow between redox pairs?","back":"From lower (more negative) E′° to higher (more positive) E′°."},{"id":"u5-f003","type":"flashcard","unit":5,"part":1,"outcome":"Reduction potentials and the direction of electron flow","source":"slides","front":"E′° of NAD⁺/NADH and ½O2/H2O?","back":"−0.320 V and +0.816 V (ΔE′° = 1.136 V)."},{"id":"u5-f004","type":"flashcard","unit":5,"part":1,"outcome":"Nernst equation and free energy from ΔE","source":"slides","front":"ΔG from ΔE?","back":"ΔG′° = −nFΔE′°, with F = 96.5 kJ/V·mol and ΔE′° = E(acceptor) − E(donor)."},{"id":"u5-f005","type":"flashcard","unit":5,"part":1,"outcome":"Nernst equation and free energy from ΔE","source":"slides","front":"Nernst equation?","back":"E = E′° + (RT/nF) ln([ox]/[red]); at 25 °C, E = E′° + (0.059/n) log([ox]/[red])."},{"id":"u5-f006","type":"flashcard","unit":5,"part":1,"outcome":"Nernst equation and free energy from ΔE","source":"slides","front":"ΔG′° for NADH → O2?","back":"≈ −219 kJ/mol (−2 × 96.5 × 1.136)."},{"id":"u5-f007","type":"flashcard","unit":5,"part":1,"outcome":"Redox cofactors: NAD, NADP and flavins","source":"slides","front":"What does NAD⁺ accept?","back":"A hydride ion (:H⁻ = 2 e⁻ + H⁺); a second H⁺ is released into solution."},{"id":"u5-f008","type":"flashcard","unit":5,"part":1,"outcome":"Redox cofactors: NAD, NADP and flavins","source":"general","front":"NADH vs NADPH roles?","back":"NADH: catabolism → respiratory chain (energy). NADPH: reductive biosynthesis and antioxidant defence."},{"id":"u5-f009","type":"flashcard","unit":5,"part":1,"outcome":"Redox cofactors: NAD, NADP and flavins","source":"slides","front":"Why measure A340 in dehydrogenase assays?","back":"NADH absorbs at 340 nm and NAD⁺ does not, so the change in A340 follows the reaction."},{"id":"u5-f010","type":"flashcard","unit":5,"part":1,"outcome":"Redox cofactors: NAD, NADP and flavins","source":"slides","front":"Flavin cofactors?","back":"FAD and FMN (from riboflavin): tightly bound, can carry 1 or 2 electrons, which lets flavin oxidases use O2."}]},{"unit":6,"title":"Amino acids","outcomes":["Structure and stereochemistry of amino acids","Classification by R group","Acid–base properties and isoelectric point","Essential, uncommon and modified amino acids"],"summary":{"overview":"Proteins are built from 20 L-α-amino acids. All share an amino group, a carboxyl group and an H on the α-carbon, and differ only in their R group. The R group decides polarity, charge, reactivity and light absorption, and ionisation sets each amino acid's charge at a given pH.","sections":[{"heading":"Structure and stereochemistry","points":["The α-carbon carries –COOH, –NH2, –H and an R group. In every amino acid except glycine (R = H) it is a chiral centre.","Proline is an imino acid: its side chain loops back onto the α-nitrogen (a secondary amine), forming a rigid ring.","D/L describes absolute configuration relative to D/L-glyceraldehyde (Fischer). d/l, or (+)/(−), describes the direction of optical rotation. R/S describes each individual stereocentre. These three systems are not equivalent.","Proteins contain only L-amino acids, because ribosomes are stereospecific; D-amino acids occur in bacterial cell walls.","Chirality matters for drugs: thalidomide's S-enantiomer is teratogenic, and the two enantiomers interconvert in the body. Only S(−)-amlodipine blocks calcium channels."]},{"heading":"Five classes by R group","points":["Non-polar aliphatic (7): Gly, Ala, Pro, Val, Leu, Ile, Met. These cluster in the protein interior (hydrophobic effect).","Aromatic (3): Phe, Tyr, Trp. They absorb UV at about 280 nm, Trp most strongly, so protein concentration can be found with A = εcl.","Polar uncharged (5): Ser, Thr, Cys, Asn, Gln. These form H-bonds; two Cys can oxidise to cystine, forming a disulfide bond.","Positively charged (3): Lys and Arg are fully protonated at pH 7; His (pKa ≈ 6) can be neutral or positive, which makes it a buffer and a catalyst.","Negatively charged (2): aspartate and glutamate, which carry a –COO⁻ at physiological pH."]},{"heading":"Ionisation and pI","points":["Each amino acid has at least two ionisable groups: α-COOH (pKa ≈ 2) and α-NH3⁺ (pKa ≈ 9–10).","At low pH the amino acid is a cation; at high pH an anion; in between it is a zwitterion with both + and − charges (amphoteric).","The isoelectric point (pI) is the pH at which the net charge is zero. For an amino acid without an ionisable side chain, pI = (pK1 + pK2)/2; for glycine, (2.34 + 9.60)/2 = 5.97.","Below its pI a molecule is net positive; above its pI it is net negative. This is the basis of ion-exchange chromatography and isoelectric focusing."]},{"heading":"Essential, uncommon and modified amino acids","points":["Essential amino acids cannot be made in sufficient amounts and must come from the diet. Requirements differ between species; cats, for example, need dietary arginine.","Selenocysteine is the only uncommon amino acid inserted by the ribosome.","Others arise by post-translational modification: 4-hydroxyproline in collagen (needs vitamin C), γ-carboxyglutamate in clotting factors (needs vitamin K), and reversible phosphorylation of Ser, Thr and Tyr.","Free methionine is an important methyl donor in metabolism (as S-adenosylmethionine)."]}],"keyTerms":[{"term":"α-carbon","definition":"Central carbon bearing the amino, carboxyl, H and R groups."},{"term":"Zwitterion","definition":"Molecule carrying both a positive and a negative charge, with no net charge."},{"term":"Isoelectric point (pI)","definition":"pH at which a molecule has zero net charge."},{"term":"Amphoteric","definition":"Able to act as both an acid and a base."},{"term":"Imino acid","definition":"Proline, whose α-nitrogen is a secondary amine within a ring."},{"term":"Cystine","definition":"Two cysteines joined by a disulfide (S–S) bond."},{"term":"Essential amino acid","definition":"Amino acid that must be supplied in the diet."},{"term":"Racemic mixture","definition":"1:1 mixture of two enantiomers."}],"examTips":["Glycine is the only standard amino acid that is NOT chiral.","L/D is NOT the same as the direction of optical rotation (+/−).","pH \u003c pI → net positive; pH > pI → net negative.","Lys and Arg are positive and Asp and Glu negative at pH 7; His is the borderline one (pKa ≈ 6)."]},"questions":[{"id":"u6-q001","type":"mcq","unit":6,"part":1,"outcome":"Structure and stereochemistry of amino acids","bloom":"remember","difficulty":1,"source":"slides","stem":"Why is glycine the only standard amino acid that is not chiral?","options":[{"id":"a","text":"Its R group is a hydrogen atom, so its α-carbon carries two identical groups","correct":true,"why":"A chiral centre needs four different groups; glycine has two H atoms on the α-carbon."},{"id":"b","text":"It has no carboxyl group, so its α-carbon carries only three different groups","correct":false,"why":"Glycine has both α-carboxyl and α-amino groups."},{"id":"c","text":"Its α-carbon forms a rigid ring with the amino nitrogen, so it cannot be chiral","correct":false,"why":"That describes proline, which is chiral."},{"id":"d","text":"It occurs only as the D-isomer in nature, so there is no mirror-image form of it","correct":false,"why":"Without a chiral centre glycine has no D/L forms."}]},{"id":"u6-q002","type":"mcq","unit":6,"part":1,"outcome":"Structure and stereochemistry of amino acids","bloom":"understand","difficulty":2,"source":"slides","stem":"What does the 'L' in L-alanine refer to?","options":[{"id":"a","text":"Its absolute configuration, by comparison with L-glyceraldehyde in a Fischer projection","correct":true,"why":"D/L is a configurational label based on glyceraldehyde, not a measured optical property."},{"id":"b","text":"That it rotates plane-polarised light to the left, as measured with a polarimeter","correct":false,"why":"Left rotation is denoted l or (−); some L-amino acids are dextrorotatory."},{"id":"c","text":"The R/S configuration of each stereocentre in the molecule, assigned by priority rules","correct":false,"why":"R/S is a separate system based on priority rules for each centre."},{"id":"d","text":"That it is a large (long-chain) amino acid with more than three carbons in its side chain","correct":false,"why":"L has nothing to do with size."}]},{"id":"u6-q003","type":"mcq","unit":6,"part":1,"outcome":"Structure and stereochemistry of amino acids","bloom":"analyse","difficulty":3,"source":"slides","stem":"Thalidomide's R-enantiomer is the therapeutic form and the S-enantiomer is teratogenic. Why would giving pure R-thalidomide not have prevented birth defects?","options":[{"id":"a","text":"The two enantiomers interconvert (racemise) in the body, so some S-form forms anyway","correct":true,"why":"Thalidomide racemises in vivo, so a single-enantiomer formulation does not stay single."},{"id":"b","text":"Enantiomers always have identical biological effects, so the R-form is teratogenic too","correct":false,"why":"Chiral receptors often distinguish enantiomers, as amlodipine shows."},{"id":"c","text":"R-thalidomide is a diastereomer of the S-form, and diastereomers are equally harmful","correct":false,"why":"Mirror-image R and S forms of one centre are enantiomers."},{"id":"d","text":"Ribosomes convert R-drugs into S-drugs when they are absorbed in the small intestine","correct":false,"why":"Ribosomes synthesise proteins; they don't convert drugs."}]},{"id":"u6-q004","type":"mcq","unit":6,"part":1,"outcome":"Structure and stereochemistry of amino acids","bloom":"understand","difficulty":2,"source":"slides","stem":"Why does proline often interrupt α-helices in globular proteins?","options":[{"id":"a","text":"Its side chain is fused to the α-nitrogen in a rigid ring, and that nitrogen has no H to donate","correct":true,"why":"Proline is an imino acid; its constrained geometry introduces kinks."},{"id":"b","text":"It carries a large negative charge that repels the partial negative end of the helix dipole","correct":false,"why":"Proline's side chain is non-polar and uncharged."},{"id":"c","text":"It forms disulfide bonds with nearby residues, which pull the polypeptide out of the helix","correct":false,"why":"Only cysteine forms disulfide bonds."},{"id":"d","text":"It is a D-amino acid, so its side chain points the wrong way for a right-handed α-helix","correct":false,"why":"Proline in proteins is the L-isomer."}]},{"id":"u6-q005","type":"mcq","unit":6,"part":1,"outcome":"Classification by R group","bloom":"remember","difficulty":1,"source":"slides","stem":"Which amino acids carry a full positive charge on their side chain at pH 7?","options":[{"id":"a","text":"Lysine and arginine","correct":true,"why":"Their side-chain pKa values (≈ 10.5 and 12.5) are well above 7, so they stay protonated."},{"id":"b","text":"Aspartate and glutamate","correct":false,"why":"These are negatively charged (carboxylates) at pH 7."},{"id":"c","text":"Serine and threonine","correct":false,"why":"These are polar but uncharged."},{"id":"d","text":"Phenylalanine and tryptophan","correct":false,"why":"These are aromatic and uncharged."}]},{"id":"u6-q006","type":"mcq","unit":6,"part":1,"outcome":"Classification by R group","bloom":"understand","difficulty":2,"source":"slides","stem":"In a water-soluble globular protein, where would you mainly expect to find Leu, Val and Ile residues, and why?","options":[{"id":"a","text":"Buried in the interior, because burying non-polar side chains is favoured by the hydrophobic effect","correct":true,"why":"The hydrophobic effect is the main driving force for folding globular proteins."},{"id":"b","text":"On the surface, where their side chains form hydrogen bonds with the surrounding water molecules","correct":false,"why":"Their aliphatic side chains can't form H-bonds."},{"id":"c","text":"On the surface, forming salt bridges with Lys side chains that stabilise the folded protein","correct":false,"why":"Salt bridges need charged side chains."},{"id":"d","text":"Only in disulfide bonds, where their side chains link two strands of the polypeptide","correct":false,"why":"Disulfides involve only cysteine."}]},{"id":"u6-q007","type":"mcq","unit":6,"part":1,"outcome":"Classification by R group","bloom":"apply","difficulty":2,"source":"slides","stem":"A protein has a molar absorption coefficient at 280 nm of 25 000 M⁻¹ cm⁻¹. In a 1 cm cuvette its A280 is 0.50. What is its concentration?","options":[{"id":"a","text":"20 µM","correct":true,"why":"Beer–Lambert: c = A/(εl) = 0.50 / 25 000 = 2 × 10⁻⁵ M = 20 µM."},{"id":"b","text":"12.5 mM","correct":false,"why":"This multiplies A by ε instead of dividing."},{"id":"c","text":"2 µM","correct":false,"why":"This is out by a factor of 10; 0.5/25 000 = 0.00002 M."},{"id":"d","text":"50 mM","correct":false,"why":"Concentration must be A divided by εl."}]},{"id":"u6-q008","type":"mcq","unit":6,"part":1,"outcome":"Classification by R group","bloom":"understand","difficulty":1,"source":"slides","stem":"Which amino acid side chains are mainly responsible for proteins absorbing UV light at about 280 nm?","options":[{"id":"a","text":"Tryptophan and tyrosine (aromatic)","correct":true,"why":"They are the strongest chromophores, Trp most of all; Phe absorbs weakly."},{"id":"b","text":"Lysine and arginine (basic)","correct":false,"why":"Basic side chains do not absorb significantly at 280 nm."},{"id":"c","text":"Glycine and alanine (small)","correct":false,"why":"Small aliphatic side chains don't absorb at 280 nm."},{"id":"d","text":"Aspartate and glutamate (acidic)","correct":false,"why":"Carboxylates don't absorb at 280 nm."}]},{"id":"u6-q009","type":"mcq","unit":6,"part":1,"outcome":"Classification by R group","bloom":"understand","difficulty":2,"source":"slides","stem":"Free histidine is mostly uncharged at pH 7.4, but histidine side chains in proteins often act as buffers and catalysts. Why?","options":[{"id":"a","text":"Its imidazole pKa (≈ 6) is close to physiological pH, so it can easily be protonated or neutral","correct":true,"why":"Small shifts in the local environment can switch His between charged and uncharged forms."},{"id":"b","text":"Its side chain is negatively charged at pH 7, so it can bind any proton that is released","correct":false,"why":"His is weakly basic; it can be neutral or positive."},{"id":"c","text":"It forms disulfide bonds with substrates, holding them in the active site during catalysis","correct":false,"why":"Only Cys forms disulfides."},{"id":"d","text":"Its side-chain pKa is about 12, like arginine, so it stays protonated across the cell's pH range","correct":false,"why":"Arg's pKa is about 12.5; His's is about 6."}]},{"id":"u6-q010","type":"mcq","unit":6,"part":1,"outcome":"Acid–base properties and isoelectric point","bloom":"apply","difficulty":2,"source":"general","stem":"Glycine has pK1 (α-COOH) = 2.34 and pK2 (α-NH3⁺) = 9.60. What is its isoelectric point?","options":[{"id":"a","text":"5.97","correct":true,"why":"With no ionisable side chain, pI = (2.34 + 9.60)/2 = 5.97."},{"id":"b","text":"11.94","correct":false,"why":"This is the sum of the pKa values, not their average."},{"id":"c","text":"7.00","correct":false,"why":"pI is not automatically neutral pH."},{"id":"d","text":"3.63","correct":false,"why":"This is half of pK2 minus pK1, not the average of the two."}]},{"id":"u6-q011","type":"mcq","unit":6,"part":1,"outcome":"Acid–base properties and isoelectric point","bloom":"understand","difficulty":2,"source":"slides","stem":"What is the predominant form of alanine at pH 7?","options":[{"id":"a","text":"A zwitterion, ⁺H3N–CH(CH3)–COO⁻, with no net charge","correct":true,"why":"pH 7 lies between the two pKa values (≈ 2.3 and ≈ 9.7), so the carboxyl is deprotonated and the amino group protonated."},{"id":"b","text":"H2N–CH(CH3)–COOH, the neutral form with no charges at all","correct":false,"why":"This form is negligible in water at any pH."},{"id":"c","text":"The fully protonated cation, ⁺H3N–CH(CH3)–COOH","correct":false,"why":"This dominates only below pH ≈ 2."},{"id":"d","text":"The fully deprotonated anion, H2N–CH(CH3)–COO⁻","correct":false,"why":"This dominates only above pH ≈ 10."}]},{"id":"u6-q012","type":"mcq","unit":6,"part":1,"outcome":"Acid–base properties and isoelectric point","bloom":"apply","difficulty":2,"source":"slides","stem":"A protein with pI = 5.0 is placed in a buffer at pH 7.5. What is its net charge, and towards which electrode will it move in an electric field?","options":[{"id":"a","text":"Net negative; it moves towards the anode (+)","correct":true,"why":"Above its pI a protein loses protons and carries a net negative charge."},{"id":"b","text":"Net positive; it moves towards the cathode (−)","correct":false,"why":"A protein is net positive only below its pI."},{"id":"c","text":"Zero; it does not move","correct":false,"why":"Zero net charge occurs only at pH = pI."},{"id":"d","text":"Net negative; it moves towards the cathode (−)","correct":false,"why":"Negative molecules move towards the positive electrode."}]},{"id":"u6-q013","type":"mcq","unit":6,"part":1,"outcome":"Essential, uncommon and modified amino acids","bloom":"apply","difficulty":3,"source":"general","stem":"A cat fed a single arginine-free meal can develop vomiting and neurological signs within hours. What is the biochemical explanation?","options":[{"id":"a","text":"Cats can't make enough arginine, so the urea cycle can't dispose of ammonia: hyperammonaemia","correct":true,"why":"Arginine is a urea-cycle intermediate; cats rely on dietary arginine, so a deficiency quickly causes ammonia toxicity."},{"id":"b","text":"Arginine is the only source of glucose in cats, so without it they quickly become hypoglycaemic","correct":false,"why":"Many amino acids and glycerol are gluconeogenic."},{"id":"c","text":"Arginine is needed to make the D-amino acids in feline proteins, so new proteins cannot fold","correct":false,"why":"Proteins contain only L-amino acids."},{"id":"d","text":"Without arginine, cats cannot absorb water from the gut, so they become dehydrated within hours","correct":false,"why":"The problem is ammonia detoxification."}]},{"id":"u6-q014","type":"mcq","unit":6,"part":1,"outcome":"Essential, uncommon and modified amino acids","bloom":"remember","difficulty":2,"source":"slides","stem":"Which uncommon amino acid is inserted directly by the ribosome during translation rather than formed by post-translational modification?","options":[{"id":"a","text":"Selenocysteine","correct":true,"why":"Selenocysteine has its own tRNA and is inserted at a recoded UGA codon."},{"id":"b","text":"4-Hydroxyproline","correct":false,"why":"It is made after translation by prolyl hydroxylase, which needs vitamin C."},{"id":"c","text":"γ-Carboxyglutamate","correct":false,"why":"It is formed after translation by a vitamin K-dependent carboxylase."},{"id":"d","text":"Phosphoserine","correct":false,"why":"It is formed by kinases after translation."}]},{"id":"u6-q015","type":"mcq","unit":6,"part":1,"outcome":"Classification by R group","bloom":"understand","difficulty":1,"source":"slides","stem":"What happens when two cysteine side chains in a protein are oxidised?","options":[{"id":"a","text":"They form a covalent disulfide bond (a cystine residue) that stabilises the structure","correct":true,"why":"The –SH groups oxidise to –S–S–, an important covalent cross-link."},{"id":"b","text":"They form a peptide bond between their side chains, linking two parts of the chain","correct":false,"why":"Peptide bonds link α-carboxyl and α-amino groups."},{"id":"c","text":"They become positively charged and repel each other, unfolding that part of the protein","correct":false,"why":"Disulfide formation doesn't add positive charge."},{"id":"d","text":"They are converted into methionine residues by adding a methyl group to each sulfur","correct":false,"why":"Oxidation joins two Cys; it doesn't make Met."}]}],"flashcards":[{"id":"u6-f001","type":"flashcard","unit":6,"part":1,"outcome":"Structure and stereochemistry of amino acids","source":"slides","front":"Four groups on the α-carbon?","back":"Carboxyl, amino, hydrogen and the R group (in glycine, R = H, so it is not chiral)."},{"id":"u6-f002","type":"flashcard","unit":6,"part":1,"outcome":"Structure and stereochemistry of amino acids","source":"slides","front":"D/L vs d/l (+/−) vs R/S?","back":"D/L: configuration relative to glyceraldehyde. d/l (+/−): direction of optical rotation. R/S: configuration of each individual stereocentre."},{"id":"u6-f003","type":"flashcard","unit":6,"part":1,"outcome":"Structure and stereochemistry of amino acids","source":"slides","front":"Which isomers are found in proteins?","back":"Only L-amino acids (ribosomes are stereospecific). D-amino acids occur in bacterial cell walls."},{"id":"u6-f004","type":"flashcard","unit":6,"part":1,"outcome":"Classification by R group","source":"slides","front":"Five R-group classes?","back":"Non-polar aliphatic (7), aromatic (3), polar uncharged (5), positively charged (3), negatively charged (2)."},{"id":"u6-f005","type":"flashcard","unit":6,"part":1,"outcome":"Classification by R group","source":"slides","front":"Charged side chains at pH 7?","back":"+: Lys, Arg (and His, partly). −: Asp, Glu."},{"id":"u6-f006","type":"flashcard","unit":6,"part":1,"outcome":"Classification by R group","source":"slides","front":"Why do proteins absorb at 280 nm?","back":"Aromatic side chains, mainly Trp and Tyr. Concentration from A = εcl."},{"id":"u6-f007","type":"flashcard","unit":6,"part":1,"outcome":"Acid–base properties and isoelectric point","source":"slides","front":"Zwitterion?","back":"A form with both +NH3 and −COO⁻ and no net charge. It dominates between the two pKa values."},{"id":"u6-f008","type":"flashcard","unit":6,"part":1,"outcome":"Acid–base properties and isoelectric point","source":"general","front":"pI of a simple amino acid?","back":"pI = (pK1 + pK2)/2. Glycine: (2.34 + 9.60)/2 = 5.97."},{"id":"u6-f009","type":"flashcard","unit":6,"part":1,"outcome":"Acid–base properties and isoelectric point","source":"slides","front":"Charge relative to pI?","back":"pH \u003c pI → net positive. pH = pI → zero. pH > pI → net negative."},{"id":"u6-f010","type":"flashcard","unit":6,"part":1,"outcome":"Essential, uncommon and modified amino acids","source":"general","front":"Examples of modified amino acids, and their vitamins?","back":"4-Hydroxyproline (collagen, vitamin C); γ-carboxyglutamate (clotting factors, vitamin K); phospho-Ser/Thr/Tyr (signalling). Selenocysteine is inserted by the ribosome."}]},{"unit":7,"title":"Peptide bond & primary structure","outcomes":["The peptide bond","Primary structure and peptide ionisation","Protein sequencing","Protein purification and analysis"],"summary":{"overview":"Amino acids are joined by planar, rigid peptide bonds into chains read from the N- to the C-terminus. This sequence, the primary structure, determines how a protein folds and functions. Biochemists purify proteins by charge, size and affinity, then analyse and sequence them.","sections":[{"heading":"The peptide bond","points":["A peptide (amide) bond forms by condensation of one amino acid's α-carboxyl with the next one's α-amino group, releasing water.","It has partial double-bond character (resonance), so it is short, rigid and planar, and almost always trans.","There is no rotation about the C–N bond; the backbone can rotate only about N–Cα (φ) and Cα–C (ψ).","Chains are written and numbered from the N-terminal (free α-amino) to the C-terminal (free α-carboxyl) residue."]},{"heading":"Primary structure and ionisation","points":["Primary structure is the amino acid sequence, encoded by DNA; it dictates the 3D fold and function.","One substitution can change function, e.g. β6 Glu → Val (GAG → GUG) in sickle-cell haemoglobin.","In a peptide, only the terminal α-NH3⁺ and α-COO⁻ plus the ionisable side chains contribute charge; internal α-groups are locked in peptide bonds.","Proteins range from about 100 residues (cytochrome c) to about 27 000 (titin) and may have one or several chains.","Conjugated proteins carry non-protein groups: lipoproteins, glycoproteins (IgG), phosphoproteins (casein), haemoproteins (haemoglobin), flavoproteins and metalloproteins."]},{"heading":"Sequencing","points":["Today, sequences are usually deduced from the DNA.","Edman degradation labels, cleaves and identifies the N-terminal residue, one cycle at a time.","Mass spectrometry (MALDI, ESI) measures peptide masses precisely and reveals post-translational modifications.","Comparing sequences of the same protein between species reveals evolutionary relationships."]},{"heading":"Purification and analysis","points":["Proteins are separated by charge, size, ligand affinity, solubility, hydrophobicity and heat stability.","Ion exchange: a cation exchanger (negatively charged beads) binds proteins that are net positive (pH below their pI).","Size exclusion: large proteins are excluded from the bead pores and elute FIRST.","Affinity chromatography exploits specific binding, e.g. xanthine oxidase (rich in Lys and Arg) binds heparin.","SDS-PAGE: SDS unfolds proteins and coats them with negative charge, so they separate by size alone (small proteins move fastest). Isoelectric focusing separates by pI; 2D gels combine both.","Specific activity = activity ÷ total protein. It rises as the protein becomes purer."]}],"keyTerms":[{"term":"Peptide bond","definition":"Amide bond between the α-carboxyl of one residue and the α-amino of the next."},{"term":"N-terminus","definition":"End of a chain with a free α-amino group; residue 1."},{"term":"Primary structure","definition":"The linear amino acid sequence of a polypeptide."},{"term":"Conjugated protein","definition":"Protein with a covalently bound non-protein (prosthetic) group."},{"term":"Edman degradation","definition":"Stepwise removal and identification of N-terminal residues."},{"term":"SDS-PAGE","definition":"Gel electrophoresis of SDS-denatured proteins, separating them by mass."},{"term":"Isoelectric focusing","definition":"Electrophoresis in a pH gradient that separates proteins by pI."},{"term":"Specific activity","definition":"Units of activity per mg of total protein; a measure of purity."}],"examTips":["Size exclusion: BIG proteins come off FIRST. SDS-PAGE: SMALL proteins move FASTEST.","The peptide bond is planar and trans; rotation happens only around φ and ψ.","Count charges in a peptide: N-terminus (+1), C-terminus (−1), plus Lys/Arg (+) and Asp/Glu (−).","Purification: total activity (yield) falls while specific activity (purity) rises."]},"questions":[{"id":"u7-q001","type":"mcq","unit":7,"part":1,"outcome":"The peptide bond","bloom":"remember","difficulty":1,"source":"slides","stem":"How is a peptide bond formed?","options":[{"id":"a","text":"By condensation of one residue's α-carboxyl with the next one's α-amino group, releasing water","correct":true,"why":"This produces an amide link; hydrolysis (adding water) reverses it."},{"id":"b","text":"By oxidation of two cysteine –SH groups, which join the two amino acids through a sulfur bridge","correct":false,"why":"That forms a disulfide bond."},{"id":"c","text":"By joining the side-chain carboxyl groups of two amino acids, such as aspartate and glutamate","correct":false,"why":"Peptide bonds link backbone α-groups."},{"id":"d","text":"By adding a molecule of water across two amino acids, which links their α-carbons together","correct":false,"why":"Adding water is hydrolysis, which breaks peptide bonds."}]},{"id":"u7-q002","type":"mcq","unit":7,"part":1,"outcome":"The peptide bond","bloom":"understand","difficulty":2,"source":"slides","stem":"Why can't a polypeptide backbone rotate freely about the peptide (C–N) bond?","options":[{"id":"a","text":"Resonance gives the C–N bond partial double-bond character, so the peptide group is planar","correct":true,"why":"Rotation is possible only about the N–Cα (φ) and Cα–C (ψ) bonds."},{"id":"b","text":"The C–N bond is a full triple bond, so the two atoms are locked in a straight line with no rotation","correct":false,"why":"It is intermediate between a single and a double bond."},{"id":"c","text":"Side chains are covalently bonded to the peptide nitrogen and physically block the bond's rotation","correct":false,"why":"Side chains attach to Cα (except proline's ring closure)."},{"id":"d","text":"Peptide bonds are usually cis, so the two Cα atoms clash with each other if the bond tries to rotate","correct":false,"why":"Peptide bonds are almost always trans."}]},{"id":"u7-q003","type":"mcq","unit":7,"part":1,"outcome":"Primary structure and peptide ionisation","bloom":"apply","difficulty":1,"source":"slides","stem":"In the tripeptide Tyr–Gly–Phe, which residue carries the free α-amino group?","options":[{"id":"a","text":"Tyr","correct":true,"why":"Peptides are written from the N-terminus (free α-NH3⁺) on the left to the C-terminus on the right."},{"id":"b","text":"Phe","correct":false,"why":"Phe is the C-terminal residue, with the free α-carboxyl."},{"id":"c","text":"Gly","correct":false,"why":"The internal residue's α-groups are both in peptide bonds."},{"id":"d","text":"All three residues","correct":false,"why":"Only the terminal residues keep free α-groups."}]},{"id":"u7-q004","type":"mcq","unit":7,"part":1,"outcome":"Primary structure and peptide ionisation","bloom":"apply","difficulty":3,"source":"slides","stem":"What is the approximate net charge of the peptide Lys–Asp–Arg–Gly at pH 7?","options":[{"id":"a","text":"+1","correct":true,"why":"N-terminus +1, Lys +1, Asp −1, Arg +1, C-terminus −1: total +1."},{"id":"b","text":"0","correct":false,"why":"This misses one positive charge; there are three positive groups and two negative."},{"id":"c","text":"+3","correct":false,"why":"This forgets the negative C-terminus and the Asp side chain."},{"id":"d","text":"−1","correct":false,"why":"Basic groups outnumber acidic ones."}]},{"id":"u7-q005","type":"mcq","unit":7,"part":1,"outcome":"Primary structure and peptide ionisation","bloom":"understand","difficulty":2,"source":"slides","stem":"Sickle-cell disease results from a single base change (GAG → GUG) in the β-globin gene. What does this show about primary structure?","options":[{"id":"a","text":"A single amino acid change (Glu → Val) can alter a protein's properties enough to cause disease","correct":true,"why":"The sequence dictates structure and function; a charged residue replaced by a hydrophobic one creates a sticky surface patch."},{"id":"b","text":"Primary structure has no influence on function, because haemoglobin S still binds oxygen normally","correct":false,"why":"This example shows the opposite."},{"id":"c","text":"The mutation changes the number of polypeptide chains in haemoglobin, so it can't form a tetramer","correct":false,"why":"HbS is still α2β2."},{"id":"d","text":"The mutation adds a disulfide bond between β-chains, which links haemoglobin into long fibres","correct":false,"why":"Val has no –SH group."}]},{"id":"u7-q006","type":"mcq","unit":7,"part":1,"outcome":"Primary structure and peptide ionisation","bloom":"remember","difficulty":1,"source":"slides","stem":"Milk casein carries covalently bound phosphate groups. What type of conjugated protein is it?","options":[{"id":"a","text":"A phosphoprotein","correct":true,"why":"Its phosphate groups (on Ser residues) bind calcium in milk."},{"id":"b","text":"A glycoprotein","correct":false,"why":"Glycoproteins carry carbohydrate, e.g. immunoglobulin G."},{"id":"c","text":"A haemoprotein","correct":false,"why":"Haemoproteins carry haem, e.g. haemoglobin."},{"id":"d","text":"A flavoprotein","correct":false,"why":"Flavoproteins carry FAD or FMN, e.g. succinate dehydrogenase."}]},{"id":"u7-q007","type":"mcq","unit":7,"part":1,"outcome":"Protein sequencing","bloom":"understand","difficulty":2,"source":"slides","stem":"How does Edman degradation determine a peptide's sequence?","options":[{"id":"a","text":"It labels the N-terminal residue, cleaves it off and identifies it, then repeats on the shorter peptide","correct":true,"why":"Successive cycles read the sequence from the N-terminus."},{"id":"b","text":"It hydrolyses the whole peptide at once in strong acid and reads the order of residues from the mixture","correct":false,"why":"Total hydrolysis gives composition, not order."},{"id":"c","text":"It reads the sequence from the C-terminus, removing one residue at a time with the detergent SDS","correct":false,"why":"Edman chemistry works from the N-terminus; SDS is a detergent."},{"id":"d","text":"It measures the peptide's absorbance at 280 nm after each cycle, which identifies each residue in turn","correct":false,"why":"A280 gives concentration, not sequence."}]},{"id":"u7-q008","type":"mcq","unit":7,"part":1,"outcome":"Protein sequencing","bloom":"understand","difficulty":2,"source":"slides","stem":"Why is mass spectrometry valuable even when a protein's gene sequence is already known?","options":[{"id":"a","text":"It measures actual peptide masses, revealing modifications such as phosphorylation that DNA can't predict","correct":true,"why":"Modifications change mass in characteristic ways that MS can detect."},{"id":"b","text":"It is the only reliable way to measure protein concentration, which the gene sequence cannot give you","correct":false,"why":"Concentration is usually measured by A280 or dye assays."},{"id":"c","text":"It determines the protein's 3D fold directly, showing how the predicted sequence is folded in space","correct":false,"why":"3D structure needs methods such as X-ray crystallography or cryo-EM."},{"id":"d","text":"It works only on intact, folded enzymes, so it confirms that the protein is active and correctly folded","correct":false,"why":"MS typically analyses peptides from digested proteins."}]},{"id":"u7-q009","type":"mcq","unit":7,"part":1,"outcome":"Protein purification and analysis","bloom":"understand","difficulty":2,"source":"slides","stem":"In size-exclusion (gel filtration) chromatography, which proteins elute from the column first?","options":[{"id":"a","text":"The largest proteins, because they can't enter the bead pores and take the shortest path","correct":true,"why":"Small proteins wander through the pores and are retained longer."},{"id":"b","text":"The smallest proteins, because they slip quickly through the pores inside the beads","correct":false,"why":"This is the reverse; small proteins are slowed by entering the pores."},{"id":"c","text":"The most positively charged proteins, which are repelled by the beads and pushed out first","correct":false,"why":"Charge is the basis of ion-exchange chromatography, not size exclusion."},{"id":"d","text":"The proteins with the highest pI, because they bind least tightly to the gel matrix","correct":false,"why":"pI is irrelevant to size exclusion."}]},{"id":"u7-q010","type":"mcq","unit":7,"part":1,"outcome":"Protein purification and analysis","bloom":"apply","difficulty":3,"source":"slides","stem":"A mixture at pH 6.0 contains protein X (pI 8.5) and protein Y (pI 4.5). It is loaded onto a cation-exchange column (negatively charged beads). What happens?","options":[{"id":"a","text":"X binds, being net positive below its pI; Y flows straight through, being net negative","correct":true,"why":"Cation exchangers bind positively charged proteins; bound X can then be eluted with salt or a higher pH."},{"id":"b","text":"Y binds, because it is net negative at pH 6.0, and X flows straight through the column","correct":false,"why":"Y is net negative at pH 6 and is repelled by negative beads."},{"id":"c","text":"Both bind equally, because both proteins carry some positive and some negative groups","correct":false,"why":"Their opposite net charges at pH 6 separate them."},{"id":"d","text":"Neither binds, because ion-exchange columns separate proteins by their size, not charge","correct":false,"why":"Ion exchange separates by charge."}]},{"id":"u7-q011","type":"mcq","unit":7,"part":1,"outcome":"Protein purification and analysis","bloom":"understand","difficulty":2,"source":"slides","stem":"Xanthine oxidase binds tightly to a heparin column. Heparin is a highly negatively charged polysaccharide. What is the basis of this binding?","options":[{"id":"a","text":"Positively charged Lys and Arg residues on the enzyme interact with the negative heparin","correct":true,"why":"This affinity is used to 'fish' the enzyme out of a crude mixture."},{"id":"b","text":"Covalent disulfide bonds form between the enzyme's cysteines and sulfur groups on heparin","correct":false,"why":"Heparin has no –SH groups; the binding is non-covalent and electrostatic."},{"id":"c","text":"Heparin is a substrate that the enzyme binds and slowly hydrolyses as it passes the column","correct":false,"why":"Xanthine oxidase acts on purines, not heparin."},{"id":"d","text":"Large proteins become trapped in the pores of the heparin beads, while small ones pass through","correct":false,"why":"That describes size exclusion."}]},{"id":"u7-q012","type":"mcq","unit":7,"part":1,"outcome":"Protein purification and analysis","bloom":"understand","difficulty":2,"source":"slides","stem":"Why does SDS-PAGE separate proteins by molecular mass alone?","options":[{"id":"a","text":"SDS unfolds the proteins and gives them a uniform negative charge per unit mass, so only size matters","correct":true,"why":"Native shape and charge no longer matter; small proteins move fastest through the gel."},{"id":"b","text":"SDS separates proteins by their pI, so each protein stops where its net charge becomes zero","correct":false,"why":"That is isoelectric focusing."},{"id":"c","text":"SDS keeps proteins in their native fold, so their shape and size together set how fast they move","correct":false,"why":"SDS is a denaturing detergent."},{"id":"d","text":"Large proteins move fastest, because they bind more SDS and so carry more negative charge in total","correct":false,"why":"The charge-to-mass ratio is constant, so the gel's sieving effect slows larger proteins."}]},{"id":"u7-q013","type":"mcq","unit":7,"part":1,"outcome":"Protein purification and analysis","bloom":"understand","difficulty":2,"source":"slides","stem":"In two-dimensional gel electrophoresis, what are the two separation steps?","options":[{"id":"a","text":"Isoelectric focusing (by pI), then SDS-PAGE (by mass) at right angles","correct":true,"why":"Combining two independent properties resolves thousands of proteins as separate spots."},{"id":"b","text":"Size exclusion (by size), then affinity chromatography (by binding)","correct":false,"why":"These are column methods, not gel electrophoresis."},{"id":"c","text":"SDS-PAGE twice in the same direction, first by mass and then by charge","correct":false,"why":"Repeating the same separation gives no new resolution."},{"id":"d","text":"UV absorbance at 280 nm, then Edman degradation of each separated spot","correct":false,"why":"These are analysis methods, not 2D separation."}]},{"id":"u7-q014","type":"mcq","unit":7,"part":1,"outcome":"Protein purification and analysis","bloom":"apply","difficulty":3,"source":"slides","stem":"A crude extract has 10 000 units of enzyme activity in 500 mg of protein. After a column step there are 8000 units in 40 mg. How have specific activity and yield changed?","options":[{"id":"a","text":"Specific activity rose from 20 to 200 units/mg (10-fold purification), with an 80% yield","correct":true,"why":"Specific activity = activity/protein: 10 000/500 = 20 and 8000/40 = 200. Yield = 8000/10 000 = 80%."},{"id":"b","text":"Specific activity fell from 20 to 16 units/mg, because 20% of the activity was lost, so yield is 80%","correct":false,"why":"Total activity fell slightly, but activity per mg rose sharply."},{"id":"c","text":"Specific activity rose 12.5-fold, from 20 to 250 units/mg, with a 100% yield of enzyme activity","correct":false,"why":"12.5 is the fold-reduction in protein (500/40); the yield is 80%, not 100%."},{"id":"d","text":"Nothing changed, because the enzyme units are the same before and after the column step","correct":false,"why":"Removing contaminating protein raises specific activity."}]},{"id":"u7-q015","type":"mcq","unit":7,"part":1,"outcome":"Protein sequencing","bloom":"understand","difficulty":1,"source":"slides","stem":"Why can comparing the sequence of cytochrome c from many species reveal evolutionary relationships?","options":[{"id":"a","text":"Sequence differences accumulate over time, so closely related species have more similar sequences","correct":true,"why":"Alignments of proteins with the same function trace evolutionary divergence."},{"id":"b","text":"Mammals share an identical cytochrome c, so any differences reveal errors in the sequencing method","correc
