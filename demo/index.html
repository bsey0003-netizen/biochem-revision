"why":"Isozymes are different proteins that catalyse the same reaction."}]},{"id":"u11-q007","type":"mcq","unit":11,"part":1,"outcome":"Substrates and cofactors","bloom":"understand","difficulty":2,"source":"general","stem":"Which of these is best described as a prosthetic group?","options":[{"id":"a","text":"Biotin covalently attached to a lysine residue of pyruvate carboxylase","correct":true,"why":"A prosthetic group is bound so tightly (here covalently) that it is a permanent part of the enzyme."},{"id":"b","text":"NAD⁺, which binds a dehydrogenase, accepts electrons and then diffuses away","correct":false,"why":"NAD⁺ binds only temporarily and moves between enzymes, so it acts as a co-substrate."},{"id":"c","text":"Mg²⁺ that binds loosely from solution to activate a kinase","correct":false,"why":"A loosely bound metal makes the enzyme metal-activated; it is not a prosthetic group."},{"id":"d","text":"ATP consumed as a substrate by hexokinase","correct":false,"why":"ATP is a substrate that is converted to ADP."}]},{"id":"u11-q008","type":"mcq","unit":11,"part":1,"outcome":"Substrates and cofactors","bloom":"apply","difficulty":2,"source":"general","stem":"Cats fed mainly raw fish that contains thiaminase can develop neurological signs. Why are key metabolic enzymes affected?","options":[{"id":"a","text":"Thiamine is the precursor of thiamine pyrophosphate, a coenzyme needed by pyruvate dehydrogenase","correct":true,"why":"Most coenzymes come from vitamins. Without thiamine, TPP-dependent enzymes can't work, and neurons, which rely on glucose oxidation, suffer first."},{"id":"b","text":"Thiaminase directly hydrolyses the peptide bonds of enzymes in the brain, destroying their structure","correct":false,"why":"Thiaminase destroys the vitamin, not proteins."},{"id":"c","text":"Thiamine is an inorganic cofactor that stabilises the folded structure of many metabolic enzymes","correct":false,"why":"Thiamine is an organic vitamin; inorganic cofactors are metal ions."},{"id":"d","text":"Thiamine deficiency raises the activation energy of most enzymes in the body","correct":false,"why":"Only enzymes that need TPP are affected."}]},{"id":"u11-q009","type":"mcq","unit":11,"part":1,"outcome":"General properties","bloom":"apply","difficulty":2,"source":"slides","stem":"Trypsin acts on the peptide Ala–Lys–Gly–Phe–Arg–Ser. Which peptide bonds does it cleave?","options":[{"id":"a","text":"Lys–Gly and Arg–Ser","correct":true,"why":"Trypsin cleaves on the carboxyl side of the basic residues Lys and Arg."},{"id":"b","text":"Phe–Arg only","correct":false,"why":"Cleavage after aromatic residues like Phe is typical of chymotrypsin, not trypsin."},{"id":"c","text":"Every peptide bond in the chain","correct":false,"why":"That broad pattern describes papain, not the highly specific trypsin."},{"id":"d","text":"Ala–Lys and Phe–Arg","correct":false,"why":"These bonds are on the amino side of Lys and Arg; trypsin cuts on the carboxyl side."}]},{"id":"u11-q010","type":"mcq","unit":11,"part":1,"outcome":"General properties","bloom":"understand","difficulty":1,"source":"slides","stem":"Why is papain, from papaya, used commercially to tenderise meat?","options":[{"id":"a","text":"It cleaves almost any peptide bond, whatever the neighbouring side chains","correct":true,"why":"Its low specificity lets it break down many different muscle and connective-tissue proteins."},{"id":"b","text":"It cleaves only the Arg–Gly bonds in fibrinogen, which softens the meat's clots","correct":false,"why":"That highly specific activity describes thrombin."},{"id":"c","text":"It forms new disulfide bonds in collagen, which soften the meat's connective tissue","correct":false,"why":"Papain hydrolyses peptide bonds; it does not create cross-links."},{"id":"d","text":"It works only after the meat is fully cooked, when the collagen has turned to gelatin","correct":false,"why":"Cooking denatures and inactivates enzymes; papain works before cooking."}]},{"id":"u11-q011","type":"mcq","unit":11,"part":1,"outcome":"Isozymes","bloom":"understand","difficulty":1,"source":"slides","stem":"Which statement about isozymes is correct?","options":[{"id":"a","text":"They catalyse the same reaction but differ in sequence, kinetics or regulation, from different genes","correct":true,"why":"Isozymes are distinct proteins for the same reaction, often separable by electrophoresis."},{"id":"b","text":"They catalyse different reactions using the same active site, depending on which substrate is present","correct":false,"why":"Isozymes catalyse the SAME reaction."},{"id":"c","text":"They are identical proteins, encoded by one gene, that are found in different organelles of the cell","correct":false,"why":"Isozymes differ in amino acid sequence."},{"id":"d","text":"They are inactive precursors that are activated by proteolysis when the cell needs the enzyme","correct":false,"why":"That describes zymogens."}]},{"id":"u11-q012","type":"mcq","unit":11,"part":1,"outcome":"Isozymes","bloom":"apply","difficulty":2,"source":"slides","stem":"Why is the M4 isozyme of lactate dehydrogenase well suited to hard-working skeletal muscle?","options":[{"id":"a","text":"It works well in anaerobic conditions, reducing pyruvate to lactate to regenerate NAD⁺ for glycolysis","correct":true,"why":"M4 suits the anaerobic environment of intense muscle work; H4 suits the aerobic heart."},{"id":"b","text":"It is encoded by the same gene as the H4 isozyme, but it is folded differently in skeletal muscle","correct":false,"why":"H and M chains come from different genes; that is what makes them isozymes."},{"id":"c","text":"It is a monomer rather than a tetramer, so it diffuses faster through the crowded muscle cytosol","correct":false,"why":"Every functional LDH is a tetramer."},{"id":"d","text":"Skeletal muscle has no other way to make ATP, because its fibres contain no mitochondria at all","correct":false,"why":"Muscle also uses oxidative phosphorylation when O2 is available."}]},{"id":"u11-q013","type":"mcq","unit":11,"part":1,"outcome":"Isozymes","bloom":"apply","difficulty":2,"source":"general","stem":"A horse shows muscle stiffness and reluctance to move after exercise ('tying-up'). Which serum enzyme activity is most useful for confirming skeletal muscle damage?","options":[{"id":"a","text":"Creatine kinase (CK)","correct":true,"why":"CK, mainly the muscle MM isoform, leaks from damaged muscle fibres and rises sharply within hours."},{"id":"b","text":"Alkaline phosphatase (ALP)","correct":false,"why":"ALP mainly reflects bone, liver or bile-duct changes."},{"id":"c","text":"Gamma-glutamyl transferase (GGT)","correct":false,"why":"GGT is a marker of liver and bile-duct disease."},{"id":"d","text":"Lipase","correct":false,"why":"Lipase is used to assess the pancreas."}]},{"id":"u11-q014","type":"mcq","unit":11,"part":1,"outcome":"Enzymatic catalysis","bloom":"understand","difficulty":2,"source":"slides","stem":"How does an enzyme use substrate-binding energy to speed up a reaction between two molecules?","options":[{"id":"a","text":"It pays the entropy cost of bringing the reactants together in the correct orientation","correct":true,"why":"Holding reactants rigidly in the ES complex means the conversion to the transition state no longer loses much entropy."},{"id":"b","text":"It heats the active site above the surrounding temperature, so the reactants collide faster","correct":false,"why":"Enzymes work at the temperature of their surroundings."},{"id":"c","text":"It makes the overall ΔG of the reaction more negative, so the products form more readily","correct":false,"why":"ΔG is fixed by the reactants and products; only ΔG‡ is lowered."},{"id":"d","text":"It stores the binding energy as ATP and spends it later to drive the reaction forward","correct":false,"why":"Binding energy is used directly in the catalytic step, not stored."}]},{"id":"u11-q015","type":"mcq","unit":11,"part":1,"outcome":"Enzymatic catalysis","bloom":"analyse","difficulty":3,"source":"slides","stem":"An enzyme speeds up the conversion of A to B a million-fold. What happens to the reverse reaction (B → A) and to K′eq?","options":[{"id":"a","text":"The reverse reaction is also a million times faster, and K′eq is unchanged","correct":true,"why":"Lowering ΔG‡ speeds both directions equally, so their ratio, K′eq, stays the same."},{"id":"b","text":"The reverse reaction is unchanged, so K′eq rises a million-fold","correct":false,"why":"An enzyme cannot speed up only one direction; that would violate thermodynamics."},{"id":"c","text":"The reverse reaction slows down, pushing the reaction to completion","correct":false,"why":"Enzymes never slow the reverse reaction or change the final equilibrium."},{"id":"d","text":"K′eq falls, because the enzyme binds B and removes it from the reaction","correct":false,"why":"Binding products does not change the equilibrium constant."}]},{"id":"u11-q016","type":"mcq","unit":11,"part":1,"outcome":"Enzymatic catalysis","bloom":"analyse","difficulty":3,"source":"slides","stem":"Why would an enzyme whose active site was perfectly complementary to the substrate, rather than to the transition state, be a poor catalyst?","options":[{"id":"a","text":"Tight substrate binding stabilises ES, deepening an energy well and raising the barrier to the transition state","correct":true,"why":"Catalysis needs the strongest interactions to form in the transition state, which lowers ΔG‡ (Pauling)."},{"id":"b","text":"The substrate could no longer enter the active site, because the site would already be filled by water","correct":false,"why":"A complementary site would bind the substrate very well; the problem lies in what happens next."},{"id":"c","text":"The enzyme would change K′eq in favour of the substrate","correct":false,"why":"Enzymes cannot change K′eq whatever they bind."},{"id":"d","text":"The enzyme would become irreversibly inhibited by its own product","correct":false,"why":"Product binding is not what is described here."}]}],"flashcards":[{"id":"u11-f001","type":"flashcard","unit":11,"part":1,"outcome":"General properties","source":"slides","front":"Are all enzymes proteins?","back":"Almost all. Ribozymes are catalytic RNA molecules."},{"id":"u11-f002","type":"flashcard","unit":11,"part":1,"outcome":"Substrates and cofactors","source":"slides","front":"Cofactor vs coenzyme?","back":"Cofactor: an inorganic ion (Fe²⁺, Mg²⁺, Mn²⁺, Zn²⁺). Coenzyme: an organic or metallo-organic molecule that carries groups temporarily; most come from vitamins."},{"id":"u11-f003","type":"flashcard","unit":11,"part":1,"outcome":"Substrates and cofactors","source":"slides","front":"Prosthetic group?","back":"A cofactor or coenzyme bound very tightly, often covalently, so it is a permanent part of the enzyme."},{"id":"u11-f004","type":"flashcard","unit":11,"part":1,"outcome":"Substrates and cofactors","source":"slides","front":"Holoenzyme vs apoenzyme?","back":"Holoenzyme: the active enzyme with its cofactor bound. Apoenzyme: the protein part alone."},{"id":"u11-f005","type":"flashcard","unit":11,"part":1,"outcome":"Classification","source":"slides","front":"The six main enzyme classes, in EC order?","back":"1 Oxidoreductases, 2 Transferases, 3 Hydrolases, 4 Lyases, 5 Isomerases, 6 Ligases. (A 7th class, translocases, was added in 2018.)"},{"id":"u11-f006","type":"flashcard","unit":11,"part":1,"outcome":"Classification","source":"slides","front":"What does EC 2.7.1.1 (hexokinase) mean?","back":"2 transferase · 7 phosphotransferase · 1 OH group as acceptor · 1 D-glucose as acceptor."},{"id":"u11-f007","type":"flashcard","unit":11,"part":1,"outcome":"General properties","source":"slides","front":"Papain vs trypsin vs thrombin specificity?","back":"Papain: almost any peptide bond. Trypsin: carboxyl side of Lys/Arg. Thrombin: specific Arg–Gly bonds only."},{"id":"u11-f008","type":"flashcard","unit":11,"part":1,"outcome":"Isozymes","source":"slides","front":"Isozymes?","back":"Different proteins (different genes) that catalyse the same reaction, with different kinetics or regulation. Separable by electrophoresis, e.g. LDH H4 vs M4."},{"id":"u11-f009","type":"flashcard","unit":11,"part":1,"outcome":"Isozymes","source":"slides","front":"LDH M4 vs H4?","back":"M4: anaerobic, hard-working skeletal muscle. H4: aerobic heart muscle."},{"id":"u11-f010","type":"flashcard","unit":11,"part":1,"outcome":"Enzymatic catalysis","source":"slides","front":"Why do enzymes bind the transition state best?","back":"Extra interactions with the transition state lower ΔG‡ (Pauling, 1946). Transition-state analogues are therefore potent inhibitors."}]},{"unit":12,"title":"Enzyme kinetics and mechanisms","outcomes":["Main mechanisms of catalysis","Enzyme kinetics – Michaelis–Menten equation","Enzymatic inhibition","Effects of pH and temperature on enzyme activity"],"summary":{"overview":"Enzymes speed up reactions by lowering the activation energy (ΔG‡); they never change the equilibrium. Kinetics describes how fast an enzyme works (Vmax, kcat), how well it binds its substrate (Km), and how inhibitors change these values.","sections":[{"heading":"How enzymes catalyse","points":["Enzymes lower ΔG‡ only. ΔG°′ and K′eq are unchanged, so equilibrium is simply reached faster.","Binding energy holds reactants close together and correctly oriented, and the active site binds the transition state more tightly than the substrate.","Acid–base catalysis: residues such as His, Asp and Glu donate or remove protons.","Covalent catalysis: a transient enzyme–substrate bond, e.g. the Schiff base in Class I aldolase.","Metal-ion catalysis: orienting the substrate, redox, and shielding charge, e.g. Mg²⁺–ATP in kinases."]},{"heading":"Michaelis–Menten kinetics","points":["v0 = Vmax[S] / (Km + [S]). Measure initial rates, while [P] ≈ 0.","Km = [S] at which v0 = ½Vmax. As a rough guide, a lower Km means tighter binding.","kcat is the turnover number; Vmax = kcat[E]t.","kcat/Km measures catalytic efficiency; its diffusion limit is ≈ 10⁸–10⁹ M⁻¹s⁻¹.","Lineweaver–Burk plot (1/v0 vs 1/[S]): y-intercept = 1/Vmax, x-intercept = −1/Km, slope = Km/Vmax."]},{"heading":"Inhibition","points":["Competitive: binds the active site of free E. Km rises, Vmax is unchanged, and the lines meet on the y-axis. High [S] overcomes it.","Uncompetitive: binds ES only. Km and Vmax both fall, and the lines are parallel.","Mixed: binds both E and ES. Vmax falls, Km changes, and the lines meet left of the y-axis. Non-competitive is the special case where Km is unchanged.","Irreversible: covalent inactivation (e.g. organophosphates on acetylcholinesterase) removes active enzyme, so Vmax falls."]},{"heading":"Two substrates, pH and temperature","points":["Sequential mechanisms (a ternary complex forms) give intersecting lines; ping-pong mechanisms give parallel lines.","The pH optimum reflects the ionisation state of catalytic and binding groups; extremes of pH denature the enzyme.","The rate rises with temperature until the protein denatures."]}],"keyTerms":[{"term":"ΔG‡ (activation energy)","definition":"Energy barrier to reach the transition state; enzymes lower it."},{"term":"Km","definition":"Substrate concentration giving half of Vmax."},{"term":"Vmax","definition":"Maximum rate when the enzyme is saturated; Vmax = kcat[E]t."},{"term":"kcat","definition":"Turnover number: substrate molecules converted per active site per second."},{"term":"kcat/Km","definition":"Specificity constant, a measure of catalytic efficiency."},{"term":"Lineweaver–Burk plot","definition":"Double-reciprocal plot of 1/v0 against 1/[S]."},{"term":"Competitive inhibitor","definition":"Competes with the substrate for the active site; raises apparent Km."},{"term":"Uncompetitive inhibitor","definition":"Binds the ES complex only; lowers both Km and Vmax."},{"term":"Ping-pong mechanism","definition":"First product leaves before the second substrate binds."}],"examTips":["Km is not the same as Kd: they are equal only when k2 ≪ k−1.","Read Vmax changes from the y-intercept and Km changes from the x-intercept. Competitive inhibition leaves 1/Vmax unchanged.","Parallel Lineweaver–Burk lines mean uncompetitive inhibition OR a ping-pong mechanism; check what was varied.","Enzymes never make an unfavourable reaction favourable; they only reach equilibrium faster."]},"questions":[{"id":"u12-q001","type":"mcq","unit":12,"part":1,"outcome":"Enzyme kinetics – Michaelis–Menten equation","bloom":"remember","difficulty":1,"source":"slides","stem":"Which definition of Km is always true for an enzyme that follows Michaelis–Menten kinetics?","options":[{"id":"a","text":"The substrate concentration at which v0 = ½ Vmax","correct":true,"why":"Setting [S] = Km in v0 = Vmax[S]/(Km + [S]) gives v0 = Vmax/2, whatever the mechanism."},{"id":"b","text":"The dissociation constant of the ES complex","correct":false,"why":"Km equals Kd only when k2 ≪ k−1; in general Km = (k−1 + k2)/k1."},{"id":"c","text":"The maximum rate reached when the enzyme is saturated","correct":false,"why":"That is Vmax."},{"id":"d","text":"The number of substrate molecules converted per enzyme per second","correct":false,"why":"That is kcat, the turnover number."}]},{"id":"u12-q002","type":"mcq","unit":12,"part":1,"outcome":"Enzyme kinetics – Michaelis–Menten equation","bloom":"apply","difficulty":2,"source":"slides","stem":"An enzyme obeys Michaelis–Menten kinetics. At [S] = 4 Km, what is v0 as a fraction of Vmax?","options":[{"id":"a","text":"0.80","correct":true,"why":"v0/Vmax = [S]/(Km + [S]) = 4Km/5Km = 0.80."},{"id":"b","text":"0.25","correct":false,"why":"This inverts the ratio; 0.25 would be v0/Vmax at [S] = Km/3."},{"id":"c","text":"0.50","correct":false,"why":"Half of Vmax is reached at [S] = Km, not 4 Km."},{"id":"d","text":"1.00","correct":false,"why":"Vmax is only approached asymptotically; it is never reached at a finite [S]."}]},{"id":"u12-q003","type":"mcq","unit":12,"part":1,"outcome":"Main mechanisms of catalysis","bloom":"understand","difficulty":1,"source":"slides","stem":"Which quantity does an enzyme change for the reaction it catalyses?","options":[{"id":"a","text":"The activation free energy, ΔG‡","correct":true,"why":"Enzymes speed up reactions by lowering ΔG‡, mainly by binding the transition state more tightly than the substrate."},{"id":"b","text":"The standard free-energy change, ΔG°′","correct":false,"why":"ΔG°′ depends only on the initial and final states, which the enzyme does not change."},{"id":"c","text":"The equilibrium constant, K′eq","correct":false,"why":"K′eq is fixed by ΔG°′; an enzyme speeds up both directions equally."},{"id":"d","text":"The final ratio of product to substrate at equilibrium","correct":false,"why":"This is K′eq again; enzymes only reach equilibrium faster."}]},{"id":"u12-q004","type":"mcq","unit":12,"part":1,"outcome":"Enzyme kinetics – Michaelis–Menten equation","bloom":"understand","difficulty":2,"source":"slides","stem":"Two substrates compete for the same enzyme. Which parameter best predicts which substrate will be converted faster when both are at low concentration?","options":[{"id":"a","text":"kcat/Km (the specificity constant)","correct":true,"why":"At [S] ≪ Km, v0 ≈ (kcat/Km)[E]t[S], so kcat/Km sets the relative rates; its upper limit is diffusion (10⁸–10⁹ M⁻¹s⁻¹)."},{"id":"b","text":"kcat alone (the turnover number)","correct":false,"why":"kcat describes the saturated enzyme; at low [S], binding (Km) matters as much as turnover."},{"id":"c","text":"Km alone (the substrate affinity)","correct":false,"why":"A low Km means good binding, but a slow kcat could still make conversion slow."},{"id":"d","text":"Vmax (the maximum velocity)","correct":false,"why":"Vmax depends on enzyme concentration and describes saturating, not low, [S]."}]},{"id":"u12-q005","type":"mcq","unit":12,"part":1,"outcome":"Enzyme kinetics – Michaelis–Menten equation","bloom":"apply","difficulty":2,"source":"slides","stem":"A Lineweaver–Burk plot cuts the x-axis at −0.5 mM⁻¹ and the y-axis at 0.02 min/µmol. What are Km and Vmax?","options":[{"id":"a","text":"Km = 2 mM; Vmax = 50 µmol/min","correct":true,"why":"x-intercept = −1/Km, so Km = 2 mM; y-intercept = 1/Vmax, so Vmax = 50 µmol/min."},{"id":"b","text":"Km = 0.5 mM; Vmax = 0.02 µmol/min","correct":false,"why":"The intercepts are reciprocals and must be inverted."},{"id":"c","text":"Km = 50 mM; Vmax = 2 µmol/min","correct":false,"why":"This swaps the two intercepts: the x-axis gives Km and the y-axis gives Vmax."},{"id":"d","text":"Km = −2 mM; Vmax = 50 µmol/min","correct":false,"why":"The x-intercept is −1/Km; Km itself is positive."}]},{"id":"u12-q006","type":"mcq","unit":12,"part":1,"outcome":"Enzymatic inhibition","bloom":"understand","difficulty":1,"source":"slides","stem":"Lineweaver–Burk lines measured with and without an inhibitor meet on the y-axis. What type of inhibition is this?","options":[{"id":"a","text":"Competitive: apparent Km increases, Vmax unchanged","correct":true,"why":"Same y-intercept (1/Vmax) but a steeper slope (αKm/Vmax): high [S] can outcompete the inhibitor."},{"id":"b","text":"Uncompetitive: apparent Km and Vmax both decrease","correct":false,"why":"Uncompetitive inhibition gives parallel lines."},{"id":"c","text":"Mixed: the lines meet to the left of the y-axis","correct":false,"why":"Mixed inhibition changes Vmax, so the y-intercept moves."},{"id":"d","text":"Irreversible: Vmax decreases while Km is unchanged","correct":false,"why":"Lowering Vmax would raise the y-intercept; here the y-intercept is unchanged."}]},{"id":"u12-q007","type":"mcq","unit":12,"part":1,"outcome":"Enzymatic inhibition","bloom":"understand","difficulty":2,"source":"slides","stem":"An inhibitor binds only to the ES complex. Which kinetic pattern results?","options":[{"id":"a","text":"Apparent Vmax and Km both fall by the same factor; Lineweaver–Burk lines are parallel","correct":true,"why":"Uncompetitive: Vmax/α′ and Km/α′, so the slope Km/Vmax stays the same and the lines are parallel."},{"id":"b","text":"Apparent Km rises while Vmax is unchanged; the lines meet on the y-axis","correct":false,"why":"That is competitive inhibition, where the inhibitor binds free E."},{"id":"c","text":"Vmax falls while Km is unchanged; the Lineweaver–Burk lines meet on the x-axis","correct":false,"why":"That is pure non-competitive inhibition (a special case of mixed), where the inhibitor binds E and ES equally."},{"id":"d","text":"No change, because the substrate is already bound when the inhibitor arrives","correct":false,"why":"Binding to ES blocks catalysis, so it does inhibit."}]},{"id":"u12-q008","type":"mcq","unit":12,"part":1,"outcome":"Enzymatic inhibition","bloom":"apply","difficulty":2,"source":"general","stem":"A dog has drunk antifreeze (ethylene glycol). Fomepizole is given: it binds the active site of alcohol dehydrogenase, which would otherwise convert ethylene glycol into toxic metabolites. What is its effect on ADH kinetics for ethylene glycol?","options":[{"id":"a","text":"Apparent Km increases; Vmax unchanged","correct":true,"why":"Fomepizole is a competitive inhibitor. By raising the apparent Km, it slows ethylene glycol oxidation at the substrate concentrations found in the body."},{"id":"b","text":"Vmax decreases; Km unchanged","correct":false,"why":"That pattern fits pure non-competitive or irreversible inhibition, not an active-site competitor."},{"id":"c","text":"Km and Vmax both decrease","correct":false,"why":"That is uncompetitive inhibition, which needs the inhibitor to bind the ES complex."},{"id":"d","text":"kcat increases, so ethylene glycol is cleared faster","correct":false,"why":"Inhibitors do not increase kcat; the aim is to slow formation of toxic metabolites."}]},{"id":"u12-q009","type":"mcq","unit":12,"part":1,"outcome":"Enzymatic inhibition","bloom":"analyse","difficulty":3,"source":"general","stem":"Organophosphate insecticides covalently modify the active-site serine of acetylcholinesterase in poisoned livestock. Measured on the remaining active enzyme, what kinetic change does this produce?","options":[{"id":"a","text":"Vmax decreases while Km is unchanged, and adding more substrate cannot reverse it","correct":true,"why":"Irreversible inactivation removes enzyme molecules, lowering [E]t and so Vmax; the surviving enzyme still has its normal Km."},{"id":"b","text":"Km increases while Vmax is unchanged, and excess acetylcholine restores activity","correct":false,"why":"That describes reversible competitive inhibition; a covalent adduct does not dissociate."},{"id":"c","text":"Km and Vmax both decrease, with parallel Lineweaver–Burk lines","correct":false,"why":"That is uncompetitive inhibition, which needs reversible binding to ES."},{"id":"d","text":"No change in kinetics; only the enzyme's half-life changes","correct":false,"why":"Losing active enzyme directly reduces the maximum rate."}]},{"id":"u12-q010","type":"mcq","unit":12,"part":1,"outcome":"Enzymatic inhibition","bloom":"understand","difficulty":2,"source":"slides","stem":"Which statement about mixed inhibition is correct?","options":[{"id":"a","text":"It binds both E and ES, Vmax decreases, and Lineweaver–Burk lines meet left of the y-axis","correct":true,"why":"Mixed inhibitors bind a site away from the active site, on both E and ES; non-competitive is the special case where Km is unchanged."},{"id":"b","text":"The inhibitor binds only the active site of free enzyme, and the lines meet on the y-axis","correct":false,"why":"That describes competitive inhibition."},{"id":"c","text":"The inhibitor binds only the ES complex, and the Lineweaver–Burk lines run parallel","correct":false,"why":"That describes uncompetitive inhibition."},{"id":"d","text":"Vmax is unchanged because high [S] displaces the inhibitor","correct":false,"why":"Mixed inhibitors also bind ES, so substrate cannot fully overcome them and Vmax falls."}]},{"id":"u12-q011","type":"mcq","unit":12,"part":1,"outcome":"Main mechanisms of catalysis","bloom":"understand","difficulty":2,"source":"slides","stem":"Why are transition-state analogues often far more potent inhibitors than substrate analogues?","options":[{"id":"a","text":"Active sites are complementary to the transition state, so they bind its mimics more tightly than substrate","correct":true,"why":"Pauling's idea: extra interactions with the transition state lower ΔG‡, and analogues capture that extra binding energy."},{"id":"b","text":"Transition-state analogues bind covalently to the enzyme, so they are not released from the active site","correct":false,"why":"Most are reversible, non-covalent inhibitors; their potency comes from complementarity."},{"id":"c","text":"They bind an allosteric site distinct from the active site, which locks the enzyme in its inactive T state","correct":false,"why":"They bind the active site, because they mimic the transition state formed there."},{"id":"d","text":"They increase ΔG′° of the reaction, making it thermodynamically unfavourable for the enzyme to catalyse","correct":false,"why":"Inhibitors do not change the thermodynamics of the reaction."}]},{"id":"u12-q012","type":"mcq","unit":12,"part":1,"outcome":"Main mechanisms of catalysis","bloom":"understand","difficulty":2,"source":"slides","stem":"Histidine is a common general acid–base catalyst in active sites. What property makes it especially suitable?","options":[{"id":"a","text":"Its imidazole pKa (≈ 6) is close to physiological pH, so it can donate or accept protons","correct":true,"why":"Near pH 7, significant fractions are protonated and unprotonated, so His can shuttle protons in both directions."},{"id":"b","text":"It is the only amino acid with an ionisable side chain, so it is the only one that can move protons","correct":false,"why":"Asp, Glu, Lys, Arg, Cys and Tyr also have ionisable side chains used in catalysis."},{"id":"c","text":"Its side chain is permanently positively charged at all pH values","correct":false,"why":"A permanently charged group cannot both donate and accept protons; that describes Arg more closely."},{"id":"d","text":"It forms transient disulfide bonds with the substrate that hold it in place during catalysis","correct":false,"why":"Disulfides involve Cys, and they are not part of acid–base catalysis."}]},{"id":"u12-q013","type":"mcq","unit":12,"part":1,"outcome":"Main mechanisms of catalysis","bloom":"apply","difficulty":2,"source":"slides","stem":"Class I aldolase forms a Schiff base between an active-site lysine and its substrate. Which catalytic strategy is this?","options":[{"id":"a","text":"Covalent catalysis","correct":true,"why":"A transient covalent enzyme–substrate bond (Lys ε-amino group to the carbonyl) changes the reaction pathway."},{"id":"b","text":"Metal-ion catalysis","correct":false,"why":"Class I aldolase uses no metal; zinc-dependent Class II aldolases are found mainly in microbes."},{"id":"c","text":"Proximity effects only","correct":false,"why":"Proximity helps, but forming a covalent intermediate is the defining feature here."},{"id":"d","text":"Allosteric activation","correct":false,"why":"Allostery involves effector binding at a separate site, not a covalent link to the substrate."}]},{"id":"u12-q014","type":"mcq","unit":12,"part":1,"outcome":"Main mechanisms of catalysis","bloom":"understand","difficulty":2,"source":"slides","stem":"Kinases use Mg²⁺–ATP rather than free ATP as their substrate. What is the main catalytic role of the Mg²⁺?","options":[{"id":"a","text":"It shields the negative charges of the phosphates and orients ATP for nucleophilic attack","correct":true,"why":"Metal ions bind substrates in a set orientation and stabilise developing negative charge; they act electrostatically."},{"id":"b","text":"It is reduced to Mg⁺ and drives the phosphoryl transfer","correct":false,"why":"Mg²⁺ is not redox active in biology; redox roles belong to transition metals such as Fe and Cu."},{"id":"c","text":"It forms a covalent bond with the γ-phosphate that is transferred to the enzyme","correct":false,"why":"Mg²⁺ coordinates the phosphates; it is not covalently transferred."},{"id":"d","text":"It is a tightly bound prosthetic group, making the kinase a metalloenzyme","correct":false,"why":"Mg²⁺ binds loosely from solution, so kinases are metal-activated enzymes rather than metalloenzymes."}]},{"id":"u12-q015","type":"mcq","unit":12,"part":1,"outcome":"Effects of pH and temperature on enzyme activity","bloom":"understand","difficulty":1,"source":"slides","stem":"Why do many enzymes show a bell-shaped pH–activity curve with a clear optimum?","options":[{"id":"a","text":"Catalytic and binding groups must be in the right ionisation state, and extreme pH denatures the protein","correct":true,"why":"Moving away from the optimum protonates or deprotonates key residues (and the substrate); at extremes, folding is lost."},{"id":"b","text":"pH changes ΔG°′ of the reaction, and the optimum is where ΔG°′ is most negative","correct":false,"why":"The pH optimum reflects the enzyme's ionisation state, not reaction thermodynamics."},{"id":"c","text":"H⁺ ions are a cofactor needed by most enzymes, so activity peaks where the H⁺ supply is just right","correct":false,"why":"H⁺ is not a general cofactor; the effect works through ionisable groups."},{"id":"d","text":"Enzymes are soluble only at their pH optimum, so at other pH values they precipitate out of solution","correct":false,"why":"Solubility is not what limits activity across the physiological pH range."}]},{"id":"u12-q016","type":"mcq","unit":12,"part":1,"outcome":"Effects of pH and temperature on enzyme activity","bloom":"apply","difficulty":2,"source":"general","stem":"A serum enzyme assay validated at 37 °C is accidentally run at 60 °C, and the measured activity is much lower. What is the best explanation?","options":[{"id":"a","text":"The enzyme is denatured by heat, and loss of its native fold outweighs the faster rate expected","correct":true,"why":"Activity rises with temperature until the protein unfolds; above that point, inactivation dominates."},{"id":"b","text":"Higher temperature lowers reaction rates, because the molecules move too fast to bind","correct":false,"why":"Below the denaturation point, rates increase with temperature."},{"id":"c","text":"Km decreases at high temperature, so the enzyme becomes saturated and slows to a minimum","correct":false,"why":"Saturation would raise v0 towards Vmax, not lower it."},{"id":"d","text":"Heat converts the active enzyme back into its inactive zymogen by re-joining the cleaved peptide","correct":false,"why":"Zymogen activation is an irreversible proteolytic cleavage; heat cannot reverse it."}]},{"id":"u12-q017","type":"mcq","unit":12,"part":1,"outcome":"Enzyme kinetics – Michaelis–Menten equation","bloom":"understand","difficulty":2,"source":"slides","stem":"Why are kinetic measurements made on the initial velocity v0?","options":[{"id":"a","text":"[S] is known and barely changed, and too little product has formed for reverse reaction or inhibition","correct":true,"why":"The derivation assumes [P] ≈ 0 and a steady state of ES, which holds only early in the reaction."},{"id":"b","text":"The enzyme is not yet fully folded at later times, so only early rates reflect its true activity","correct":false,"why":"The enzyme is folded and active throughout the assay."},{"id":"c","text":"v0 is equal to Vmax, so it gives the enzyme's maximum rate directly from a single measurement","correct":false,"why":"v0 depends on [S]; it approaches Vmax only at saturating [S]."},{"id":"d","text":"Km changes as the reaction proceeds, so it can only be measured before the substrate starts to run out","correct":false,"why":"Km is a constant; the measured rate drifts because [S] falls and [P] rises."}]},{"id":"u12-q018","type":"mcq","unit":12,"part":1,"outcome":"Enzyme kinetics – Michaelis–Menten equation","bloom":"understand","difficulty":2,"source":"slides","stem":"For a two-substrate enzyme, 1/v0 versus 1/[A] is plotted at several fixed [B], giving a set of parallel lines. What does this indicate?","options":[{"id":"a","text":"A ping-pong (double-displacement) mechanism","correct":true,"why":"The first product leaves before the second substrate binds, so changing [B] gives parallel lines."},{"id":"b","text":"An ordered sequential (ternary-complex) mechanism","correct":false,"why":"Sequential mechanisms form a ternary complex and give lines that intersect."},{"id":"c","text":"A random sequential (ternary-complex) mechanism","correct":false,"why":"Random sequential is also a ternary-complex mechanism with intersecting lines."},{"id":"d","text":"Competitive inhibition of substrate A by substrate B","correct":false,"why":"That would give lines meeting on the y-axis, not parallel lines."}]}],"flashcards":[{"id":"u12-f001","type":"flashcard","unit":12,"part":1,"outcome":"Enzyme kinetics – Michaelis–Menten equation","source":"slides","front":"Michaelis–Menten equation?","back":"v0 = Vmax[S] / (Km + [S])"},{"id":"u12-f002","type":"flashcard","unit":12,"part":1,"outcome":"Enzyme kinetics – Michaelis–Menten equation","source":"slides","front":"Lineweaver–Burk equation and intercepts?","back":"1/v0 = (Km/Vmax)(1/[S]) + 1/Vmax. y-intercept = 1/Vmax; x-intercept = −1/Km; slope = Km/Vmax."},{"id":"u12-f003","type":"flashcard","unit":12,"part":1,"outcome":"Enzyme kinetics – Michaelis–Menten equation","source":"slides","front":"kcat?","back":"Turnover number: substrate molecules converted per active site per second at saturation. Vmax = kcat[E]t."},{"id":"u12-f004","type":"flashcard","unit":12,"part":1,"outcome":"Enzyme kinetics – Michaelis–Menten equation","source":"slides","front":"kcat/Km and its upper limit?","back":"Specificity constant (catalytic efficiency). Limited by diffusion to ≈ 10⁸–10⁹ M⁻¹s⁻¹ (e.g. acetylcholinesterase, fumarase)."},{"id":"u12-f005","type":"flashcard","unit":12,"part":1,"outcome":"Enzymatic inhibition","source":"slides","front":"Competitive inhibition: Km, Vmax, LB plot?","back":"Apparent Km increases (αKm), Vmax unchanged, lines meet on the y-axis."},{"id":"u12-f006","type":"flashcard","unit":12,"part":1,"outcome":"Enzymatic inhibition","source":"slides","front":"Uncompetitive inhibition: Km, Vmax, LB plot?","back":"Binds ES only. Km and Vmax both fall by α′, slope Km/Vmax unchanged, lines parallel."},{"id":"u12-f007","type":"flashcard","unit":12,"part":1,"outcome":"Enzymatic inhibition","source":"slides","front":"Mixed inhibition: Km, Vmax, LB plot?","back":"Binds E and ES. Vmax falls, Km changes, lines meet left of the y-axis. Non-competitive = special case with Km unchanged."},{"id":"u12-f008","type":"flashcard","unit":12,"part":1,"outcome":"Enzymatic inhibition","source":"general","front":"Irreversible inhibitor: kinetic effect? Veterinary example?","back":"Removes active enzyme, so Vmax falls and Km is unchanged; it cannot be overcome by substrate. Example: organophosphates acting on acetylcholinesterase."},{"id":"u12-f009","type":"flashcard","unit":12,"part":1,"outcome":"Main mechanisms of catalysis","source":"slides","front":"Three main mechanisms of catalysis?","back":"Acid–base (proton donation and abstraction), covalent (transient enzyme–substrate bond), metal ion (orientation, redox, charge shielding)."},{"id":"u12-f010","type":"flashcard","unit":12,"part":1,"outcome":"Main mechanisms of catalysis","source":"slides","front":"Do enzymes change ΔG°′ or K′eq?","back":"No. They lower ΔG‡ only, reaching the same equilibrium faster."},{"id":"u12-f011","type":"flashcard","unit":12,"part":1,"outcome":"Main mechanisms of catalysis","source":"slides","front":"Metalloenzyme vs metal-activated enzyme?","back":"Metalloenzyme: tightly bound, usually a transition metal (Fe²⁺, Zn²⁺). Metal-activated: loosely binds Na⁺, K⁺ or Mg²⁺ from solution."},{"id":"u12-f012","type":"flashcard","unit":12,"part":1,"outcome":"Effects of pH and temperature on enzyme activity","source":"slides","front":"Why do enzymes have pH and temperature optima?","back":"pH: ionisation of catalytic and binding groups, with denaturation at extremes. Temperature: the rate rises until heat denatures the protein."}]},{"unit":13,"title":"Regulation of enzyme activity","outcomes":["Enzymatic regulation mechanism","Allosteric enzymes","Reversible covalent modification","Irreversible covalent modification (proteolysis)","Protein-protein interactions","Changes in subcellular localisation"],"summary":{"overview":"Cells control enzyme activity over timescales from seconds to hours. They use small molecules binding allosteric sites, reversible covalent marks such as phosphorylation, irreversible proteolytic activation of zymogens, and partner proteins or changes in location. Key enzymes often combine several of these.","sections":[{"heading":"Allosteric regulation","points":["Allosteric modulators are usually small molecules. They bind a regulatory site that is separate from the active site.","Positive modulators increase activity; negative modulators decrease it.","Allosteric enzymes do not follow Michaelis–Menten kinetics. They give sigmoidal curves, described by K0.5 instead of Km.","Homotropic: the substrate itself is the modulator. Heterotropic: a different molecule is the modulator.","In ATCase, CTP (the pathway's end product) is a negative modulator and ATP is a positive one. Each shifts K0.5 without changing Vmax."]},{"heading":"Reversible covalent modification","points":["More than 500 types exist. Modifying a residue changes its charge and local properties, and can change the enzyme's conformation.","Phosphorylation is the most important. Protein kinases transfer the γ-phosphoryl group of ATP to Ser, Thr or Tyr (occasionally His), and phosphatases remove it.","The bulky, negatively charged phosphate can form hydrogen bonds or repel Asp and Glu, changing substrate binding and catalysis.","About 80% of soluble eukaryotic proteins are acetylated at their amino terminus.","Ubiquitin tags a protein for degradation; SUMO marks nuclear proteins involved in transcription, chromatin and DNA repair."]},{"heading":"Irreversible activation: zymogens","points":["A zymogen (proenzyme) is an inactive precursor, switched on by cutting specific peptide bonds.","No ATP is needed, so enzymes can be activated outside cells, e.g. in the gut lumen or the blood.","Digestive enzymes: enteropeptidase activates trypsinogen to trypsin, and trypsin then activates chymotrypsinogen and the other pancreatic zymogens.","Other examples: the blood-clotting cascade, proinsulin → insulin, procollagen → collagen, procollagenase, and procaspases in apoptosis."]},{"heading":"Partner proteins and location","points":["Protein kinase A: regulatory subunits bind and block the catalytic subunits. cAMP binds the regulatory subunits and releases the active catalytic subunits.","Liver glucokinase is held in the nucleus by a regulatory protein when glucose is low, and is released into the cytosol after a meal."]},{"heading":"Several layers at once","points":["Glycogen phosphorylase is allosterically activated by AMP and inhibited by ATP and glucose 6-phosphate.","It is also phosphorylated by phosphorylase kinase in response to glucagon or adrenaline, converting the less active b form into the active a form; a phosphatase (PP1) reverses this."]}],"keyTerms":[{"term":"Allosteric enzyme","definition":"Enzyme regulated by modulators binding a site other than the active site."},{"term":"K0.5","definition":"Substrate concentration giving half-maximal velocity for an allosteric enzyme."},{"term":"Feedback inhibition","definition":"The end product of a pathway inhibits an early enzyme of that pathway."},{"term":"Protein kinase","definition":"Enzyme that transfers the γ-phosphate of ATP to Ser, Thr or Tyr."},{"term":"Phosphatase","definition":"Enzyme that removes phosphate groups, reversing kinase action."},{"term":"Ubiquitin","definition":"Small protein tag that targets proteins for degradation."},{"term":"Zymogen","definition":"Inactive enzyme precursor activated by specific proteolysis."},{"term":"Enteropeptidase","definition":"Intestinal protease that converts trypsinogen into trypsin."}],"examTips":["Allosteric enzymes do NOT follow Michaelis–Menten kinetics: use K0.5, not Km.","Proteolytic activation is irreversible; phosphorylation is reversible (by phosphatases).","Kinases use the γ (terminal) phosphate of ATP.","Trypsin activates all the pancreatic zymogens, which is why premature trypsin activation is so damaging."]},"questions":[{"id":"u13-q001","type":"mcq","unit":13,"part":1,"outcome":"Allosteric enzymes","bloom":"understand","difficulty":1,"source":"slides","stem":"For an enzyme whose substrate is also its positive (homotropic) allosteric modulator, what does a plot of v0 against [S] look like?","options":[{"id":"a","text":"Sigmoidal: the enzyme shifts from the low-activity T state to the R state as [S] rises","correct":true,"why":"Like haemoglobin's O2 curve, substrate binding favours the R state, giving cooperative, sigmoidal kinetics."},{"id":"b","text":"Hyperbolic, exactly as the Michaelis–Menten equation predicts for a single-site enzyme","correct":false,"why":"Allosteric enzymes do not follow simple Michaelis–Menten kinetics."},{"id":"c","text":"A straight line through the origin at all [S], because each S also activates the enzyme","correct":false,"why":"No enzyme stays linear at saturating [S]."},{"id":"d","text":"Bell-shaped, with activity falling at high [S] as the substrate inhibits its own binding","correct":false,"why":"A bell shape describes pH profiles, not homotropic activation."}]},{"id":"u13-q002","type":"mcq","unit":13,"part":1,"outcome":"Allosteric enzymes","bloom":"apply","difficulty":2,"source":"slides","stem":"CTP, the end product of pyrimidine synthesis, inhibits aspartate transcarbamoylase (ATCase), the first enzyme of the pathway. What kind of regulation is this?","options":[{"id":"a","text":"Feedback inhibition by a heterotropic negative allosteric modulator","correct":true,"why":"CTP is not the substrate; it binds a regulatory site and lowers activity when product is plentiful."},{"id":"b","text":"Competitive inhibition at the active site, where CTP mimics aspartate","correct":false,"why":"CTP binds the regulatory subunits, not the catalytic site."},{"id":"c","text":"Reversible covalent modification of the enzyme by phosphorylation","correct":false,"why":"No covalent bond is formed; binding is non-covalent and fast."},{"id":"d","text":"Zymogen activation by cleavage of the regulatory subunits","correct":false,"why":"ATCase is not activated by proteolysis."}]},{"id":"u13-q003","type":"mcq","unit":13,"part":1,"outcome":"Allosteric enzymes","bloom":"analyse","difficulty":3,"source":"slides","stem":"ATP is a positive modulator of ATCase that changes K0.5 but not Vmax. How does adding ATP change the enzyme's v0 vs [S] curve?","options":[{"id":"a","text":"The curve shifts to the left (lower K0.5) and reaches the same plateau","correct":true,"why":"A positive modulator makes half-maximal activity occur at a lower [S], with Vmax unchanged."},{"id":"b","text":"The curve shifts to the right (higher K0.5) and reaches the same plateau","correct":false,"why":"That would describe a negative modulator such as CTP."},{"id":"c","text":"The plateau rises but K0.5 is unchanged","correct":false,"why":"The question says Vmax is unchanged; only K0.5 changes."},{"id":"d","text":"The curve becomes hyperbolic and its plateau falls","correct":false,"why":"ATP neither removes the sigmoidal shape nor lowers Vmax."}]},{"id":"u13-q004","type":"mcq","unit":13,"part":1,"outcome":"Allosteric enzymes","bloom":"understand","difficulty":2,"source":"slides","stem":"How can an allosteric effector regulate an enzyme even though it is structurally unrelated to the substrate?","options":[{"id":"a","text":"It binds a separate regulatory site and changes the enzyme's conformation","correct":true,"why":"Because the effector site is distinct from the active site, the effector does not need to resemble the substrate."},{"id":"b","text":"It competes with the substrate for the active site, blocking the substrate","correct":false,"why":"That would need structural similarity, as in competitive inhibition."},{"id":"c","text":"It covalently modifies the catalytic residues so that they cannot react","correct":false,"why":"Allosteric binding is non-covalent and reversible."},{"id":"d","text":"It changes the K′eq of the reaction, so less product forms at equilibrium","correct":false,"why":"No regulator changes the equilibrium constant."}]},{"id":"u13-q005","type":"mcq","unit":13,"part":1,"outcome":"Reversible covalent modification","bloom":"remember","difficulty":1,"source":"slides","stem":"What do protein kinases transfer, and to which residues?","options":[{"id":"a","text":"The γ-phosphoryl group of ATP, to the –OH of Ser, Thr or Tyr","correct":true,"why":"The terminal (γ) phosphate is transferred, introducing a bulky, charged group."},{"id":"b","text":"The α-phosphate of ATP, to the ε-amino group of Lys","correct":false,"why":"Kinases use the terminal γ-phosphate, and the usual targets are hydroxyl-containing residues."},{"id":"c","text":"An acetyl group from acetyl-CoA, to the amino terminus","correct":false,"why":"That is N-terminal acetylation, carried out by acetyltransferases."},{"id":"d","text":"The whole ATP molecule, to the –SH of Cys residues","correct":false,"why":"Only a phosphoryl group is transferred; ADP is released."}]},{"id":"u13-q006","type":"mcq","unit":13,"part":1,"outcome":"Reversible covalent modification","bloom":"understand","difficulty":2,"source":"slides","stem":"Why can adding a single phosphoryl group switch an enzyme's activity on or off?","options":[{"id":"a","text":"It adds a bulky group with about two negative charges that forms H-bonds or repels Asp/Glu, shifting the fold","correct":true,"why":"These new interactions alter the shape of the binding or catalytic site."},{"id":"b","text":"It cuts the polypeptide chain at the modified residue, releasing an inhibitory segment from the active site","correct":false,"why":"Phosphorylation adds a group; it does not hydrolyse the backbone."},{"id":"c","text":"It provides ATP directly to the active site, supplying the energy that the catalytic step needs to proceed","correct":false,"why":"The phosphate ester is not an energy source for catalysis."},{"id":"d","text":"It makes the protein insoluble so that it precipitates, removing it from the reaction until it is cleaned","correct":false,"why":"Phosphorylation usually increases polarity; it does not inactivate by precipitation."}]},{"id":"u13-q007","type":"mcq","unit":13,"part":1,"outcome":"Reversible covalent modification","bloom":"understand","difficulty":1,"source":"slides","stem":"What makes phosphorylation a reversible form of regulation?","options":[{"id":"a","text":"Phosphoprotein phosphatases hydrolyse the phosphate ester, restoring the residue","correct":true,"why":"Kinases and phosphatases together switch a protein between two states."},{"id":"b","text":"Proteases remove the phosphorylated segment, and the cell makes a new copy of it","correct":false,"why":"That would be irreversible proteolysis."},{"id":"c","text":"The phosphate group falls off spontaneously within seconds, without any enzyme","correct":false,"why":"Phosphate esters on proteins are stable until a phosphatase acts."},{"id":"d","text":"Kinases run backwards, taking the phosphate back to make ATP from ADP","correct":false,"why":"Protein kinase reactions are effectively irreversible; a separate enzyme removes the phosphate."}]},{"id":"u13-q008","type":"mcq","unit":13,"part":1,"outcome":"Reversible covalent modification","bloom":"remember","difficulty":2,"source":"slides","stem":"Which covalent modification marks a protein for proteolytic degradation?","options":[{"id":"a","text":"Attachment of ubiquitin","correct":true,"why":"Ubiquitin tags target proteins for destruction."},{"id":"b","text":"Attachment of SUMO","correct":false,"why":"SUMO regulates nuclear proteins (transcription, chromatin, DNA repair); it does not target them for destruction."},{"id":"c","text":"N-terminal acetylation","correct":false,"why":"About 80% of soluble eukaryotic proteins carry it; it is not a degradation signal."},{"id":"d","text":"Phosphorylation of a Tyr residue","correct":false,"why":"Phosphorylation mainly regulates activity and signalling."}]},{"id":"u13-q009","type":"mcq","unit":13,"part":1,"outcome":"Irreversible covalent modification (proteolysis)","bloom":"understand","difficulty":2,"source":"slides","stem":"Unlike phosphorylation, proteolytic activation can switch on enzymes in the gut lumen or the bloodstream. Why?","options":[{"id":"a","text":"Cleaving a peptide bond needs no ATP, so no energy source is needed outside the cell","correct":true,"why":"Hydrolysis of the zymogen is exergonic, while kinases need ATP, which is scarce outside cells."},{"id":"b","text":"Zymogens activate themselves only inside cells, before being secreted in active form","correct":false,"why":"Many zymogens, such as clotting factors and digestive enzymes, are activated extracellularly."},{"id":"c","text":"Proteolysis can be reversed by phosphatases in the blood, so it is easy to switch off","correct":false,"why":"Proteolysis is irreversible; phosphatases do not rejoin peptide bonds."},{"id":"d","text":"Extracellular fluids contain high concentrations of protein kinases and of free ATP","correct":false,"why":"This is not the reason, and kinases would still need ATP."}]},{"id":"u13-q010","type":"mcq","unit":13,"part":1,"outcome":"Irreversible covalent modification (proteolysis)","bloom":"apply","difficulty":2,"source":"general","stem":"In the duodenum, which enzyme directly activates chymotrypsinogen, proelastase and procarboxypeptidase?","options":[{"id":"a","text":"Trypsin, which is itself produced from trypsinogen by enteropeptidase","correct":true,"why":"A little enteropeptidase starts the cascade; trypsin then activates more trypsinogen and the other zymogens."},{"id":"b","text":"Pepsin, carried into the duodenum from the stomach with the chyme","correct":false,"why":"Pepsin is inactivated at duodenal pH and does not activate pancreatic zymogens."},{"id":"c","text":"Protein kinase A, which phosphorylates each zymogen to activate it","correct":false,"why":"Zymogens are activated by proteolysis, not phosphorylation."},{"id":"d","text":"Pancreatic lipase, which is secreted together with the zymogens","correct":false,"why":"Lipase hydrolyses fats, not peptide bonds."}]},{"id":"u13-q011","type":"mcq","unit":13,"part":1,"outcome":"Irreversible covalent modification (proteolysis)","bloom":"analyse","difficulty":3,"source":"general","stem":"In acute pancreatitis in dogs, trypsinogen is activated inside the pancreas. Why does this cause such severe damage?","options":[{"id":"a","text":"Trypsin activates the other zymogens, so a cascade of digestive enzymes digests the pancreas","correct":true,"why":"Zymogens and trypsin inhibitors normally protect the gland; premature trypsin activation overwhelms these defences."},{"id":"b","text":"Trypsinogen is more active than trypsin and directly destroys the pancreatic cell membranes","correct":false,"why":"Zymogens have little or no activity; the danger comes after activation."},{"id":"c","text":"Activated trypsin phosphorylates pancreatic proteins, switching on enzymes that kill the cells","correct":false,"why":"Trypsin is a protease, not a kinase."},{"id":"d","text":"Trypsin activation is reversible, so the enzymes switch on and off repeatedly inside the gland","correct":false,"why":"Proteolytic activation is irreversible."}]},{"id":"u13-q012","type":"mcq","unit":13,"part":1,"outcome":"Irreversible covalent modification (proteolysis)","bloom":"apply","difficulty":2,"source":"general","stem":"A thin German Shepherd with chronic, voluminous, fatty faeces has a very low serum trypsin-like immunoreactivity (TLI). What does this indicate?","options":[{"id":"a","text":"Exocrine pancreatic insufficiency: the pancreas makes too little trypsinogen and other zymogens","correct":true,"why":"Serum TLI largely reflects trypsinogen leaking from acinar cells; a very low value means few functioning acinar cells."},{"id":"b","text":"Excess enteropeptidase in the blood is activating and clearing the circulating trypsinogen","correct":false,"why":"Enteropeptidase works in the gut lumen; low TLI reflects reduced production."},{"id":"c","text":"Acute pancreatitis with massive trypsin release, which uses up the serum trypsinogen","correct":false,"why":"Pancreatitis typically raises, not lowers, pancreatic enzyme markers."},{"id":"d","text":"A deficiency of pancreatic phosphatases, which are needed to release trypsin into the gut","correct":false,"why":"TLI measures trypsinogen and trypsin, not phosphatases."}]},{"id":"u13-q013","type":"mcq","unit":13,"part":1,"outcome":"Irreversible covalent modification (proteolysis)","bloom":"remember","difficulty":1,"source":"slides","stem":"Which of these is activated by specific proteolytic cleavage?","options":[{"id":"a","text":"Insulin, formed from proinsulin","correct":true,"why":"Removing a peptide from proinsulin produces active insulin, an example of irreversible activation."},{"id":"b","text":"Glycogen phosphorylase b → a","correct":false,"why":"This conversion is by phosphorylation, which is reversible."},{"id":"c","text":"Protein kinase A, activated by cAMP","correct":false,"why":"cAMP binding releases the catalytic subunits; nothing is cleaved."},{"id":"d","text":"ATCase activated by ATP","correct":false,"why":"ATP is a non-covalent allosteric activator."}]},{"id":"u13-q014","type":"mcq","unit":13,"part":1,"outcome":"Enzymatic regulation mechanism","bloom":"analyse","difficulty":3,"source":"slides","stem":"During a sprint, AMP rises in muscle and adrenaline is released. How do these act together on glycogen phosphorylase?","options":[{"id":"a","text":"AMP activates it allosterically; adrenaline triggers a cascade that converts phosphorylase b to a","correct":true,"why":"The enzyme combines allosteric control and covalent modification, two layers that reinforce each other."},{"id":"b","text":"AMP phosphorylates the enzyme directly, and adrenaline cleaves it into its active form","correct":false,"why":"AMP binds non-covalently, and phosphorylase is not activated by proteolysis."},{"id":"c","text":"Both inhibit the enzyme, so that glycogen is saved for later when the sprint has finished","correct":false,"why":"Both signals mean energy is needed, so both activate glycogen breakdown."},{"id":"d","text":"AMP activates it only after adrenaline has been removed from the enzyme by a phosphatase","correct":false,"why":"The two signals act at the same time; a phosphatase reverses activation."}]},{"id":"u13-q015","type":"mcq","unit":13,"part":1,"outcome":"Protein-protein interactions","bloom":"understand","difficulty":2,"source":"general","stem":"How does cAMP activate protein kinase A (PKA)?","options":[{"id":"a","text":"cAMP binds the regulatory subunits, which then release the active catalytic subunits","correct":true,"why":"In the inactive R2C2 complex the regulatory subunits block the catalytic subunits; binding cAMP frees them."},{"id":"b","text":"cAMP is covalently attached to the catalytic site, where it acts as the phosphate donor","correct":false,"why":"cAMP binds non-covalently to the regulatory subunits."},{"id":"c","text":"cAMP cleaves the regulatory subunits off by proteolysis, freeing the catalytic subunits","correct":false,"why":"Release is by a conformational change, not proteolysis."},{"id":"d","text":"cAMP donates its phosphate to the catalytic subunits, which switches them into the active form","correct":false,"why":"PKA uses ATP as its phosphate donor; cAMP is a second messenger."}]},{"id":"u13-q016","type":"mcq","unit":13,"part":1,"outcome":"Changes in subcellular localisation","bloom":"apply","difficulty":3,"source":"general","stem":"Between meals, liver glucokinase is held in the nucleus by a regulatory protein; after a carbohydrate meal it moves into the cytosol. What is the effect?","options":[{"id":"a","text":"Glucose is phosphorylated in the cytosol only when blood glucose is high, so the liver takes it up after meals","correct":true,"why":"Moving the enzyme between compartments switches the pathway on or off without changing the enzyme itself."},{"id":"b","text":"Glucokinase is destroyed in the nucleus between meals and has to be made again after each meal","correct":false,"why":"Sequestration is reversible; the enzyme is stored, not degraded."},{"id":"c","text":"In the nucleus glucokinase phosphorylates DNA, which switches on the genes for glycogen synthesis","correct":false,"why":"It is inactive while held in the nucleus; it does not phosphorylate DNA."},{"id":"d","text":"The move to the cytosol lowers glucokinase's Km to that of hexokinase I","correct":false,"why":"Location controls access to substrate; the kinetic constants are unchanged."}]},{"id":"u13-q017","type":"mcq","unit":13,"part":1,"outcome":"Enzymatic regulation mechanism","bloom":"understand","difficulty":2,"source":"slides","stem":"Why is a pathway's end product usually a feedback inhibitor of the FIRST committed enzyme, rather than of a later one?","options":[{"id":"a","text":"It stops the whole pathway at its entry, so intermediates don't build up and energy isn't wasted","correct":true,"why":"Inhibiting a later enzyme would let upstream intermediates accumulate."},{"id":"b","text":"The first enzyme is the only one in the pathway with an active site that can bind a regulator","correct":false,"why":"Every enzyme in the pathway has an active site."},{"id":"c","text":"Later enzymes can't be regulated, because they are zymogens that are permanently switched on","correct":false,"why":"Pathway enzymes are not, in general, zymogens."},{"id":"d","text":"The end product changes the K′eq of the first reaction, which then pulls the whole pathway back","correct":false,"why":"Inhibitors change rates, not equilibrium constants."}]}],"flashcards":[{"id":"u13-f001","type":"flashcard","unit":13,"part":1,"outcome":"Enzymatic regulation mechanism","source":"slides","front":"Three main ways to regulate enzyme activity (slides)?","back":"1 Non-covalent (allosteric). 2 Reversible covalent modification. 3 Irreversible covalent modification (proteolysis). Also: partner proteins and location."},{"id":"u13-f002","type":"flashcard","unit":13,"part":1,"outcome":"Allosteric enzymes","source":"slides","front":"Kinetics of an allosteric enzyme?","back":"Sigmoidal, not Michaelis–Menten. Described by K0.5 (the [S] giving ½Vmax)."},{"id":"u13-f003","type":"flashcard","unit":13,"part":1,"outcome":"Allosteric enzymes","source":"slides","front":"Homotropic vs heterotropic modulation?","back":"Homotropic: the substrate is the modulator. Heterotropic: a different molecule is the modulator."},{"id":"u13-f004","type":"flashcard","unit":13,"part":1,"outcome":"Allosteric enzymes","source":"slides","front":"ATCase modulators?","back":"CTP is negative (feedback by the end product); ATP is positive. Both change K0.5, not Vmax."},{"id":"u13-f005","type":"flashcard","unit":13,"part":1,"outcome":"Reversible covalent modification","source":"slides","front":"Phosphorylation: enzyme, donor, target residues?","back":"Protein kinases transfer the γ-phosphate of ATP to Ser, Thr or Tyr (sometimes His). Phosphatases reverse it."},{"id":"u13-f006","type":"flashcard","unit":13,"part":1,"outcome":"Reversible covalent modification","source":"slides","front":"Ubiquitin vs SUMO?","back":"Ubiquitin: a tag for degradation. SUMO: regulates nuclear proteins (transcription, chromatin, DNA repair)."},{"id":"u13-f007","type":"flashcard","unit":13,"part":1,"outcome":"Irreversible covalent modification (proteolysis)","source":"slides","front":"Zymogen?","back":"An inactive precursor activated by specific proteolysis. Irreversible and needs no ATP, so it works outside cells."},{"id":"u13-f008","type":"flashcard","unit":13,"part":1,"outcome":"Irreversible covalent modification (proteolysis)","source":"slides","front":"Examples of proteolytic activation?","back":"Digestive zymogens, blood-clotting factors, proinsulin → insulin, procollagen → collagen, procollagenase, procaspases (apoptosis)."},{"id":"u13-f009","type":"flashcard","unit":13,"part":1,"outcome":"Irreversible covalent modification (proteolysis)","source":"general","front":"What activates trypsinogen, and what does trypsin then activate?","back":"Enteropeptidase (duodenum) activates trypsinogen. Trypsin then activates more trypsinogen, chymotrypsinogen, proelastase and procarboxypeptidase."},{"id":"u13-f010","type":"flashcard","unit":13,"part":1,"outcome":"Protein-protein interactions","source":"general","front":"How does cAMP activate PKA?","back":"cAMP binds the regulatory subunits, which release the active catalytic subunits."}]},{"unit":14,"title":"Vitamins & deficiencies","outcomes":["Fat-soluble vitamins A and D","Fat-soluble vitamins E and K","B-complex vitamins as coenzymes","Vitamin C"],"summary":{"overview":"Vitamins are essential dietary factors needed in small amounts, mainly as coenzymes or hormone precursors. Fat-soluble vitamins (A, D, E, K) are absorbed with fat and stored; water-soluble vitamins (B complex, C) are mostly not stored (B12 is the exception). Species differ a lot in what they must eat, which matters greatly in veterinary practice.","sections":[{"heading":"Vitamin A","points":["Retinoids: retinol (alcohol), retinal (aldehyde) and retinoic acid (acid). β-Carotene from plants is a provitamin, cleaved by a dioxygenase in the gut. Cats cannot do this efficiently and need preformed vitamin A.","Absorbed with fat (needs bile salts), carried in chylomicrons, stored in liver stellate cells as retinyl palmitate, and carried to tissues by retinol-binding protein.","Vision (Wald's cycle): 11-cis-retinal + opsin = rhodopsin. Light isomerises it to all-trans, activating a G protein. Deficiency causes night blindness.","Retinoic acid acts like a steroid hormone on nuclear receptors (gene expression, epithelia, reproduction). Its RXR receptor partners with the vitamin D receptor.","Deficiency in livestock: poor growth, night blindness, infections, abortion, weak calves. Excess (hypervitaminosis A): liver enlargement, skin peeling, anorexia."]},{"heading":"Vitamin D","points":["D3 (cholecalciferol) forms from 7-dehydrocholesterol in skin exposed to UV; D2 (ergocalciferol) comes from ergosterol in fungi and plants. Dogs and cats make very little in their skin, so they rely on their diet.","It is hydroxylated in the liver (25-OH) and then the kidney (1α-OH) to calcitriol, the active hormone.","Calcitriol binds a receptor that acts as a transcription factor, inducing calbindin. This increases intestinal Ca²⁺ and phosphate absorption and renal reabsorption, and supports bone mineralisation.","Deficiency causes rickets and bone disease. Excess causes hypercalcaemia and soft-tissue calcification, e.g. cholecalciferol rodenticide poisoning in dogs."]},{"heading":"Vitamins E and K","points":["Vitamin E (α-tocopherol) is the main lipid-soluble antioxidant: it breaks lipid-peroxidation chains in membranes and protects red cells.","E deficiency (often with low selenium, or poor hay) causes white muscle disease (nutritional muscular dystrophy) in calves and lambs, mulberry heart disease in pigs, and crazy chick disease.","Vitamin K: K1 from plants, K2 from gut bacteria, K3 (menadione) synthetic. It is the cofactor for γ-carboxylation of Glu in clotting factors II, VII, IX and X and in osteocalcin.","Warfarin, anticoagulant rodenticides and dicoumarol (from mouldy sweet clover) block vitamin K recycling, causing bleeding; vitamin K1 is the antidote."]},{"heading":"B-complex vitamins → coenzymes","points":["B1 thiamine → TPP: pyruvate dehydrogenase, α-ketoglutarate dehydrogenase, transketolase. Deficiency raises pyruvate and lactate (beriberi; polioencephalomalacia in ruminants).","B2 riboflavin → FMN, FAD. B3 niacin → NAD⁺, NADP⁺; niacin can be made from Trp (not efficiently in cats); deficiency causes pellagra (dermatitis, diarrhoea, dementia).","B5 pantothenic acid → coenzyme A and acyl carrier protein. B6 pyridoxine → PLP for transamination, amino acid decarboxylation, ALA synthase and glycogen phosphorylase.","B7 biotin → carboxylases (acetyl-CoA carboxylase, pyruvate carboxylase); avidin in raw egg white binds it.","B9 folate → tetrahydrofolate, a one-carbon carrier needed for thymidylate and DNA synthesis. Deficiency → megaloblastic (macrocytic) anaemia.","B12 cobalamin (contains cobalt): methylmalonyl-CoA mutase and methionine synthase. Absorption needs intrinsic factor. Deficiency causes the 'methyl-folate trap' (secondary folate deficiency), megaloblastic anaemia, raised homocysteine and demyelination. Ruminal microbes make B12 only if there is enough cobalt in the diet."]},{"heading":"Vitamin C","points":["L-Ascorbic acid is a strong reducing agent. Most animals make it from glucose; primates, guinea pigs and fruit bats cannot.","Roles: hydroxylation of Pro and Lys in collagen, iron absorption (keeps iron as Fe²⁺), reducing methaemoglobin, folate reduction, and antioxidant defence.","Deficiency causes scurvy: fragile capillaries, bleeding gums, poor coat, painful joints, anaemia. It is easily destroyed by heat and storage."]}],"keyTerms":[{"term":"Provitamin","definition":"Precursor converted into an active vitamin, e.g. β-carotene → retinal."},{"term":"Rhodopsin","definition":"Visual pigment: opsin + 11-cis-retinal."},{"term":"Calcitriol","definition":"1,25-dihydroxycholecalciferol, the active hormone form of vitamin D."},{"term":"γ-Carboxylation","definition":"Vitamin K-dependent addition of CO2 to Glu residues of clotting factors."},{"term":"TPP","definition":"Thiamine pyrophosphate, coenzyme for oxidative decarboxylation and transketolase."},{"term":"PLP","definition":"Pyridoxal phosphate (B6), coenzyme for transamination and decarboxylation."},{"term":"Intrinsic factor","definition":"Gastric protein required for vitamin B12 absorption."},{"term":"Methyl-folate trap","definition":"Folate locked as methyl-THF when B12 is lacking, causing functional folate deficiency."}],"examTips":["Fat-soluble = A, D, E, K: absorbed with fat (bile salts), stored, so toxicity is possible.","Match each B vitamin to its coenzyme: B1 TPP, B2 FAD/FMN, B3 NAD(P), B5 CoA, B6 PLP, B7 biotin, B9 THF, B12 cobalamin.","Vitamin K: clotting factors II, VII, IX, X; warfarin and rodenticides block it.","Species quirks: cats need preformed vitamin A, extra niacin and dietary vitamin D; guinea pigs need vitamin C; ruminants need cobalt to make B12."]},"questions":[{"id":"u14-q001","type":"mcq","unit":14,"part":1,"outcome":"Fat-soluble vitamins A and D","bloom":"remember","difficulty":1,"source":"slides","stem":"Which group lists only fat-soluble vitamins?","options":[{"id":"a","text":"A, D, E and K","correct":true,"why":"They are absorbed with dietary fat (needing bile salts) and can be stored, so excess intake can be toxic."},{"id":"b","text":"B1, B2, B6 and B12","correct":false,"why":"These are water-soluble B-complex vitamins."},{"id":"c","text":"A, C, D and B12","correct":false,"why":"C and B12 are water-soluble."},{"id":"d","text":"C, E, K and biotin","correct":false,"why":"C and biotin are water-soluble."}]},{"id":"u14-q002","type":"mcq","unit":14,"part":1,"outcome":"Fat-soluble vitamins A and D","bloom":"apply","difficulty":2,"source":"general","stem":"A home-made vegan diet for a cat relies on carrots as its vitamin A source. Why is this inadequate?","options":[{"id":"a","text":"Cats cannot efficiently cleave β-carotene into retinal, so they need preformed vitamin A","correct":true,"why":"β-Carotene is only a provitamin; cats lack enough of the converting dioxygenase activity."},{"id":"b","text":"Carrots contain no β-carotene; their orange colour comes from lycopene, which has no vitamin A activity","correct":false,"why":"Carrots are rich in β-carotene."},{"id":"c","text":"Vitamin A is water-soluble and is lost into the cooking water when the carrots are boiled","correct":false,"why":"Vitamin A is fat-soluble."},{"id":"d","text":"Cats make their vitamin A in their skin under sunlight, so dietary sources are not used","correct":false,"why":"Skin synthesis applies to vitamin D (and cats do even that poorly)."}]},{"id":"u14-q003","type":"mcq","unit":14,"part":1,"outcome":"Fat-soluble vitamins A and D","bloom":"understand","difficulty":2,"source":"slides","stem":"Why does vitamin A deficiency cause night blindness?","options":[{"id":"a","text":"Rods need 11-cis-retinal to regenerate rhodopsin after light isomerises it, so dark adaptation fails","correct":true,"why":"Rhodopsin = opsin + 11-cis-retinal; bright light bleaches it."},{"id":"b","text":"Retinoic acid is the light-absorbing molecule of the cone cells only, so dim-light vision is lost first","correct":false,"why":"The visual chromophore is 11-cis-retinal in rods and cones."},{"id":"c","text":"Vitamin A is needed to keep the lens transparent, and a cloudy lens blocks most of the light at night","correct":false,"why":"The defect is in pigment regeneration in the retina."},{"id":"d","text":"Vitamin A deficiency stops calcium absorption, and the retina's rods need calcium to send signals","correct":false,"why":"That is vitamin D's role."}]},{"id":"u14-q004","type":"mcq","unit":14,"part":1,"outcome":"Fat-soluble vitamins A and D","bloom":"understand","difficulty":2,"source":"slides","stem":"How does retinoic acid regulate tissue differentiation?","options":[{"id":"a","text":"Like a steroid hormone, it binds nuclear receptors that act as transcription factors","correct":true,"why":"9-cis-retinoic acid binds RXR, which also partners with the vitamin D receptor."},{"id":"b","text":"It acts as a coenzyme for transaminases, which supply the amino acids that new cells need","correct":false,"why":"That is PLP (vitamin B6)."},{"id":"c","text":"It carboxylates clotting factors and growth proteins, so they can bind calcium in tissues","correct":false,"why":"That is vitamin K."},{"id":"d","text":"It is the visual chromophore in rhodopsin, which signals cells to divide when light hits it","correct":false,"why":"The chromophore is 11-cis-retinal, not retinoic acid."}]},{"id":"u14-q005","type":"mcq","unit":14,"part":1,"outcome":"Fat-soluble vitamins A and D","bloom":"understand","difficulty":2,"source":"general","stem":"Vitamin D3 is biologically inactive until it is converted to calcitriol. Where do the two activating hydroxylations occur?","options":[{"id":"a","text":"At C-25 in the liver, then at C-1 in the kidney","correct":true,"why":"25-hydroxylation then 1α-hydroxylation give 1,25-dihydroxycholecalciferol (calcitriol)."},{"id":"b","text":"Both in the skin, driven directly by UV light","correct":false,"why":"UV makes previtamin D3 from 7-dehydrocholesterol; hydroxylation is enzymatic in liver and kidney."},{"id":"c","text":"First in the intestine, then in the bone","correct":false,"why":"These are target tissues, not activation sites."},{"id":"d","text":"In the red blood cells and the spleen","correct":false,"why":"Red cells are not involved."}]},{"id":"u14-q006","type":"mcq","unit":14,"part":1,"outcome":"Fat-soluble vitamins A and D","bloom":"understand","difficulty":2,"source":"slides","stem":"How does calcitriol increase intestinal calcium absorption?","options":[{"id":"a","text":"It binds its receptor, which acts on DNA to switch on genes such as calbindin (Ca²⁺-binding)","correct":true,"why":"Calcitriol acts like a steroid hormone, increasing transcription of Ca²⁺-transport proteins."},{"id":"b","text":"It inserts directly into the gut membrane, forming channels through which the calcium ions flow","correct":false,"why":"It acts through gene expression."},{"id":"c","text":"It is a coenzyme for calcium kinase, which phosphorylates calcium so that it can be absorbed","correct":false,"why":"There is no such coenzyme role."},{"id":"d","text":"It inhibits alkaline phosphatase in the gut wall, so less calcium is lost as calcium phosphate","correct":false,"why":"It stimulates alkaline phosphatase, aiding mineralisation."}]},{"id":"u14-q007","type":"mcq","unit":14,"part":1,"outcome":"Fat-soluble vitamins A and D","bloom":"apply","difficulty":3,"source":"general","stem":"A dog has eaten a cholecalciferol-based rodenticide. What is the main biochemical danger?","options":[{"id":"a","text":"Hypercalcaemia from excess vitamin D activity, calcifying soft tissues such as the kidneys","correct":true,"why":"Hypervitaminosis D increases Ca²⁺ absorption and mobilisation, mineralising soft tissue and causing kidney failure."},{"id":"b","text":"Bleeding, because clotting factors are no longer carboxylated, so the blood cannot clot","correct":false,"why":"That is the effect of anticoagulant (vitamin K antagonist) rodenticides."},{"id":"c","text":"Night blindness, because the rods can no longer regenerate their rhodopsin","correct":false,"why":"That is a vitamin A deficiency sign."},{"id":"d","text":"Scurvy, because the excess vitamin D blocks the hydroxylation of collagen","correct":false,"why":"Scurvy is vitamin C deficiency."}]},{"id":"u14-q008","type":"mcq","unit":14,"part":1,"outcome":"Fat-soluble vitamins E and K","bloom":"apply","difficulty":2,"source":"slides","stem":"Young lambs on poor-quality hay and selenium-deficient pasture develop stiffness, difficulty rising and pale streaks in skeletal and cardiac muscle. Which vitamin deficiency is most likely, and why does it damage muscle?","options":[{"id":"a","text":"Vitamin E: without this membrane antioxidant, lipid peroxidation damages muscle (white muscle disease)","correct":true,"why":"Vitamin E and selenium (glutathione peroxidase) together protect membranes from oxidative damage."},{"id":"b","text":"Vitamin K: without it clotting factors are inactive, so the muscles bleed internally and become pale","correct":false,"why":"Vitamin K deficiency mainly causes coagulation defects."},{"id":"c","text":"Vitamin D: without it calcium is not absorbed, so the muscles calcify and become stiff and streaked","correct":false,"why":"Calcification is a sign of vitamin D excess."},{"id":"d","text":"Vitamin B12: without it muscle cannot make methionine, so its fibres cannot build contractile proteins","correct":false,"why":"This is not the mechanism of nutritional myopathy."}]},{"id":"u14-q009","type":"mcq","unit":14,"part":1,"outcome":"Fat-soluble vitamins E and K","bloom":"understand","difficulty":2,"source":"slides","stem":"What is the biochemical role of vitamin K in blood clotting?","options":[{"id":"a","text":"It is the cofactor for γ-carboxylating Glu residues in factors II, VII, IX and X, so they bind Ca²⁺","correct":true,"why":"Without γ-carboxyglutamate, these factors cannot work."},{"id":"b","text":"It hydroxylates proline residues in fibrinogen, which lets the fibrin strands cross-link into a clot","correct":false,"why":"Prolyl hydroxylation (collagen) needs vitamin C."},{"id":"c","text":"It is the coenzyme for transamination of the clotting factors, which activates them in the plasma","correct":false,"why":"That is PLP (B6)."},{"id":"d","text":"It directly forms the fibrin clot by polymerising at the site of injury, together with platelets","correct":false,"why":"Fibrin is a protein; vitamin K modifies the clotting factors."}]},{"id":"u14-q010","type":"mcq","unit":14,"part":1,"outcome":"Fat-soluble vitamins E and K","bloom":"apply","difficulty":2,"source":"slides","stem":"A dog has prolonged clotting times and bruising after eating an anticoagulant rodenticide. What is the mechanism, and the antidote?","options":[{"id":"a","text":"It blocks vitamin K recycling (epoxide reductase), so new clotting factors aren't carboxylated; give K1","correct":true,"why":"Warfarin-type compounds are vitamin K antagonists; K1 bypasses the block."},{"id":"b","text":"It destroys the platelets directly, so the blood cannot form a plug; treat with high-dose vitamin C","correct":false,"why":"The mechanism is vitamin K antagonism, not platelet destruction."},{"id":"c","text":"It causes severe hypercalcaemia, which interferes with clotting; treat with intravenous calcium","correct":false,"why":"That describes vitamin D rodenticides."},{"id":"d","text":"It inhibits thiamine, which clotting factors need; treat with vitamin B1 injections","correct":false,"why":"Thiamine is unrelated to coagulation."}]},{"id":"u14-q011","type":"mcq","unit":14,"part":1,"outcome":"Fat-soluble vitamins E and K","bloom":"apply","difficulty":3,"source":"slides","stem":"Cattle fed mouldy sweet clover hay develop severe internal bleeding. What is the cause?","options":[{"id":"a","text":"Moulds convert coumarin in the clover to dicoumarol, a vitamin K antagonist, so factors stay inactive","correct":true,"why":"This 'sweet clover disease' led to the discovery of warfarin-type anticoagulants."},{"id":"b","text":"Sweet clover lacks vitamin E, so the walls of blood vessels are damaged by lipid peroxidation","correct":false,"why":"The problem is vitamin K antagonism."},{"id":"c","text":"Rumen bacteria stop producing vitamin C, so the collagen in the blood vessel walls is weakened","correct":false,"why":"Cattle synthesise vitamin C in their tissues; it is unrelated to bleeding here."},{"id":"d","text":"Sweet clover contains excess vitamin A, which blocks the action of the clotting factors in plasma","correct":false,"why":"Vitamin A excess doesn't cause this haemorrhagic syndrome."}]},{"id":"u14-q012","type":"mcq","unit":14,"part":1,"outcome":"B-complex vitamins as coenzymes","bloom":"analyse","difficulty":3,"source":"slides","stem":"Why does thiamine deficiency cause pyruvate and lactate to accumulate in the blood?","options":[{"id":"a","text":"Pyruvate dehydrogenase needs TPP, so pyruvat
