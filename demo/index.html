<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">

<title>Biochem Revision</title>
<style>/* ---------- Tokens ---------- */
:root {
  --bg: #fbf8f4;
  --surface: #ffffff;
  --surface-2: #f3eff8;
  --text: #2a2438;
  --muted: #6e6680;
  --border: #ebe5f2;
  --accent: #7353f0;
  --accent-deep: #5a3ccf;
  --accent-soft: #efeaff;
  --on-accent: #ffffff;
  --good: #1d8a5b;
  --good-soft: #e2f7ec;
  --bad: #c2334f;
  --bad-soft: #ffe8ed;
  --warn: #8a5b00;
  --warn-soft: #fff3d6;
  --shadow: 0 6px 22px rgb(80 56 140 / 9%);
  --shadow-sm: 0 2px 8px rgb(80 56 140 / 8%);
  --radius: 22px;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Quicksand", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tabbar-h: 68px;
  --blush: #ffb3c4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17141f;
    --surface: #211d2c;
    --surface-2: #2b2639;
    --text: #f1edf8;
    --muted: #b0a7c3;
    --border: #353047;
    --accent: #a993ff;
    --accent-deep: #8a70f5;
    --accent-soft: #312a4d;
    --on-accent: #17141f;
    --good: #6fdca5;
    --good-soft: #1b3428;
    --bad: #ff8fa5;
    --bad-soft: #3d1f28;
    --warn: #f5c76b;
    --warn-soft: #382c12;
    --shadow: 0 6px 22px rgb(0 0 0 / 30%);
    --shadow-sm: 0 2px 8px rgb(0 0 0 / 25%);
    --blush: #e07a95;
  }
}

/* Topic colours: soft background, ink for text, strong for rings and accents */
.t-mint    { --t-bg: #dcf5ea; --t-ink: #0f5a43; --t-strong: #2fb487; }
.t-lemon   { --t-bg: #fff3c2; --t-ink: #644d00; --t-strong: #e8b91f; }
.t-lilac   { --t-bg: #ece6ff; --t-ink: #46379a; --t-strong: #8c78f4; }
.t-peach   { --t-bg: #ffe5d9; --t-ink: #873a1b; --t-strong: #f2946c; }
.t-rose    { --t-bg: #ffe0e8; --t-ink: #8b2343; --t-strong: #ee6c91; }
.t-sky     { --t-bg: #dcefff; --t-ink: #154d83; --t-strong: #519fec; }
.t-apricot { --t-bg: #ffebcf; --t-ink: #7a4700; --t-strong: #f0a038; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) [class*="t-"] {
    --t-bg: color-mix(in srgb, var(--t-strong) 22%, var(--surface));
    --t-ink: color-mix(in srgb, var(--t-strong) 45%, #ffffff);
  }
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.55 var(--font);
  padding-bottom: calc(var(--tabbar-h) + 30px + env(safe-area-inset-bottom));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { line-height: 1.25; margin: 0 0 8px; letter-spacing: -0.01em; }
h1 { font-size: 1.6rem; font-weight: 800; }
h2 { font-size: 1.15rem; font-weight: 800; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 16px; top: 8px; background: var(--surface); padding: 8px 12px; border-radius: 12px; z-index: 10; }

/* ---------- Chrome ---------- */
.topbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(10px); }
.topbar-inner, main { max-width: 760px; margin: 0 auto; padding: 0 16px; }
.topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; white-space: nowrap; }
.brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 12px; background: linear-gradient(135deg, #9a82ff, #ff9ab6); color: #fff; font-weight: 900; box-shadow: var(--shadow-sm); }
.demo-pill { font-size: 0.75rem; font-weight: 700; padding: 5px 11px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); white-space: nowrap; }
main { padding-top: 12px; outline: none; }

.tabbar { position: fixed; inset: auto 12px calc(10px + env(safe-area-inset-bottom)) 12px; z-index: 5; max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 6px; background: var(--surface); border-radius: 26px; box-shadow: 0 10px 30px rgb(60 40 120 / 16%); }
.tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; height: 54px; border: 0; border-radius: 20px; background: none; color: var(--muted); font-size: 0.72rem; font-weight: 700; }
.tabbar button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.tab-ico { font-size: 1.3rem; line-height: 1; }

/* ---------- Building blocks ---------- */
.card { background: var(--surface); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
.stack > * + * { margin-top: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 4px 10px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 10px 18px; border-radius: 999px; border: 2px solid var(--border); background: var(--surface); font-weight: 800; transition: transform 0.08s ease; }
.btn:active:not(:disabled) { transform: translateY(2px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: 0 4px 0 var(--accent-deep); }
.btn.primary:active:not(:disabled) { box-shadow: 0 2px 0 var(--accent-deep); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 10px; }
.btn.soft { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; padding: 6px 14px; font-size: 0.875rem; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.topic { background: var(--t-bg); color: var(--t-ink); }

.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; background: var(--t-strong, var(--accent)); border-radius: inherit; }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 4px; gap: 4px; margin-bottom: 16px; }
.seg button { border: 0; background: none; padding: 8px 16px; border-radius: 999px; min-height: 40px; color: var(--muted); font-weight: 800; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

/* ---------- Mascot & greeting ---------- */
.mascot { flex: none; display: block; }
.mascot .bob { animation: bob 3s ease-in-out infinite; transform-origin: 50% 80%; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.greet { display: flex; gap: 14px; align-items: center; background: linear-gradient(135deg, var(--accent-soft), color-mix(in srgb, var(--blush) 30%, var(--surface))); }
.bubble { position: relative; background: var(--surface); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow-sm); font-weight: 600; }
.bubble::before { content: ""; position: absolute; left: -7px; top: 22px; border: 8px solid transparent; border-right-color: var(--surface); border-left: 0; }
.empty { text-align: center; padding: 26px 18px; }
.empty .mascot { margin: 0 auto 10px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 6px; }
.stat { background: var(--surface); border-radius: 18px; padding: 12px 8px; text-align: center; box-shadow: var(--shadow-sm); }
.stat b { display: block; font-size: 1.35rem; font-weight: 900; }
.stat span { font-size: 0.75rem; color: var(--muted); font-weight: 600; }

/* ---------- Topic tiles ---------- */
.topic-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.topic-tile { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; min-height: 150px; padding: 14px; border: 0; border-radius: var(--radius); background: var(--t-bg); color: var(--t-ink); box-shadow: var(--shadow-sm); transition: transform 0.12s ease; }
.topic-tile:hover:not(.locked) { transform: translateY(-2px); }
.topic-tile.locked { opacity: 0.72; cursor: default; }
.topic-emoji { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 16px; background: color-mix(in srgb, var(--surface) 75%, transparent); font-size: 1.5rem; }
.topic-tile .t-title { font-weight: 800; line-height: 1.25; }
.topic-tile .t-units { font-size: 0.78rem; font-weight: 700; opacity: 0.8; }
.topic-tile .ring { position: absolute; top: 12px; right: 12px; }
.ring-label { font-size: 9px; font-weight: 900; fill: currentColor; }

/* ---------- Topic page ---------- */
.banner { background: var(--t-bg); color: var(--t-ink); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; display: flex; gap: 14px; align-items: center; }
.banner .topic-emoji { width: 58px; height: 58px; font-size: 2rem; border-radius: 20px; }
.banner h1 { margin: 0 0 4px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
.unit-head { display: flex; align-items: center; gap: 10px; margin: 8px 4px 12px; }
.unit-badge { display: grid; place-items: center; min-width: 34px; height: 34px; padding: 0 8px; border-radius: 12px; background: var(--t-bg); color: var(--t-ink); font-weight: 900; font-size: 0.85rem; }
.overview { background: var(--t-bg); color: var(--t-ink); border-radius: 18px; padding: 14px 16px; font-weight: 600; margin-bottom: 12px; }
.points { list-style: none; margin: 0; padding: 0; }
.points li { position: relative; padding-left: 22px; margin: 8px 0; }
.points li::before { content: ""; position: absolute; left: 4px; top: 0.6em; width: 8px; height: 8px; border-radius: 50%; background: var(--t-strong, var(--accent)); }
.terms { display: grid; gap: 8px; }
.term { border-radius: 14px; background: var(--surface-2); padding: 0; }
.term > summary { list-style: none; cursor: pointer; padding: 10px 14px; font-weight: 800; display: flex; justify-content: space-between; gap: 8px; }
.term > summary::-webkit-details-marker { display: none; }
.term > summary::after { content: "+"; color: var(--accent); font-weight: 900; }
.term[open] > summary::after { content: "–"; }
.term > p { margin: 0; padding: 0 14px 12px; color: var(--muted); }
.tips { background: var(--warn-soft); border-radius: 18px; padding: 14px 16px; }
.tips h3 { color: var(--warn); }
.tips ul { margin: 0; padding-left: 20px; }
.tips li + li { margin-top: 6px; }
.locked-unit { display: flex; align-items: center; gap: 12px; color: var(--muted); }

/* ---------- Lists ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.list-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1.5px dashed var(--border); }
.list-row:first-child { border-top: 0; }

/* ---------- Questions ---------- */
.q-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.q-stem { font-size: 1.08rem; font-weight: 800; margin-bottom: 16px; }
.options { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.option { width: 100%; text-align: left; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; padding: 13px 14px; border-radius: 18px; border: 2px solid var(--border); background: var(--surface); min-height: 52px; font-weight: 600; transition: transform 0.08s ease, border-color 0.12s; }
.option .key { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); font-weight: 900; font-size: 0.82rem; }
.option:not(:disabled):hover { border-color: var(--accent); }
.option:not(:disabled):active { transform: scale(0.99); }
.option.selected { border-color: var(--accent); background: var(--accent-soft); }
.option.selected .key { background: var(--accent); color: var(--on-accent); }
.option.correct { border-color: var(--good); background: var(--good-soft); }
.option.correct .key { background: var(--good); color: var(--surface); }
.option.wrong { border-color: var(--bad); background: var(--bad-soft); }
.option.wrong .key { background: var(--bad); color: var(--surface); }
.option:disabled { cursor: default; }
.why { margin-top: 6px; font-size: 0.9rem; font-weight: 500; color: var(--muted); }
.feedback { border-radius: 18px; padding: 12px 16px; margin-top: 14px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.feedback.good { background: var(--good-soft); color: var(--good); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.feedback .fb-emoji { font-size: 1.5rem; }
.pop { animation: pop 0.35s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.wiggle { animation: wiggle 0.35s ease; }
@keyframes wiggle { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

.progress-line { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-bottom: 16px; }
.progress-line > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #ff9ab6); border-radius: inherit; transition: width 0.3s ease; }

.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 8px; }
.qgrid button { min-height: 40px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); font-weight: 800; font-size: 0.85rem; }
.qgrid button.answered { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.qgrid button[aria-current="true"] { outline: 3px solid var(--accent); outline-offset: 1px; }
.timer { font-variant-numeric: tabular-nums; font-weight: 900; background: var(--surface); padding: 4px 12px; border-radius: 999px; box-shadow: var(--shadow-sm); }
.timer.low { color: var(--bad); }
.big-score { font-size: 3rem; font-weight: 900; line-height: 1; }

/* ---------- Flashcards ---------- */
.flashcard { min-height: 240px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; font-size: 1.15rem; font-weight: 700; cursor: pointer; width: 100%; border: 0; background: var(--t-bg, var(--surface)); color: var(--t-ink, var(--text)); }
.flashcard.back { background: var(--surface); color: var(--text); border: 3px solid var(--t-strong, var(--accent)); }
.flashcard .side { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.75; margin-bottom: 12px; font-weight: 900; }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rate .btn { flex-direction: column; gap: 0; padding: 8px; }
.rate .btn span { font-size: 0.72rem; font-weight: 700; opacity: 0.8; }

/* ---------- Explore ---------- */
.input { width: 100%; min-height: 48px; padding: 10px 16px; border-radius: 999px; border: 2px solid var(--border); background: var(--surface); font-weight: 700; }
.input:focus { border-color: var(--accent); outline: none; }
.steps { margin: 8px 0 0; padding-left: 20px; }
.steps li + li { margin-top: 4px; }
.pathway { list-style: none; margin: 0; padding: 0; }
.metabolite { padding: 10px 12px; border-radius: 14px; background: var(--surface-2); font-weight: 800; text-align: center; }
.step-btn { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 8px 4px; margin: 4px 0; }
.step-btn .arrow { text-align: center; font-size: 1.2rem; color: var(--muted); }
.step-btn .enz { font-weight: 800; color: var(--accent); }
.step-detail { margin: 0 0 8px 34px; padding: 12px 14px; border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 16px 16px 0; font-size: 0.92rem; }
.phase-head { margin: 16px 0 8px; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 900; }
details.card > summary { cursor: pointer; font-weight: 800; }
details.card > summary + p { margin-top: 10px; }

.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 34px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 0.9rem; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity 0.2s; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }

@media (min-width: 640px) {
  .topic-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<script id="data" type="application/json">{"syllabus":{"part":1,"title":"Part 1 · The chemistry of living beings","topics":[{"id":"chemistry-of-life","title":"Chemistry of life","emoji":"🧪","color":"mint","units":[{"unit":1,"title":"Chemistry of living beings & water"},{"unit":2,"title":"Organic compounds & functional groups"},{"unit":3,"title":"Chemical equilibrium, pH & buffers"}]},{"id":"energy-redox","title":"Energy & redox","emoji":"⚡","color":"lemon","units":[{"unit":4,"title":"Thermodynamics & ATP"},{"unit":5,"title":"Redox reactions"}]},{"id":"protein-structure","title":"Amino acids & protein structure","emoji":"🔗","color":"lilac","units":[{"unit":6,"title":"Amino acids"},{"unit":7,"title":"Peptide bond & primary structure"},{"unit":8,"title":"3D structure of proteins"}]},{"id":"fibrous-proteins","title":"Fibrous proteins","emoji":"🧶","color":"peach","units":[{"unit":9,"title":"Keratin, fibroin & collagen"}]},{"id":"oxygen-binding","title":"Oxygen-binding proteins","emoji":"🩸","color":"rose","units":[{"unit":10,"title":"Myoglobin & haemoglobin"}]},{"id":"enzymes","title":"Enzymes","emoji":"⚙️","color":"sky","units":[{"unit":11,"title":"Enzyme properties & catalysis"},{"unit":12,"title":"Enzyme kinetics & inhibition"},{"unit":13,"title":"Regulation of enzyme activity"}]},{"id":"vitamins","title":"Vitamins","emoji":"🍊","color":"apricot","units":[{"unit":14,"title":"Vitamins & deficiencies"}]}]},"units":[{"unit":1,"title":"Chemistry of living beings & water","outcomes":["Carbon bonds and oxidation state","Isomerism and stereochemistry","Properties of water and hydrogen bonds","Non-covalent interactions and the hydrophobic effect"],"summary":{"overview":"Life is chemistry in water. Carbon builds the molecular skeletons; the 3D shape of those molecules (stereochemistry) decides how they interact; and water, through hydrogen bonds and the hydrophobic effect, shapes every protein, membrane and nucleic acid.","sections":[{"heading":"Carbon and oxidation state","points":["Of about 30 essential elements, C, H, O, N, P and S dominate; metal ions (K⁺, Na⁺, Ca²⁺, Mg²⁺, Zn²⁺, Fe²⁺) have key roles in metabolism.","Carbon forms four stable covalent bonds (single, double or triple) with C, H, O and N, giving chains, rings and branched 3D structures.","Oxidation state of carbon: CH4 (most reduced) → alcohol → aldehyde/ketone → carboxylic acid → CO2 (most oxidised).","The more reduced the carbon, the more energy it releases when fully oxidised, which is why fats yield more energy per gram than sugars."]},{"heading":"Isomerism and stereochemistry","points":["Stereoisomers have the same bonds but a different 3D arrangement.","Geometric (cis/trans) isomers differ in physical and chemical properties, e.g. fumarate (trans) vs maleate (cis).","A chiral carbon carries four different substituents; n chiral centres give up to 2ⁿ stereoisomers.","Enantiomers are mirror images: they have identical physical properties except the direction they rotate plane-polarised light, and they react identically with achiral reagents.","Diastereomers are non-mirror-image stereoisomers with different physical and chemical properties.","Binding sites in biomolecules are chiral, so binding is stereospecific: two enantiomers of a drug can act very differently."]},{"heading":"Water and hydrogen bonds","points":["Organisms are 70–90% water; most biochemical reactions occur in water.","O is sp³ hybridised (distorted tetrahedron) and more electronegative than H, so water is a dipole that can donate and accept H-bonds.","Each water molecule can form up to four H-bonds, explaining water's high boiling point, melting point and surface tension.","H-bonds (≈ 20 kJ/mol) are much weaker than covalent O–H bonds (≈ 420 kJ/mol) and strongest when the three atoms are in a line.","Ice has the maximum number of H-bonds in an open hexagonal lattice, so it is less dense than liquid water and floats.","Water dissolves charged and polar solutes (salts, amino acids, sugars) but not non-polar ones (lipid chains, aromatic rings, gases)."]},{"heading":"Non-covalent interactions and the hydrophobic effect","points":["Ionic (Coulombic) interactions occur between charges; dipole interactions between polar groups.","Van der Waals interactions occur between all atoms: London dispersion attraction at 0.4–0.7 nm and steric repulsion at very short distance. They are weak individually but give steric complementarity and DNA base stacking.","The hydrophobic effect is not an attraction between non-polar groups: water forms ordered, low-entropy shells around them.","When non-polar groups cluster (protein cores, micelles, membranes, steroid binding), ordered water is released and entropy increases."]}],"keyTerms":[{"term":"Chiral centre","definition":"Carbon atom bonded to four different groups."},{"term":"Enantiomers","definition":"Non-superimposable mirror-image stereoisomers."},{"term":"Diastereomers","definition":"Stereoisomers that are not mirror images, including cis/trans isomers."},{"term":"Hydrogen bond","definition":"Attraction between an H on an electronegative atom and a lone pair on another electronegative atom."},{"term":"Van der Waals interaction","definition":"Weak attraction (dispersion) and repulsion (steric) between any two nearby atoms."},{"term":"Hydrophobic effect","definition":"Clustering of non-polar groups in water, driven by the increase in entropy of the released water."},{"term":"Amphipathic","definition":"Having both polar and non-polar regions, e.g. membrane lipids."}],"examTips":["The hydrophobic effect is driven by the ENTROPY of water, not by an attraction between non-polar molecules.","Enantiomers differ only in optical rotation and in interactions with OTHER chiral molecules, such as enzymes and receptors.","Cis/trans isomers are diastereomers, not enantiomers.","More reduced carbon (more C–H bonds) means more energy released on oxidation."]},"questions":[{"id":"u1-q001","type":"mcq","unit":1,"part":1,"outcome":"Carbon bonds and oxidation state","bloom":"understand","difficulty":1,"source":"slides","stem":"Why is carbon able to form the backbone of so many different biomolecules?","options":[{"id":"a","text":"It forms four stable covalent bonds (single, double or triple) with C, H, O and N, giving chains and rings","correct":true,"why":"Its four strong bonds in a tetrahedral arrangement allow huge structural diversity."},{"id":"b","text":"It forms mainly ionic bonds, which break and re-form easily, so atoms can be rearranged into new molecules","correct":false,"why":"Carbon forms covalent bonds, not ionic ones."},{"id":"c","text":"It is the most electronegative element in biology, so it pulls electrons from the atoms it bonds to","correct":false,"why":"Oxygen and nitrogen are more electronegative than carbon."},{"id":"d","text":"It is the most abundant atom in water and body fluids, so it is readily available to cells for building","correct":false,"why":"Water contains no carbon."}]},{"id":"u1-q002","type":"mcq","unit":1,"part":1,"outcome":"Carbon bonds and oxidation state","bloom":"analyse","difficulty":2,"source":"general","stem":"In which molecule is the carbon atom most oxidised?","options":[{"id":"a","text":"Carbon dioxide (CO2)","correct":true,"why":"In CO2 carbon has given up the most electron density to oxygen; it is the fully oxidised end product of metabolism."},{"id":"b","text":"Methane (CH4)","correct":false,"why":"Methane carbon is the most reduced: it is bonded only to hydrogen."},{"id":"c","text":"Ethanol (CH3–CH2–OH)","correct":false,"why":"An alcohol carbon is only slightly oxidised."},{"id":"d","text":"Acetaldehyde (CH3–CHO)","correct":false,"why":"An aldehyde carbon is intermediate; it can still be oxidised to a carboxylic acid and then to CO2."}]},{"id":"u1-q003","type":"mcq","unit":1,"part":1,"outcome":"Carbon bonds and oxidation state","bloom":"apply","difficulty":2,"source":"general","stem":"Why does a gram of body fat store about twice as much energy as a gram of glycogen?","options":[{"id":"a","text":"Fatty-acid carbons are more reduced (mostly –CH2–), so their oxidation passes more electrons to O2","correct":true,"why":"Sugar carbons already carry –OH groups (partly oxidised); fat chains have far more C–H bonds to oxidise."},{"id":"b","text":"Fats contain more oxygen atoms per carbon than sugars, so more oxygen is available to burn each carbon","correct":false,"why":"The reverse is true: sugars are oxygen-rich, fats are oxygen-poor."},{"id":"c","text":"Fat is stored together with more water than glycogen, and that water adds to the energy released","correct":false,"why":"The reverse: glycogen is stored with lots of water, fat with almost none. That makes fat an even better store, but it isn't why fat's fuel yields more energy."},{"id":"d","text":"Fatty acids contain high-energy phosphate bonds that release extra free energy when they are hydrolysed","correct":false,"why":"Fatty acids contain no phosphoanhydride bonds."}]},{"id":"u1-q004","type":"mcq","unit":1,"part":1,"outcome":"Isomerism and stereochemistry","bloom":"understand","difficulty":2,"source":"slides","stem":"Which property differs between the two enantiomers of a chiral compound?","options":[{"id":"a","text":"The direction in which they rotate plane-polarised light","correct":true,"why":"Enantiomers have identical physical properties except their interaction with polarised light (and with other chiral molecules)."},{"id":"b","text":"Their melting point and boiling point when pure","correct":false,"why":"Enantiomers have identical melting points."},{"id":"c","text":"Their solubility in water and in organic solvents","correct":false,"why":"Water is achiral, so both enantiomers dissolve equally."},{"id":"d","text":"Their rate of reaction with an achiral reagent such as water","correct":false,"why":"Enantiomers react identically with achiral reagents."}]},{"id":"u1-q005","type":"mcq","unit":1,"part":1,"outcome":"Isomerism and stereochemistry","bloom":"understand","difficulty":2,"source":"slides","stem":"Fumarate (trans) is an intermediate of the citric acid cycle, whereas maleate (cis) is not used by the cycle. How are these two molecules related?","options":[{"id":"a","text":"Geometric (cis/trans) isomers: diastereomers with different physical and chemical properties","correct":true,"why":"Rotation about the C=C double bond is blocked, so cis and trans forms are distinct compounds, and enzymes distinguish them."},{"id":"b","text":"Enantiomers: non-superimposable mirror images with identical physical properties in water","correct":false,"why":"Cis/trans isomers are not mirror images."},{"id":"c","text":"The same molecule drawn in two ways, which interconvert freely by rotation about the C=C bond","correct":false,"why":"The double bond prevents interconversion, so they are different molecules."},{"id":"d","text":"Constitutional isomers: same formula, but the atoms are joined in a different order","correct":false,"why":"They have the same bonds; only the spatial arrangement differs."}]},{"id":"u1-q006","type":"mcq","unit":1,"part":1,"outcome":"Isomerism and stereochemistry","bloom":"apply","difficulty":2,"source":"general","stem":"A molecule has two different chiral centres. What is the maximum number of stereoisomers it can have?","options":[{"id":"a","text":"4","correct":true,"why":"Each chiral centre has two configurations, so the maximum is 2ⁿ = 2² = 4."},{"id":"b","text":"2","correct":false,"why":"Two stereoisomers arise from one chiral centre."},{"id":"c","text":"8","correct":false,"why":"Eight would require three chiral centres."},{"id":"d","text":"16","correct":false,"why":"Sixteen would require four chiral centres."}]},{"id":"u1-q007","type":"mcq","unit":1,"part":1,"outcome":"Isomerism and stereochemistry","bloom":"analyse","difficulty":3,"source":"slides","stem":"Why can the two enantiomers of a drug have very different effects in an animal, even though they have the same physical properties?","options":[{"id":"a","text":"Receptors and enzymes are chiral, so their binding sites fit one enantiomer much better","correct":true,"why":"Chiral binding pockets distinguish mirror images, like a right glove fitting a right hand."},{"id":"b","text":"One enantiomer is usually much more soluble in blood, so it reaches the tissues at a much higher concentration","correct":false,"why":"Enantiomers have identical solubility in achiral solvents such as water."},{"id":"c","text":"One enantiomer carries an extra functional group that the other lacks, which changes its action","correct":false,"why":"Enantiomers contain exactly the same groups."},{"id":"d","text":"The liver converts most drugs into its cis isomer, and only one enantiomer can be converted","correct":false,"why":"Cis/trans isomerism is unrelated to the effects of enantiomers."}]},{"id":"u1-q008","type":"mcq","unit":1,"part":1,"outcome":"Properties of water and hydrogen bonds","bloom":"understand","difficulty":1,"source":"slides","stem":"Why can one water molecule take part in up to four hydrogen bonds?","options":[{"id":"a","text":"It has two H atoms to donate and two lone pairs on oxygen to accept","correct":true,"why":"Water is both an H-bond donor and acceptor, arranged roughly tetrahedrally."},{"id":"b","text":"Oxygen forms four covalent bonds, two with its own H atoms and two with neighbouring water molecules","correct":false,"why":"Oxygen makes only two covalent bonds; H-bonds are non-covalent."},{"id":"c","text":"Water molecules are non-polar and attract each other by dispersion","correct":false,"why":"Water is strongly polar; its dipole drives the H-bonding."},{"id":"d","text":"Each hydrogen atom can accept two lone pairs from neighbouring oxygens, giving four bonds in all","correct":false,"why":"Each H donates once; the lone pairs on O are the acceptors."}]},{"id":"u1-q009","type":"mcq","unit":1,"part":1,"outcome":"Properties of water and hydrogen bonds","bloom":"understand","difficulty":2,"source":"slides","stem":"Why does ice float on liquid water?","options":[{"id":"a","text":"In ice each molecule is H-bonded in an open hexagonal lattice, so molecules are further apart than in liquid","correct":true,"why":"The ordered lattice is less dense, so ponds freeze from the top and life survives underneath."},{"id":"b","text":"Ice contains fewer hydrogen bonds than liquid water, so its molecules are held less tightly and spread out","correct":false,"why":"Ice has the maximum number of H-bonds per molecule."},{"id":"c","text":"Freezing breaks the covalent O–H bonds, and the free H and O atoms take up more space than whole molecules","correct":false,"why":"Covalent bonds are unchanged by freezing."},{"id":"d","text":"Ice traps tiny air bubbles as it forms, and this trapped air makes it lighter than the liquid","correct":false,"why":"Even pure, bubble-free ice is less dense than liquid water."}]},{"id":"u1-q010","type":"mcq","unit":1,"part":1,"outcome":"Properties of water and hydrogen bonds","bloom":"remember","difficulty":1,"source":"slides","stem":"Which statement about hydrogen bonds is correct?","options":[{"id":"a","text":"They are strongest when the donor, the hydrogen and the acceptor lie in a straight line","correct":true,"why":"Linear geometry gives the best overlap of the dipole interaction."},{"id":"b","text":"They are about as strong as a covalent O–H bond, which is why water has such a high boiling point","correct":false,"why":"≈ 20 kJ/mol vs ≈ 420 kJ/mol: about 20 times weaker."},{"id":"c","text":"They form only between carbon and hydrogen atoms, as in the C–H groups of fatty-acid tails","correct":false,"why":"H-bonds involve electronegative atoms, usually N and O."},{"id":"d","text":"They are irreversible once formed, so the hydrogen bonds in liquid water are permanent","correct":false,"why":"They constantly form and break at body temperature."}]},{"id":"u1-q011","type":"mcq","unit":1,"part":1,"outcome":"Properties of water and hydrogen bonds","bloom":"understand","difficulty":2,"source":"slides","stem":"Why does NaCl dissolve readily in water but not in hexane?","options":[{"id":"a","text":"Water dipoles surround (hydrate) Na⁺ and Cl⁻, weakening the ionic attraction; hexane cannot","correct":true,"why":"Hydration shells compensate for breaking the ionic lattice; a non-polar solvent cannot do this."},{"id":"b","text":"Water forms covalent bonds with Na⁺, pulling it out of the crystal; hexane forms no bonds at all","correct":false,"why":"Ion–dipole interactions are non-covalent."},{"id":"c","text":"Hexane is too acidic: its protons neutralise the Cl⁻ ions and so the crystal cannot break apart","correct":false,"why":"Hexane is a non-polar hydrocarbon, not an acid."},{"id":"d","text":"NaCl is non-polar, so it dissolves in polar water only once its crystal has been heated","correct":false,"why":"NaCl is ionic, the opposite of non-polar."}]},{"id":"u1-q012","type":"mcq","unit":1,"part":1,"outcome":"Non-covalent interactions and the hydrophobic effect","bloom":"understand","difficulty":2,"source":"slides","stem":"Which statement about van der Waals interactions is correct?","options":[{"id":"a","text":"They are weak individually, but many together give steric complementarity and DNA base stacking","correct":true,"why":"Attraction dominates at 0.4–0.7 nm, repulsion at very short distance; the sum of many contacts is significant."},{"id":"b","text":"They occur only between oppositely charged ions, which is why they hold salt crystals together","correct":false,"why":"Those are ionic (Coulombic) interactions."},{"id":"c","text":"They are stronger than covalent bonds, which is why they hold the atoms of a molecule together","correct":false,"why":"They are among the weakest interactions in biology."},{"id":"d","text":"They are purely repulsive, so they only stop atoms coming too close and do not attract them","correct":false,"why":"They have an attractive (dispersion) component and a repulsive (steric) component."}]},{"id":"u1-q013","type":"mcq","unit":1,"part":1,"outcome":"Non-covalent interactions and the hydrophobic effect","bloom":"analyse","difficulty":3,"source":"slides","stem":"What is the main driving force for amphipathic lipids to form micelles in water?","options":[{"id":"a","text":"The entropy of water rises: ordered water around the tails is released when the tails cluster","correct":true,"why":"The hydrophobic effect is entropic: fewer water molecules are ordered once tails are hidden."},{"id":"b","text":"Strong direct attraction between the non-polar tails, which pulls them together into the core","correct":false,"why":"Dispersion between tails is weak; there is no special hydrophobic 'force'."},{"id":"c","text":"Covalent bonds that form between the lipid tails, locking them into the centre of the micelle","correct":false,"why":"Micelles are held together non-covalently."},{"id":"d","text":"Hydrogen bonds between the non-polar tails, which hold the hydrocarbon chains side by side","correct":false,"why":"Hydrocarbon tails cannot form hydrogen bonds."}]},{"id":"u1-q014","type":"mcq","unit":1,"part":1,"outcome":"Non-covalent interactions and the hydrophobic effect","bloom":"apply","difficulty":2,"source":"slides","stem":"A steroid hormone binds a hydrophobic pocket in its receptor. Why is this binding thermodynamically favourable?","options":[{"id":"a","text":"The steroid displaces ordered water from the pocket and from around itself, raising entropy","correct":true,"why":"This is the hydrophobic effect at work in ligand binding, and drug designers exploit it."},{"id":"b","text":"The steroid forms many ionic bonds with charged groups lining the pocket, releasing a lot of heat","correct":false,"why":"Steroids are largely non-polar and uncharged."},{"id":"c","text":"Water molecules become covalently attached to the steroid, anchoring it firmly inside the pocket","correct":false,"why":"Water is released, not attached."},{"id":"d","text":"The pocket is filled with ice-like water that attracts the steroid and holds it in place","correct":false,"why":"Ordered water is unfavourable and is pushed out by the ligand."}]},{"id":"u1-q015","type":"mcq","unit":1,"part":1,"outcome":"Non-covalent interactions and the hydrophobic effect","bloom":"apply","difficulty":1,"source":"slides","stem":"Inside a folded protein, a positively charged Lys side chain sits next to a negatively charged Glu side chain. Which interaction holds them together?","options":[{"id":"a","text":"An ionic (Coulombic) interaction, also called a salt bridge","correct":true,"why":"Electrostatic attraction between permanent opposite charges."},{"id":"b","text":"A van der Waals interaction only, since the charges cancel out","correct":false,"why":"Van der Waals contacts exist, but the dominant interaction is between the charges."},{"id":"c","text":"A covalent peptide bond between the two side chains","correct":false,"why":"Side chains are not joined by peptide bonds."},{"id":"d","text":"The hydrophobic effect, as both side chains avoid water","correct":false,"why":"Charged side chains are hydrophilic."}]}],"flashcards":[{"id":"u1-f001","type":"flashcard","unit":1,"part":1,"outcome":"Carbon bonds and oxidation state","source":"slides","front":"Six most common elements in biomolecules?","back":"C, H, O, N, P, S, plus essential metal ions (K⁺, Na⁺, Ca²⁺, Mg²⁺, Zn²⁺, Fe²⁺)."},{"id":"u1-f002","type":"flashcard","unit":1,"part":1,"outcome":"Carbon bonds and oxidation state","source":"general","front":"Order of carbon oxidation, least to most?","back":"Alkane (CH4) → alcohol → aldehyde/ketone → carboxylic acid → CO2."},{"id":"u1-f003","type":"flashcard","unit":1,"part":1,"outcome":"Isomerism and stereochemistry","source":"slides","front":"Enantiomers vs diastereomers?","back":"Enantiomers: mirror images, identical physical properties except optical rotation. Diastereomers: not mirror images, different properties (includes cis/trans)."},{"id":"u1-f004","type":"flashcard","unit":1,"part":1,"outcome":"Isomerism and stereochemistry","source":"general","front":"Chiral centre? Maximum stereoisomers for n centres?","back":"A carbon with four different substituents. Up to 2ⁿ stereoisomers."},{"id":"u1-f005","type":"flashcard","unit":1,"part":1,"outcome":"Properties of water and hydrogen bonds","source":"slides","front":"Why is water polar?","back":"Electronegative O, bent (distorted tetrahedral, sp³) shape, so it is a net dipole: both H-bond donor and acceptor."},{"id":"u1-f006","type":"flashcard","unit":1,"part":1,"outcome":"Properties of water and hydrogen bonds","source":"slides","front":"H-bond vs covalent O–H bond energy?","back":"≈ 20 kJ/mol vs ≈ 420 kJ/mol. H-bonds are strongest when linear."},{"id":"u1-f007","type":"flashcard","unit":1,"part":1,"outcome":"Properties of water and hydrogen bonds","source":"slides","front":"Why does ice float?","back":"Maximal H-bonding in an open hexagonal lattice, so it is less dense than liquid water."},{"id":"u1-f008","type":"flashcard","unit":1,"part":1,"outcome":"Non-covalent interactions and the hydrophobic effect","source":"slides","front":"Four types of non-covalent interaction?","back":"Ionic (Coulombic), dipole (incl. H-bonds), van der Waals, and the hydrophobic effect."},{"id":"u1-f009","type":"flashcard","unit":1,"part":1,"outcome":"Non-covalent interactions and the hydrophobic effect","source":"slides","front":"What drives the hydrophobic effect?","back":"The entropy gain of water released from ordered shells when non-polar groups cluster. It is not a direct attraction."},{"id":"u1-f010","type":"flashcard","unit":1,"part":1,"outcome":"Non-covalent interactions and the hydrophobic effect","source":"slides","front":"Where does the hydrophobic effect matter?","back":"Protein folding, protein–protein association, micelles and membranes, binding of steroid hormones and many drugs."}]},{"unit":2,"title":"Organic compounds & functional groups","outcomes":["Hydrocarbons, alcohols, ethers and phenols","Carbonyl compounds: aldehydes and ketones","Carboxylic acids and their derivatives","Nitrogen compounds and heterocycles"],"summary":{"overview":"Biomolecules are built from a small set of functional groups. Knowing how each group behaves (polar or not, acidic or basic, electrophilic, energy-rich) lets you predict what sugars, lipids, amino acids, nucleotides and coenzymes will do.","sections":[{"heading":"Hydrocarbons, alcohols, ethers and phenols","points":["Aliphatic hydrocarbons (chains) and aromatic rings are non-polar: they form lipid tails and hydrophobic side chains.","Alcohols (R–OH) are polar H-bond donors and acceptors; sugars carry many hydroxyl groups.","Phenols have –OH on an aromatic ring and are more acidic than alcohols because the phenoxide ion is resonance-stabilised (e.g. the Tyr side chain).","Ethers (R–O–R′) are relatively unreactive; epoxides are strained three-membered rings and are very reactive."]},{"heading":"Aldehydes and ketones","points":["Both contain a carbonyl group (C=O). Aldehydes have it at the end of a chain (–CHO); ketones have it between two carbons.","The carbonyl carbon is electrophilic (δ⁺), so nucleophiles such as alcohols add to it. This is how sugars form hemiacetal and hemiketal rings.","Aldehydes are oxidised to carboxylic acids or reduced to primary alcohols; ketones are reduced to secondary alcohols.","Aldoses (e.g. glucose) carry an aldehyde group; ketoses (e.g. fructose) carry a ketone group."]},{"heading":"Carboxylic acids and their derivatives","points":["Carboxylic acids (–COOH) have pKa ≈ 2–5, so at physiological pH they exist as carboxylate anions (–COO⁻).","Esters form when an acid condenses with an alcohol (losing water); triacylglycerols are glycerol esters, hydrolysed by lipases.","Thioesters (e.g. acetyl-CoA) are less resonance-stabilised than oxygen esters, so they are excellent acyl-group donors.","Amides are the most stable derivatives; the peptide bond is an amide.","Acid anhydrides and acyl chlorides are very reactive. Phosphoanhydride bonds in ATP and the acyl phosphate of 1,3-bisphosphoglycerate are biological high-energy anhydrides."]},{"heading":"Nitrogen compounds and heterocycles","points":["Amines (primary, secondary, tertiary) are basic and are protonated (–NH3⁺) at physiological pH. Proline contains a secondary amine.","Amides are not basic: the nitrogen lone pair is delocalised onto the carbonyl, which also makes the peptide bond planar.","Nitriles (–C≡N): cyanogenic glycosides in some plants release HCN when the plant is damaged.","Heterocycles contain N, O or S in a ring: purines and pyrimidines (nucleic-acid bases), imidazole (His), indole (Trp), thiazole (thiamine), and pyranose and furanose rings (sugars)."]}],"keyTerms":[{"term":"Hydroxyl group","definition":"–OH; makes molecules polar (alcohols, phenols, sugars)."},{"term":"Carbonyl group","definition":"C=O, found in aldehydes, ketones, acids and their derivatives."},{"term":"Carboxylate","definition":"–COO⁻, the deprotonated form of a carboxylic acid at physiological pH."},{"term":"Ester","definition":"R–CO–O–R′, formed from an acid and an alcohol."},{"term":"Thioester","definition":"R–CO–S–R′, an energy-rich acyl carrier, e.g. acetyl-CoA."},{"term":"Amide","definition":"R–CO–NR′2; the peptide bond is an amide."},{"term":"Phosphoanhydride","definition":"Bond between two phosphate groups, as in ATP."},{"term":"Heterocycle","definition":"Ring containing at least one atom other than carbon (N, O, S)."}],"examTips":["Amines are basic; amides are NOT, because the lone pair is delocalised.","At pH 7.4, carboxylic acids are carboxylates (–COO⁻) and amines are –NH3⁺.","Aldehyde → (oxidation) carboxylic acid; aldehyde → (reduction) primary alcohol.","Imidazole = His, indole = Trp; adenine and guanine are purines, while C, T and U are pyrimidines."]},"questions":[{"id":"u2-q001","type":"mcq","unit":2,"part":1,"outcome":"Hydrocarbons, alcohols, ethers and phenols","bloom":"remember","difficulty":1,"source":"slides","stem":"Glucose carries several –OH groups attached to sp³ carbons. What are these groups called?","options":[{"id":"a","text":"Hydroxyl groups (alcohol groups)","correct":true,"why":"R–OH on a saturated carbon is an alcohol; these make sugars very water-soluble."},{"id":"b","text":"Carboxyl groups (acid groups)","correct":false,"why":"Carboxyl is –COOH, a carbonyl and a hydroxyl on the same carbon."},{"id":"c","text":"Ether groups (C–O–C links)","correct":false,"why":"Ethers are C–O–C with no hydrogen on the oxygen."},{"id":"d","text":"Phenol groups (aromatic –OH)","correct":false,"why":"Phenols have –OH on an aromatic ring, not on sp³ carbons."}]},{"id":"u2-q002","type":"mcq","unit":2,"part":1,"outcome":"Hydrocarbons, alcohols, ethers and phenols","bloom":"understand","difficulty":2,"source":"general","stem":"The Tyr side-chain –OH (a phenol, pKa ≈ 10) is far more acidic than the Ser side-chain –OH (an alcohol, pKa ≈ 16). Why?","options":[{"id":"a","text":"Resonance spreads the phenoxide's negative charge around the aromatic ring, stabilising it","correct":true,"why":"A more stable conjugate base means a stronger acid."},{"id":"b","text":"Serine's –OH is attached to an aromatic ring, which pulls electrons away from the O–H bond","correct":false,"why":"Serine's –OH is on an aliphatic CH2; tyrosine's is on the ring."},{"id":"c","text":"Phenols contain a carbonyl group next to the –OH, which makes the proton easier to lose","correct":false,"why":"Phenols have no C=O."},{"id":"d","text":"Alcohols are already negatively charged at pH 7, so serine's –OH cannot lose another proton","correct":false,"why":"Alcohol –OH groups are essentially never ionised at physiological pH."}]},{"id":"u2-q003","type":"mcq","unit":2,"part":1,"outcome":"Hydrocarbons, alcohols, ethers and phenols","bloom":"understand","difficulty":2,"source":"general","stem":"Why are epoxides much more reactive than ordinary ethers such as diethyl ether?","options":[{"id":"a","text":"The three-membered C–C–O ring is highly strained, so nucleophiles open it readily","correct":true,"why":"Releasing ring strain drives the reaction; reactive epoxides can damage DNA and proteins."},{"id":"b","text":"Epoxides contain a carbonyl carbon, which is attacked by nucleophiles just like an aldehyde","correct":false,"why":"An epoxide has a C–O–C ring, not a C=O."},{"id":"c","text":"Epoxides are ionic compounds, so they dissociate in water into reactive charged fragments","correct":false,"why":"They are covalent molecules."},{"id":"d","text":"Ordinary ethers have much weaker C–O bonds, so they break apart before they can react","correct":false,"why":"Unstrained ether C–O bonds are relatively strong and stable."}]},{"id":"u2-q004","type":"mcq","unit":2,"part":1,"outcome":"Carbonyl compounds: aldehydes and ketones","bloom":"remember","difficulty":1,"source":"general","stem":"What distinguishes an aldehyde from a ketone?","options":[{"id":"a","text":"In an aldehyde the carbonyl is at the chain end (–CHO); in a ketone it lies between two carbons","correct":true,"why":"This is the difference between aldoses, such as glucose, and ketoses, such as fructose."},{"id":"b","text":"Aldehydes contain a nitrogen atom next to the carbonyl group, whereas ketones contain none","correct":false,"why":"Both are C, H, O compounds."},{"id":"c","text":"Ketones carry an –OH group on the carbonyl carbon itself, whereas aldehydes carry a hydrogen","correct":false,"why":"That would make a carboxylic acid."},{"id":"d","text":"Aldehydes have no C=O double bond; only ketones have a true carbonyl group","correct":false,"why":"Both contain a carbonyl (C=O) group."}]},{"id":"u2-q005","type":"mcq","unit":2,"part":1,"outcome":"Carbonyl compounds: aldehydes and ketones","bloom":"understand","difficulty":2,"source":"general","stem":"Glucose closes into a ring when its C-5 hydroxyl attacks the C-1 aldehyde. Why is the aldehyde carbon the target?","options":[{"id":"a","text":"Oxygen pulls electrons from the carbonyl carbon, leaving it electrophilic, so –OH adds to form a hemiacetal","correct":true,"why":"Nucleophilic addition to carbonyls is one of the most common reactions in biochemistry."},{"id":"b","text":"The aldehyde carbon carries a full negative charge, so it attracts the slightly positive H of the C-5 –OH","correct":false,"why":"It carries a partial positive charge, not a negative one."},{"id":"c","text":"The C=O bond is non-polar, so the C-5 hydroxyl can add across it without any repulsion from the oxygen","correct":false,"why":"It is strongly polarised towards oxygen."},{"id":"d","text":"The aldehyde carbon is the most reduced carbon in glucose, so it is the easiest one to attack and oxidise","correct":false,"why":"C-1 is the most oxidised carbon in glucose."}]},{"id":"u2-q006","type":"mcq","unit":2,"part":1,"outcome":"Carbonyl compounds: aldehydes and ketones","bloom":"apply","difficulty":2,"source":"general","stem":"Acetaldehyde, formed in the liver from ethanol, is converted to acetate by aldehyde dehydrogenase. What type of reaction is this?","options":[{"id":"a","text":"Oxidation of an aldehyde to a carboxylic acid","correct":true,"why":"The –CHO becomes –COOH (acetate at physiological pH); NAD⁺ accepts the electrons."},{"id":"b","text":"Reduction of an aldehyde to a primary alcohol","correct":false,"why":"Reduction would give back ethanol, a primary alcohol."},{"id":"c","text":"Hydrolysis of an ester into an acid and alcohol","correct":false,"why":"Acetaldehyde is not an ester."},{"id":"d","text":"Condensation forming an amide with release of water","correct":false,"why":"No amine is involved."}]},{"id":"u2-q007","type":"mcq","unit":2,"part":1,"outcome":"Carboxylic acids and their derivatives","bloom":"understand","difficulty":1,"source":"general","stem":"Lactic acid has a pKa of about 3.9. In which form is it mainly found in blood at pH 7.4?","options":[{"id":"a","text":"As the lactate anion (–COO⁻)","correct":true,"why":"When pH is far above the pKa, the carboxyl group is almost entirely deprotonated."},{"id":"b","text":"As undissociated lactic acid (–COOH)","correct":false,"why":"That form predominates only when pH is below the pKa."},{"id":"c","text":"As a 50:50 mixture of the two","correct":false,"why":"A 50:50 mixture occurs only at pH = pKa (≈ 3.9)."},{"id":"d","text":"As a positively charged ion","correct":false,"why":"Loss of H⁺ from a carboxyl group gives a negative ion."}]},{"id":"u2-q008","type":"mcq","unit":2,"part":1,"outcome":"Carboxylic acids and their derivatives","bloom":"remember","difficulty":1,"source":"general","stem":"Triacylglycerols, the main storage fats, contain which type of bond between glycerol and the fatty acids?","options":[{"id":"a","text":"Ester bonds, formed between a carboxylic acid and an alcohol","correct":true,"why":"Glycerol's three –OH groups are esterified; lipases hydrolyse these bonds."},{"id":"b","text":"Amide bonds, formed between a carboxylic acid and an amine","correct":false,"why":"Amides need an amine; glycerol has none."},{"id":"c","text":"Phosphoanhydride bonds, formed between two phosphate groups","correct":false,"why":"Those join phosphate groups, as in ATP."},{"id":"d","text":"Glycosidic bonds, formed between a sugar and another alcohol","correct":false,"why":"Glycosidic bonds join sugars."}]},{"id":"u2-q009","type":"mcq","unit":2,"part":1,"outcome":"Carboxylic acids and their derivatives","bloom":"understand","difficulty":3,"source":"general","stem":"Acetyl groups are carried as the thioester acetyl-CoA rather than as an oxygen ester. Why is a thioester a better acyl donor?","options":[{"id":"a","text":"The C–S bond is less resonance-stabilised than an oxygen ester, so acyl transfer releases more energy","correct":true,"why":"The poorly stabilised ground state gives thioesters a high acyl-group transfer potential."},{"id":"b","text":"Sulphur is more electronegative than oxygen, so it pulls electrons away from the carbonyl carbon","correct":false,"why":"Sulphur is less electronegative than oxygen."},{"id":"c","text":"Thioesters are far less reactive in water, so the acetyl group cannot be lost before it is used","correct":false,"why":"Thioesters are reactive; that is why they are useful as donors."},{"id":"d","text":"A thioester contains a phosphoanhydride bond, which stores the energy needed to transfer the acetyl","correct":false,"why":"Acetyl-CoA's energy-rich bond is the thioester itself."}]},{"id":"u2-q010","type":"mcq","unit":2,"part":1,"outcome":"Carboxylic acids and their derivatives","bloom":"remember","difficulty":1,"source":"general","stem":"The bonds linking the α, β and γ phosphate groups of ATP are which type of bond?","options":[{"id":"a","text":"Phosphoanhydride bonds","correct":true,"why":"Two phosphoric acid groups joined with loss of water form an anhydride, which releases a lot of energy on hydrolysis."},{"id":"b","text":"Phosphoester bonds","correct":false,"why":"The bond joining the α-phosphate to ribose is a phosphoester; the bonds between phosphates are anhydrides."},{"id":"c","text":"Phosphodiester bonds","correct":false,"why":"Phosphodiester bonds link nucleotides in DNA and RNA (and close the ring of cAMP); ATP's phosphates are joined by anhydrides."},{"id":"d","text":"N-glycosidic bonds","correct":false,"why":"The N-glycosidic bond links adenine to ribose, not the phosphate groups to each other."}]},{"id":"u2-q011","type":"mcq","unit":2,"part":1,"outcome":"Nitrogen compounds and heterocycles","bloom":"understand","difficulty":2,"source":"general","stem":"Lysine's side-chain amine is protonated at pH 7, but the nitrogen of a peptide bond is not basic. Why?","options":[{"id":"a","text":"In an amide the nitrogen lone pair is delocalised onto the carbonyl, so it can't accept a proton","correct":true,"why":"Resonance also gives the peptide bond partial double-bond character, making it planar."},{"id":"b","text":"Amide nitrogens have no lone pair, because their outer electrons are used in bonds to carbon","correct":false,"why":"The lone pair exists but is delocalised."},{"id":"c","text":"The peptide nitrogen is already permanently positively charged, so it cannot take another proton","correct":false,"why":"It is neutral at physiological pH."},{"id":"d","text":"Amines are acids and amides are bases, so only the amine side chain gives up a proton at pH 7","correct":false,"why":"Amines are bases; amides are essentially neutral."}]},{"id":"u2-q012","type":"mcq","unit":2,"part":1,"outcome":"Nitrogen compounds and heterocycles","bloom":"apply","difficulty":2,"source":"general","stem":"Proline's amino nitrogen is bonded to two carbon atoms within a ring. How is this amine classified?","options":[{"id":"a","text":"A secondary amine","correct":true,"why":"N bonded to two C atoms (and one H) is secondary; it is often called an imino acid."},{"id":"b","text":"A primary amine","correct":false,"why":"A primary amine's N is bonded to one carbon, as in the other standard amino acids."},{"id":"c","text":"A tertiary amine","correct":false,"why":"A tertiary amine's N is bonded to three carbons; this happens only when proline forms a peptide bond."},{"id":"d","text":"A quaternary ammonium","correct":false,"why":"A quaternary ammonium nitrogen carries four carbons and a permanent positive charge; proline's nitrogen has two carbons."}]},{"id":"u2-q013","type":"mcq","unit":2,"part":1,"outcome":"Nitrogen compounds and heterocycles","bloom":"apply","difficulty":2,"source":"general","stem":"Cattle grazing wilted or frost-damaged sorghum can die suddenly. The plant contains cyanogenic glycosides, which carry a nitrile (–C≡N) group. What is released, and what does it inhibit?","options":[{"id":"a","text":"Hydrogen cyanide (HCN), which inhibits cytochrome c oxidase in mitochondria","correct":true,"why":"Damage to the plant releases HCN from the glycoside, which blocks the respiratory chain and causes acute cellular hypoxia."},{"id":"b","text":"Ammonia, which inhibits glycolysis and causes hepatic encephalopathy in the brain","correct":false,"why":"The toxic product of the nitrile group is cyanide."},{"id":"c","text":"Nitrite, which forms carboxyhaemoglobin and so blocks oxygen transport in the blood","correct":false,"why":"Nitrite forms methaemoglobin, and it comes from nitrate, not from cyanogenic glycosides."},{"id":"d","text":"Free glucose, which causes severe hyperglycaemia and inhibits insulin secretion","correct":false,"why":"The sugar released is not the toxic part."}]},{"id":"u2-q014","type":"mcq","unit":2,"part":1,"outcome":"Nitrogen compounds and heterocycles","bloom":"remember","difficulty":2,"source":"general","stem":"Which pairing of heterocycle and biomolecule is correct?","options":[{"id":"a","text":"Imidazole: the histidine side chain","correct":true,"why":"His's imidazole ring (pKa ≈ 6) makes it a key acid–base catalyst and buffer."},{"id":"b","text":"Pyrimidine: adenine (a DNA base)","correct":false,"why":"Adenine and guanine are purines; cytosine, thymine and uracil are pyrimidines."},{"id":"c","text":"Indole: the histidine side chain","correct":false,"why":"Indole is the side chain of tryptophan."},{"id":"d","text":"Thiazole: the tyrosine side chain","correct":false,"why":"The thiazole ring is in thiamine (vitamin B1); tyrosine contains a phenol."}]},{"id":"u2-q015","type":"mcq","unit":2,"part":1,"outcome":"Carboxylic acids and their derivatives","bloom":"analyse","difficulty":2,"source":"general","stem":"Pyruvate is CH3–CO–COO⁻. Which functional groups does it contain?","options":[{"id":"a","text":"A ketone and a carboxylate","correct":true,"why":"The middle carbon is a carbonyl between two carbons (ketone); the end carbon is a deprotonated carboxyl."},{"id":"b","text":"An aldehyde and an alcohol","correct":false,"why":"There is no –CHO and no –OH."},{"id":"c","text":"An ester and a ketone","correct":false,"why":"An ester would need C–O–C linking an acyl group to an alcohol part."},{"id":"d","text":"An amide and a carboxylate","correct":false,"why":"Pyruvate contains no nitrogen."}]}],"flashcards":[{"id":"u2-f001","type":"flashcard","unit":2,"part":1,"outcome":"Hydrocarbons, alcohols, ethers and phenols","source":"general","front":"Alcohol vs phenol?","back":"Alcohol: –OH on an sp³ carbon (pKa ≈ 16). Phenol: –OH on an aromatic ring, more acidic (pKa ≈ 10), e.g. Tyr."},{"id":"u2-f002","type":"flashcard","unit":2,"part":1,"outcome":"Hydrocarbons, alcohols, ethers and phenols","source":"general","front":"Ether vs epoxide?","back":"Ether: R–O–R′, fairly unreactive. Epoxide: strained 3-membered C–C–O ring, very reactive."},{"id":"u2-f003","type":"flashcard","unit":2,"part":1,"outcome":"Carbonyl compounds: aldehydes and ketones","source":"general","front":"Aldehyde vs ketone?","back":"Aldehyde: terminal –CHO (aldoses, e.g. glucose). Ketone: C=O between two carbons (ketoses, e.g. fructose)."},{"id":"u2-f004","type":"flashcard","unit":2,"part":1,"outcome":"Carbonyl compounds: aldehydes and ketones","source":"general","front":"Typical reaction of a carbonyl carbon?","back":"Nucleophilic addition: it is electrophilic (δ⁺). Alcohol + aldehyde gives a hemiacetal (sugar ring formation)."},{"id":"u2-f005","type":"flashcard","unit":2,"part":1,"outcome":"Carboxylic acids and their derivatives","source":"general","front":"Form of –COOH at pH 7.4?","back":"Carboxylate –COO⁻, because pKa ≈ 2–5."},{"id":"u2-f006","type":"flashcard","unit":2,"part":1,"outcome":"Carboxylic acids and their derivatives","source":"general","front":"Ester vs thioester vs amide?","back":"Ester R–CO–O–R′ (fats). Thioester R–CO–S–R′ (acetyl-CoA, high transfer potential). Amide R–CO–NR′2 (peptide bond, most stable)."},{"id":"u2-f007","type":"flashcard","unit":2,"part":1,"outcome":"Carboxylic acids and their derivatives","source":"general","front":"Biological acid anhydrides?","back":"Phosphoanhydride bonds in ATP; the mixed acyl–phosphate anhydride in 1,3-bisphosphoglycerate."},{"id":"u2-f008","type":"flashcard","unit":2,"part":1,"outcome":"Nitrogen compounds and heterocycles","source":"general","front":"Amine vs amide basicity?","back":"Amines are basic (–NH3⁺ at pH 7). Amides are not basic: the lone pair is delocalised onto C=O."},{"id":"u2-f009","type":"flashcard","unit":2,"part":1,"outcome":"Nitrogen compounds and heterocycles","source":"general","front":"Purines vs pyrimidines?","back":"Purines (two rings): adenine, guanine. Pyrimidines (one ring): cytosine, thymine, uracil."},{"id":"u2-f010","type":"flashcard","unit":2,"part":1,"outcome":"Nitrogen compounds and heterocycles","source":"general","front":"Which heterocycle is in His, Trp and thiamine?","back":"His: imidazole. Trp: indole. Thiamine: thiazole (plus a pyrimidine)."}]},{"unit":3,"title":"Chemical equilibrium, pH & buffers","outcomes":["Chemical equilibrium and the equilibrium constant","Ionisation of water and pH","Weak acids, Ka and pKa","Buffers and the Henderson–Hasselbalch equation","Biological buffer systems"],"summary":{"overview":"Every reaction tends towards an equilibrium described by Keq. Water itself ionises slightly, which sets up the pH scale. Weak acids are characterised by their pKa, and mixtures of a weak acid and its conjugate base (buffers) keep the pH of cells and blood within narrow limits.","sections":[{"heading":"Equilibrium","points":["At equilibrium, Keq = [products] / [reactants], each raised to its stoichiometric power.","A large Keq means products are favoured. Keq is fixed at a given temperature, whatever the starting concentrations.","Catalysts, including enzymes, reach equilibrium faster but never change Keq."]},{"heading":"Ionisation of water and pH","points":["H2O ⇌ H⁺ + OH⁻. Because [H2O] is constant (55.5 M), Kw = [H⁺][OH⁻] = 1 × 10⁻¹⁴ M² at 25 °C.","In pure water, [H⁺] = [OH⁻] = 10⁻⁷ M, so pH = 7.","pH = −log[H⁺], and pH + pOH = 14.","The scale is logarithmic: 1 pH unit = a 10-fold change in [H⁺]."]},{"heading":"Weak acids, Ka and pKa","points":["Weak acids dissociate only partly: HA ⇌ H⁺ + A⁻, with Ka = [H⁺][A⁻]/[HA].","pKa = −log Ka; the lower the pKa, the stronger the acid.","Example: 0.1 M acetic acid (Ka = 1.74 × 10⁻⁵) gives [H⁺] ≈ 1.3 × 10⁻³ M, so pH ≈ 2.88.","If x ≪ [HA], the approximation [HA] ≈ starting concentration avoids solving a quadratic."]},{"heading":"Buffers and Henderson–Hasselbalch","points":["A buffer is a weak acid plus its conjugate base; it resists changes in pH.","Henderson–Hasselbalch equation: pH = pKa + log([A⁻]/[HA]).","At pH = pKa the acid and base forms are 50:50, and buffering capacity is greatest.","Buffering is lost once the pH is more than about 1 unit away from the pKa."]},{"heading":"Biological buffers","points":["Phosphate (H2PO4⁻/HPO4²⁻, pKa ≈ 6.86) buffers the cytoplasm at millimolar levels.","Bicarbonate (CO2/HCO3⁻, pKa ≈ 6.1) is the key blood-plasma buffer. Because CO2 is exhaled and HCO3⁻ is regulated by the kidney, it works well at pH 7.4.","Histidine's imidazole (pKa ≈ 6) lets proteins buffer near neutral pH.","Laboratory buffers such as HEPES, PIPES and CHES are sulphonic acids of cyclic amines, chosen for pKa values near physiological pH."]}],"keyTerms":[{"term":"Keq","definition":"Ratio of product to reactant concentrations at equilibrium."},{"term":"Kw","definition":"Ion product of water: [H⁺][OH⁻] = 10⁻¹⁴ M² at 25 °C."},{"term":"pH","definition":"−log[H⁺]; each unit is a 10-fold change."},{"term":"Ka","definition":"Acid dissociation constant, [H⁺][A⁻]/[HA]."},{"term":"pKa","definition":"−log Ka; the pH at which an acid is half dissociated."},{"term":"Buffer","definition":"Weak acid and conjugate base mixture that resists pH change."},{"term":"Henderson–Hasselbalch equation","definition":"pH = pKa + log([A⁻]/[HA])."}],"examTips":["pH = pKa means [A⁻] = [HA]: buffering is strongest there.","Each extra pH unit above the pKa multiplies [A⁻]/[HA] by 10.","Lower pKa = stronger acid = more dissociated at a given pH.","Remember pH + pOH = 14, and that [H⁺] at pH 3 is 100× that at pH 5."]},"questions":[{"id":"u3-q001","type":"mcq","unit":3,"part":1,"outcome":"Chemical equilibrium and the equilibrium constant","bloom":"understand","difficulty":1,"source":"slides","stem":"For the reaction A ⇌ B, K′eq = 1000. What does this tell you?","options":[{"id":"a","text":"At equilibrium [B] is 1000 times [A], so the reaction strongly favours B","correct":true,"why":"Keq = [B]/[A] at equilibrium; a large value means products dominate."},{"id":"b","text":"The reaction reaches equilibrium very quickly, within a fraction of a second","correct":false,"why":"Keq says nothing about rate; that depends on ΔG‡."},{"id":"c","text":"Adding an enzyme would shift the equilibrium further and raise K′eq above 1000","correct":false,"why":"Catalysts never change Keq."},{"id":"d","text":"The reaction cannot run in reverse, because B does not convert back into A","correct":false,"why":"The reverse reaction still occurs; at equilibrium the two rates are equal."}]},{"id":"u3-q002","type":"mcq","unit":3,"part":1,"outcome":"Ionisation of water and pH","bloom":"remember","difficulty":1,"source":"slides","stem":"What is the ion product of water (Kw) at 25 °C?","options":[{"id":"a","text":"[H⁺][OH⁻] = 1 × 10⁻¹⁴ M²","correct":true,"why":"Kw = Keq × [H2O] = 1.8 × 10⁻¹⁶ M × 55.5 M ≈ 10⁻¹⁴ M²."},{"id":"b","text":"[H⁺][OH⁻] = 1 × 10⁻⁷ M²","correct":false,"why":"10⁻⁷ M is each ion's concentration in pure water, not their product."},{"id":"c","text":"[H⁺]/[OH⁻] = 1","correct":false,"why":"That ratio is 1 only in a neutral solution; Kw is a product."},{"id":"d","text":"[H2O] = 55.5 M","correct":false,"why":"This is the molarity of pure water, used to derive Kw."}]},{"id":"u3-q003","type":"mcq","unit":3,"part":1,"outcome":"Ionisation of water and pH","bloom":"apply","difficulty":1,"source":"slides","stem":"Gastric juice has [H⁺] = 1 × 10⁻² M. What are its pH and [OH⁻]?","options":[{"id":"a","text":"pH 2; [OH⁻] = 1 × 10⁻¹² M","correct":true,"why":"pH = −log(10⁻²) = 2; [OH⁻] = 10⁻¹⁴/10⁻² = 10⁻¹² M."},{"id":"b","text":"pH 12; [OH⁻] = 1 × 10⁻² M","correct":false,"why":"That describes a strongly basic solution; this is the pOH confused with the pH."},{"id":"c","text":"pH 2; [OH⁻] = 1 × 10⁻² M","correct":false,"why":"[H⁺] and [OH⁻] must multiply to 10⁻¹⁴ M²."},{"id":"d","text":"pH −2; [OH⁻] = 1 × 10⁻¹⁶ M","correct":false,"why":"The sign is wrong: pH = −log[H⁺] = +2."}]},{"id":"u3-q004","type":"mcq","unit":3,"part":1,"outcome":"Ionisation of water and pH","bloom":"apply","difficulty":2,"source":"slides","stem":"How many times higher is [H⁺] in urine at pH 5 than in blood at pH 7?","options":[{"id":"a","text":"100 times","correct":true,"why":"Two pH units = 10² = 100-fold, because the scale is logarithmic."},{"id":"b","text":"2 times","correct":false,"why":"pH is not linear; each unit is a factor of 10."},{"id":"c","text":"20 times","correct":false,"why":"Two units means 10 × 10 = 100, not 10 × 2."},{"id":"d","text":"1000 times","correct":false,"why":"A 1000-fold difference needs 3 pH units."}]},{"id":"u3-q005","type":"mcq","unit":3,"part":1,"outcome":"Ionisation of water and pH","bloom":"apply","difficulty":1,"source":"slides","stem":"A cleaning solution has pOH = 4. What is its pH?","options":[{"id":"a","text":"10","correct":true,"why":"pH + pOH = 14, so pH = 14 − 4 = 10 (basic)."},{"id":"b","text":"4","correct":false,"why":"This is the pOH, not the pH."},{"id":"c","text":"18","correct":false,"why":"pH and pOH are subtracted from 14, not added to it."},{"id":"d","text":"7","correct":false,"why":"pH 7 would need pOH 7."}]},{"id":"u3-q006","type":"mcq","unit":3,"part":1,"outcome":"Weak acids, Ka and pKa","bloom":"apply","difficulty":3,"source":"slides","stem":"0.1 mol of acetic acid (Ka = 1.74 × 10⁻⁵ M) is dissolved in water to make 1 L. Assuming the acid is the only source of H⁺, what is the approximate pH?","options":[{"id":"a","text":"2.88","correct":true,"why":"x² ≈ 1.74 × 10⁻⁵ × 0.1 = 1.74 × 10⁻⁶, so x = [H⁺] ≈ 1.32 × 10⁻³ M and pH ≈ 2.88."},{"id":"b","text":"1.00","correct":false,"why":"That assumes complete dissociation, which is true only of a strong acid."},{"id":"c","text":"4.76","correct":false,"why":"4.76 is the pKa, the pH of an equimolar acetic acid/acetate buffer."},{"id":"d","text":"5.76","correct":false,"why":"That would need a 10:1 acetate-to-acid ratio."}]},{"id":"u3-q007","type":"mcq","unit":3,"part":1,"outcome":"Weak acids, Ka and pKa","bloom":"analyse","difficulty":2,"source":"slides","stem":"In the acetic acid calculation, why may we approximate [HA] ≈ 0.1 M instead of (0.1 − x)?","options":[{"id":"a","text":"Only about 1.3% of the acid dissociates, so x is negligible next to 0.1 M","correct":true,"why":"For sufficiently weak acids x ≪ [HA]; check afterwards that this holds."},{"id":"b","text":"Acetic acid does not dissociate at all, so its concentration stays exactly 0.1 M","correct":false,"why":"It dissociates slightly; otherwise the pH would be 7."},{"id":"c","text":"Water contributes most of the H⁺ in the solution, so the acid's own x does not matter","correct":false,"why":"The calculation assumes the acid is the only significant H⁺ source."},{"id":"d","text":"The approximation works equally well for strong acids at 0.1 M, such as HCl","correct":false,"why":"Strong acids dissociate completely, so x is not small."}]},{"id":"u3-q008","type":"mcq","unit":3,"part":1,"outcome":"Weak acids, Ka and pKa","bloom":"understand","difficulty":2,"source":"general","stem":"Lactic acid has pKa ≈ 3.9 and acetic acid pKa ≈ 4.8. Which statement is correct?","options":[{"id":"a","text":"Lactic acid is the stronger acid and is more dissociated at any given pH","correct":true,"why":"A lower pKa means a larger Ka, so the acid gives up H⁺ more readily."},{"id":"b","text":"Acetic acid is the stronger acid, because a higher pKa means it releases more H⁺","correct":false,"why":"A higher pKa means a weaker acid."},{"id":"c","text":"Both acids are fully dissociated at pH 3, because pH 3 is below both of their pKa values","correct":false,"why":"At pH 3, below both pKa values, the protonated (HA) forms dominate."},{"id":"d","text":"pKa has no relation to acid strength; only the concentration of the acid matters","correct":false,"why":"pKa is the standard measure of acid strength."}]},{"id":"u3-q009","type":"mcq","unit":3,"part":1,"outcome":"Buffers and the Henderson–Hasselbalch equation","bloom":"apply","difficulty":2,"source":"slides","stem":"An acetate buffer (pKa 4.76) contains 10 times more acetate than acetic acid. What is its pH?","options":[{"id":"a","text":"5.76","correct":true,"why":"pH = pKa + log([A⁻]/[HA]) = 4.76 + log 10 = 5.76."},{"id":"b","text":"3.76","correct":false,"why":"This would be the pH with 10 times more acid than base."},{"id":"c","text":"4.76","correct":false,"why":"pH = pKa only when [A⁻] = [HA]."},{"id":"d","text":"14.76","correct":false,"why":"The log of the ratio (1) is added, not the ratio itself."}]},{"id":"u3-q010","type":"mcq","unit":3,"part":1,"outcome":"Buffers and the Henderson–Hasselbalch equation","bloom":"apply","difficulty":2,"source":"general","stem":"The H2PO4⁻/HPO4²⁻ pair has pKa ≈ 6.86. At pH 6.86, what fraction of this phosphate is present as HPO4²⁻?","options":[{"id":"a","text":"50%","correct":true,"why":"At pH = pKa, log([A⁻]/[HA]) = 0, so the two forms are equal."},{"id":"b","text":"10%","correct":false,"why":"10% HPO4²⁻ would occur about 1 pH unit below the pKa."},{"id":"c","text":"90%","correct":false,"why":"90% would occur about 1 pH unit above the pKa."},{"id":"d","text":"100%","correct":false,"why":"A buffer at its pKa contains both forms."}]},{"id":"u3-q011","type":"mcq","unit":3,"part":1,"outcome":"Buffers and the Henderson–Hasselbalch equation","bloom":"understand","difficulty":2,"source":"slides","stem":"Why is an acetate buffer (pKa 4.76) a poor choice for an experiment run at pH 7.4?","options":[{"id":"a","text":"At pH 7.4, over 2 units above the pKa, nearly all is acetate, leaving little acid to neutralise base","correct":true,"why":"Buffering capacity is lost once pH is more than about 1 unit from the pKa."},{"id":"b","text":"Acetate is toxic to all enzymes at pH 7.4, so it would stop the reaction being studied completely","correct":false,"why":"The problem is buffering capacity, not toxicity."},{"id":"c","text":"Acetate buffers only work above pH 10, where the acetic acid is fully protonated and ready to react","correct":false,"why":"Acetate buffers best around pH 3.8–5.8."},{"id":"d","text":"The buffer would hold the pH at exactly 4.76, because a buffer always fixes the pH at its own pKa","correct":false,"why":"A buffer's pH depends on the [A⁻]/[HA] ratio; the problem is weak resistance to change."}]},{"id":"u3-q012","type":"mcq","unit":3,"part":1,"outcome":"Biological buffer systems","bloom":"apply","difficulty":3,"source":"general","stem":"Blood pH is 7.4 and the effective pKa of the CO2/HCO3⁻ system is 6.1. What is the ratio [HCO3⁻] : [dissolved CO2] in normal blood?","options":[{"id":"a","text":"About 20 : 1","correct":true,"why":"log ratio = 7.4 − 6.1 = 1.3, and 10^1.3 ≈ 20."},{"id":"b","text":"About 1 : 1","correct":false,"why":"A 1:1 ratio would mean pH = 6.1."},{"id":"c","text":"About 1 : 20","correct":false,"why":"This inverts the ratio; pH is above the pKa, so the base form dominates."},{"id":"d","text":"About 1.3 : 1","correct":false,"why":"1.3 is the log of the ratio, not the ratio itself."}]},{"id":"u3-q013","type":"mcq","unit":3,"part":1,"outcome":"Biological buffer systems","bloom":"analyse","difficulty":3,"source":"general","stem":"A calf with severe diarrhoea loses large amounts of bicarbonate in its faeces, while its blood pCO2 stays roughly constant. What happens to blood pH, and why?","options":[{"id":"a","text":"It falls (metabolic acidosis), because [HCO3⁻]/[CO2] drops in pH = 6.1 + log([HCO3⁻]/[CO2])","correct":true,"why":"Losing base lowers the ratio, so the pH drops below 7.4."},{"id":"b","text":"It rises (alkalosis), because bicarbonate is an acid and losing it leaves fewer H⁺ in the blood","correct":false,"why":"HCO3⁻ is the base form; losing it acidifies the blood."},{"id":"c","text":"It stays at exactly 7.4, because the blood buffers hold the pH constant whatever is lost","correct":false,"why":"Buffers resist pH change but cannot stop it when the buffer itself is lost."},{"id":"d","text":"It falls, because CO2 is exhaled faster and the lungs remove the blood's main base","correct":false,"why":"The question states that pCO2 is unchanged; faster exhalation would raise pH."}]},{"id":"u3-q014","type":"mcq","unit":3,"part":1,"outcome":"Biological buffer systems","bloom":"understand","difficulty":2,"source":"slides","stem":"Why do histidine residues help proteins act as buffers near neutral pH?","options":[{"id":"a","text":"The imidazole side chain has a pKa of about 6, close to physiological pH, so it takes up or releases H⁺","correct":true,"why":"Groups buffer best within about 1 unit of their pKa."},{"id":"b","text":"Histidine's side-chain carboxyl group has a pKa of about 12, so it releases H⁺ when the pH starts to rise","correct":false,"why":"α-Carboxyl groups have pKa ≈ 2."},{"id":"c","text":"Histidine is negatively charged at physiological pH, so it binds any H⁺ that is added to the cell","correct":false,"why":"Its imidazole is neutral or positive depending on pH."},{"id":"d","text":"Histidine forms stable covalent bonds with H⁺, removing the protons from solution permanently","correct":false,"why":"Protonation is a reversible acid–base reaction."}]},{"id":"u3-q015","type":"mcq","unit":3,"part":1,"outcome":"Biological buffer systems","bloom":"understand","difficulty":1,"source":"slides","stem":"Which buffer system is most important in mammalian blood plasma?","options":[{"id":"a","text":"Bicarbonate (CO2/HCO3⁻)","correct":true,"why":"CO2 is exhaled by the lungs and HCO3⁻ is regulated by the kidneys, so the system can be adjusted."},{"id":"b","text":"HEPES (a Good's buffer)","correct":false,"why":"HEPES is a synthetic buffer used in the laboratory (in vitro)."},{"id":"c","text":"Acetate (acetic acid)","correct":false,"why":"Acetate's pKa (4.76) is far from blood pH."},{"id":"d","text":"Hydrochloric acid (HCl)","correct":false,"why":"HCl is a strong acid, not a buffer."}]}],"flashcards":[{"id":"u3-f001","type":"flashcard","unit":3,"part":1,"outcome":"Ionisation of water and pH","source":"slides","front":"Kw at 25 °C?","back":"[H⁺][OH⁻] = 1 × 10⁻¹⁴ M². In pure water each ion is 10⁻⁷ M."},{"id":"u3-f002","type":"flashcard","unit":3,"part":1,"outcome":"Ionisation of water and pH","source":"slides","front":"Definition of pH; link to pOH?","back":"pH = −log[H⁺]; pH + pOH = 14. 1 unit = 10-fold change in [H⁺]."},{"id":"u3-f003","type":"flashcard","unit":3,"part":1,"outcome":"Chemical equilibrium and the equilibrium constant","source":"slides","front":"What changes Keq?","back":"Only temperature. Neither starting concentrations nor catalysts change it."},{"id":"u3-f004","type":"flashcard","unit":3,"part":1,"outcome":"Weak acids, Ka and pKa","source":"slides","front":"Ka and pKa?","back":"Ka = [H⁺][A⁻]/[HA]; pKa = −log Ka. Lower pKa = stronger acid."},{"id":"u3-f005","type":"flashcard","unit":3,"part":1,"outcome":"Weak acids, Ka and pKa","source":"slides","front":"Shortcut for [H⁺] of a weak acid?","back":"[H⁺] ≈ √(Ka × [HA]), valid when dissociation is small (x ≪ [HA])."},{"id":"u3-f006","type":"flashcard","unit":3,"part":1,"outcome":"Buffers and the Henderson–Hasselbalch equation","source":"slides","front":"Henderson–Hasselbalch equation?","back":"pH = pKa + log([A⁻]/[HA])."},{"id":"u3-f007","type":"flashcard","unit":3,"part":1,"outcome":"Buffers and the Henderson–Hasselbalch equation","source":"slides","front":"When is buffering capacity greatest? When is it lost?","back":"Greatest at pH = pKa (50:50). Lost beyond about ±1 pH unit from the pKa."},{"id":"u3-f008","type":"flashcard","unit":3,"part":1,"outcome":"Biological buffer systems","source":"slides","front":"Three main in-vivo buffer systems?","back":"Phosphate (intracellular, pKa ≈ 6.86), bicarbonate (
